<body>

    <header class="top-navbar">

        <div class="navbar-right">

                <div class="notification-dropdown" id="notificationDropdown">

    <div class="dashboard-wrapper">

        <aside class="sidebar">

            <a href="admin_login.html" class="logout-btn" id="logoutBtn">

        <main class="content">

            <div class="repo-top-header-block">
                <div class="page-header">
                    <h1>Repository</h1>
                    <p>Manage and organize folders and images stored in your workspace.</p>
                </div>

                <div class="filter-dropdown-wrapper">
                    <button class="add-new-client-btn" id="addNewDropdownTrigger">

                    <div class="add-new-dropdown-box" id="addNewDropdownMenu">

            <div class="repo-sub-actions-container">

                    </div>
                    <div class="repo-select-wrapper">
                        <select>
                            <option>All events</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-arrow"></i>
                    </div>
                    <div class="repo-select-wrapper">
                        <select>

                <div class="client-actions-row">
                    <div class="table-search-box">

            </div>

            <div class="repo-view-container">

                <div class="repo-folders-grid-panel" id="foldersView">
                    <div class="empty-repo-message">Loading active directories...</div>
                </div>

                <div class="repo-photos-grid-panel" id="photosView" style="display:none;">
                    <div class="empty-repo-message">No photos yet.</div>
                </div>

            </div>

        </main>
    </div>
    <div class="modal-overlay" id="createFolderModal">
        <div class="modal-card">

            <div class="modal-header">
                <i class="fa-solid fa-folder-plus"></i>
                <h2>Create Folder</h2>
            </div>

            <form id="newEventForm" class="modal-form">

                <div class="form-field">

                    <input type="text" id="eventNameInput" placeholder="Event Name" required>

                <button class="save-client-btn" type="submit">

                    Create Event

                </button>

        </div>

    <input type="file" id="photoFilesUploader" multiple accept="image/*" style="display: none;">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>/* =========================================================
NOTIFICATION SYSTEM
========================================================= */

        const notificationTrigger =
            document.getElementById("notificationTrigger");

        const notificationDropdown =
            document.getElementById("notificationDropdown");

        const notificationBadge =
            document.getElementById("notificationBadge");

        const notificationList =
            document.getElementById("notificationList");

        const notificationCountText =
            document.getElementById("notificationCountText");

        const markNotificationsRead =
            document.getElementById("markNotificationsRead");


        let notifications = [];

        let notificationsRead = false;


        /* =========================================================
           OPEN / CLOSE NOTIFICATION
        ========================================================= */

        notificationTrigger.addEventListener(
            "click",
            (e) => {

                e.stopPropagation();

                notificationDropdown.classList.toggle(
                    "show"
                );

            }
        );


        /* Prevent dropdown from closing */

        notificationDropdown.addEventListener(
            "click",
            (e) => {

                e.stopPropagation();

            }
        );


        /* Close when clicking outside */

        document.addEventListener(
            "click",
            () => {

                notificationDropdown.classList.remove(
                    "show"
                );

            }
        );


        /* =========================================================
           LOAD NOTIFICATIONS
        ========================================================= */

        async function loadNotifications() {

            if (!currentUser) {
                return;
            }


            try {

                /*
                 * Get recent events created by this admin.
                 */

                const {
                    data,
                    error
                } = await supabaseClient

                    .from("event_folders")

                    .select("*")

                    .eq(
                        "user_id",
                        currentUser.id
                    )

                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )

                    .limit(10);


                if (error) {

                    console.error(
                        "Notification error:",
                        error
                    );

                    return;
                }


                notifications =
                    (data || []).map(
                        event => ({

                            id: event.id,

                            type: "event",

                            title: "New event created",

                            message:
                                `${event.event_name} was added to your repository.`,

                            date:
                                event.created_at

                        })
                    );


                renderNotifications();


            }

            catch (error) {

                console.error(
                    "Notification loading error:",
                    error
                );

            }

        }


        /* =========================================================
           RENDER NOTIFICATIONS
        ========================================================= */

        function renderNotifications() {

            notificationList.innerHTML = "";


            if (
                notifications.length === 0
            ) {

                notificationList.innerHTML = `

            <div class="notification-empty">

                <i class="fa-regular fa-bell-slash"></i>

                <p>
                    No notifications
                </p>

            </div>

        `;


                notificationBadge.style.display =
                    "none";


                notificationCountText.textContent =
                    "No new notifications";


                return;
            }


            /* Number on bell */

            if (!notificationsRead) {

                notificationBadge.textContent =
                    notifications.length;

                notificationBadge.style.display =
                    "flex";


                notificationCountText.textContent =
                    `${notifications.length} notification${notifications.length === 1
                        ? ""
                        : "s"
                    }`;

            }

            else {

                notificationBadge.style.display =
                    "none";

                notificationCountText.textContent =
                    "No new notifications";

            }


            /* Create notification items */

            notifications.forEach(
                notification => {

                    const item =
                        document.createElement("div");


                    item.className =
                        "notification-item";


                    item.innerHTML = `

                <div class="notification-item-icon">

                    <i class="fa-regular fa-folder"></i>

                </div>


                <div class="notification-item-content">

                    <p class="notification-item-title">
                        ${escapeHTML(
                        notification.title
                    )}
                    </p>


                    <p class="notification-item-message">
                        ${escapeHTML(
                        notification.message
                    )}
                    </p>


                    <span class="notification-item-time">
                        ${formatNotificationDate(
                        notification.date
                    )}
                    </span>

                </div>

            `;


                    /* Clicking notification */

                    item.addEventListener(
                        "click",
                        () => {

                            if (
                                notification.type ===
                                "event"
                            ) {

                                window.location.href =
                                    `admin_customer_folders.html?event=${notification.id}`;

                            }

                        }
                    );


                    notificationList.appendChild(
                        item
                    );

                }
            );

        }


        /* =========================================================
           MARK ALL AS READ
        ========================================================= */

        markNotificationsRead.addEventListener(
            "click",
            () => {

                notificationsRead = true;

                notificationBadge.style.display =
                    "none";

                notificationCountText.textContent =
                    "No new notifications";

            }
        );


        /* =========================================================
           FORMAT DATE
        ========================================================= */

        function formatNotificationDate(
            date
        ) {

            if (!date) {

                return "";

            }


            const notificationDate =
                new Date(date);


            const now =
                new Date();


            const difference =
                now.getTime() -
                notificationDate.getTime();


            const minutes =
                Math.floor(
                    difference / 60000
                );


            if (minutes < 1) {

                return "Just now";

            }


            if (minutes < 60) {

                return `${minutes} minute${minutes === 1
                        ? ""
                        : "s"
                    } ago`;

            }


            const hours =
                Math.floor(
                    minutes / 60
                );


            if (hours < 24) {

                return `${hours} hour${hours === 1
                        ? ""
                        : "s"
                    } ago`;

            }


            const days =
                Math.floor(
                    hours / 24
                );


            if (days < 7) {

                return `${days} day${days === 1
                        ? ""
                        : "s"
                    } ago`;

            }


            return notificationDate.toLocaleDateString();

        }

        const createFolderModal =
            document.getElementById("createFolderModal");

        document
            .getElementById("createFolderActionOption")
            .addEventListener("click", (e) => {

                e.preventDefault();
                e.stopPropagation();

                addNewMenu.classList.remove("show");

                createFolderModal.classList.add("show");

            });

        createFolderModal.onclick = (e) => {

            if (e.target === createFolderModal) {

                createFolderModal.classList.remove("show");

            }

        };
        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );
        let currentUser = null;
        let selectedFolderId = null;
        let allFolders = [];
        const addNewBtn = document.getElementById("addNewDropdownTrigger");
        const addNewMenu = document.getElementById("addNewDropdownMenu");

        addNewBtn.addEventListener("click", (e) => {

            e.stopPropagation();

            addNewMenu.classList.toggle("show");

        });

        document.addEventListener("click", () => {

            addNewMenu.classList.remove("show");

        });
        window.addEventListener("load", async () => {

            const {
                data: { session }
            } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = "admin_login.html";
                return;
            }

            currentUser = session.user;

            // Load profile
            const { data: profile } = await supabaseClient
                .from("staff_profiles")
                .select("*")
                .eq("id", currentUser.id)
                .single();

            if (profile) {

                document.getElementById("userName").textContent =
                    profile.full_name;

                if (profile.avatar_url) {
                    document.getElementById("userAvatar").src =
                        profile.avatar_url;
                }
            }

            loadEvents();
            await loadNotifications();
                });

        //LOAD FOLDERS
        async function loadEvents() {

            const { data, error } = await supabaseClient

                .from("event_folders")

                .select("*")

                .eq("user_id", currentUser.id)

                .order("event_name");

            if (error) {

                console.log(error);

                return;

            }

            allFolders = data;

            renderEvents(data);

        }

        async function loadPhotos(folderId) {

            document.getElementById("foldersView").style.display = "none";

            document.getElementById("photosView").style.display = "grid";

            const { data, error } = await supabaseClient

                .from("photos")

                .select("*")

                .eq("folder_id", folderId)

                .order("created_at", { ascending: false });

            if (error) {

                console.log(error);

                return;

            }

            renderPhotos(data);

        }
        function renderPhotos(photos) {

            const view =
                document.getElementById("photosView");


            view.innerHTML = "";


            if (photos.length === 0) {

                view.innerHTML = `
        <div class="empty-repo-message">
            No photos yet.
        </div>`;

                return;
            }


            photos.forEach(photo => {

                view.innerHTML += `

        <div class="photo-card">

            <img src="${photo.image_url}">

        </div>

        `;

            });

        }
        document

            .getElementById("uploadPhotosActionOption")

            .addEventListener("click", () => {

                if (!selectedFolderId) {

                    alert("Please open a folder first.");

                    return;

                }

                document.getElementById("photoFilesUploader").click();

            });
        document

            .getElementById("photoFilesUploader")

            .addEventListener("change", uploadPhotos);
        function renderEvents(events) {

            const view =
                document.getElementById("foldersView");

            view.innerHTML = "";

            if (events.length === 0) {

                view.innerHTML = `

            <div class="empty-repo-message">

                No events yet.

            </div>

        `;

                return;

            }


            events.forEach(event => {

                view.innerHTML += `

        <div class="folder-card"
        data-id="${event.id}">
            <i class="fa-solid fa-folder folder-icon"></i>
            <h3>${event.event_name}</h3>
        </div>

    `;

            });


            document.querySelectorAll(".folder-card").forEach(card => {

                card.onclick = () => {

                    const eventId = card.dataset.id;

                    location.href =
                        `admin_customer_folders.html?event=${eventId}`;

                };

            });


        }
        async function uploadPhotos(e) {

            const files = e.target.files;

            if (!files.length) return;


            for (const file of files) {

                const filePath =
                    `${currentUser.id}/${selectedFolderId}/${Date.now()}_${file.name}`;


                const { error: uploadError } =
                    await supabaseClient.storage
                        .from("repository-photos")
                        .upload(filePath, file);


                if (uploadError) {

                    console.log(uploadError);
                    continue;

                }


                const { data: urlData } =
                    supabaseClient.storage
                        .from("repository-photos")
                        .getPublicUrl(filePath);



                await supabaseClient
                    .from("photos")
                    .insert([{

                        folder_id: selectedFolderId,

                        image_url: urlData.publicUrl,

                        file_name: file.name

                    }]);

            }


            alert("Photos uploaded successfully.");

            loadPhotos(selectedFolderId);

        }
        function renderFolders(folders) {
            const view = document.getElementById("foldersView");

            view.innerHTML = "";

            if (folders.length === 0) {
                view.innerHTML = `
            <div class="empty-repo-message">
                No events found.
            </div>
        `;
                return;
            }

            folders.forEach(event => {

                view.innerHTML += `
            <div class="folder-card" data-id="${event.id}">
                <i class="fa-solid fa-folder folder-icon"></i>
                <h3>${event.event_name}</h3>
            </div>
        `;

            });


            document.querySelectorAll(".folder-card").forEach(card => {

                card.onclick = () => {

                    const eventId = card.dataset.id;

                    selectedFolderId = eventId;

                    location.href =
                        `admin_customer_folders.html?event=${eventId}`;
                };

            });
        }

        document
            .getElementById("newEventForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                const eventName =
                    document.getElementById("eventNameInput").value.trim();

                const { error } = await supabaseClient

                    .from("event_folders")

                    .insert([{

                        user_id: currentUser.id,

                        event_name: eventName

                    }]);

                if (error) {

                    alert(error.message);

                    return;

                }

                createFolderModal.classList.remove("show");

                e.target.reset();

                loadEvents();
                

            });
        //SEARCH FUNCTIONALITY
        document
            .getElementById("repoFolderSearchInput")
            .addEventListener("input", (e) => {

                const keyword =
                    e.target.value.toLowerCase();

                const filtered =

                    allFolders.filter(folder => {

                        return (

                            (folder.folder_name || "")
                                .toLowerCase()
                                .includes(keyword)

                            ||

                            (folder.customer_name || "")
                                .toLowerCase()
                                .includes(keyword)

                            ||

                            (folder.event_type || "")
                                .toLowerCase()
                                .includes(keyword)

                        );

                    });

                renderFolders(filtered);

            });
        document

            .getElementById("logoutBtn")

            .addEventListener("click", async (e) => {

                e.preventDefault();

                await supabaseClient.auth.signOut();

                location.href = "admin_login.html";

            });
    </script>
</body>

</html>
