<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Link - Captured Photography Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/design/customer_enter_link.css?v=1.2">
</head>

<body>
    <header class="top-navbar">
        <div class="logo-section">

            <img id="studioLogo" src="/images/captured.png" alt="Logo" class="logo-img">

            <span>Captured Photography Studio</span>

        </div>

        <div class="navbar-right">

            <div class="user-profile">

                <img id="userProfileImage" src="/images/default-profile.png" alt="Profile" class="user-profile-image">

                <div class="user-profile-info">

                    <span id="userProfileName">
                        Loading...
                    </span>

                    <small id="userProfileEmail"></small>

                </div>

            </div>

        </div>
    </header>

    <div class="dashboard-wrapper">

        <aside class="sidebar">
            <nav>
                <a href="customer_booking.html">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span>Book a Session</span>
                </a>
                <a href="customer_gallery_request.html" class="active">
                    <i class="fa-regular fa-image"></i>
                    <span>My Gallery</span>
                </a>
                <a href="customer_profile.html">
                    <i class="fa-regular fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <a href="customer_homepage.html" class="logout-btn">
                <i class="fa-solid fa-arrow-right-from-bracket logout-icon"></i>
                <span>Log out</span>
            </a>
        </aside>

        <main class="content central-message-container">
            <div class="request-access-card">
                <p class="message-text">
                    Please paste the link you received from the previous step to continue.
                </p>

                <form class="link-entry-form" id="galleryLinkForm">

                    <input type="url" id="galleryLinkInput" class="link-input"
                        placeholder="Paste your gallery link here" autocomplete="off" required>

                    <button type="submit" class="btn-request">
                        Continue
                    </button>

                </form>

                <div id="galleryLinkError" class="gallery-link-error" style="display: none;">
                </div>
            </div>
        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        /* =========================================================
           SUPABASE CONFIGURATION
        ========================================================= */

        const SUPABASE_URL =
            "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =========================================================
           DOM ELEMENTS
        ========================================================= */

        const galleryLinkForm =
            document.getElementById(
                "galleryLinkForm"
            );

        const galleryLinkInput =
            document.getElementById(
                "galleryLinkInput"
            );

        const galleryLinkError =
            document.getElementById(
                "galleryLinkError"
            );


        /* =========================================================
           LOAD LOGGED-IN CUSTOMER
        ========================================================= */

        async function loadCustomerProfile() {

            console.log("Loading customer information...");

            /* =========================================================
               GET LOGGED-IN USER
            ========================================================= */

            const {
                data: { user },
                error: authError
            } = await supabaseClient.auth.getUser();


            if (authError) {

                console.error(
                    "Authentication error:",
                    authError
                );

                return;

            }


            if (!user) {

                window.location.href =
                    "customer_login.html";

                return;

            }


            console.log(
                "Logged-in user:",
                user.id
            );

            console.log(
                "User email:",
                user.email
            );


            /* =========================================================
               GET CUSTOMER PROFILE
            ========================================================= */

            const {
                data: customer,
                error: customerError
            } = await supabaseClient
                .from("customers")
                .select(
                    "id, email, full_name, profile_image, phone"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


            if (customerError) {

                console.error(
                    "Customer profile error:",
                    customerError
                );

            }


            console.log(
                "Customer profile:",
                customer
            );


            /* =========================================================
               CUSTOMER NAME
            ========================================================= */

            const customerName =
                customer?.full_name ||
                user.user_metadata?.full_name ||
                user.user_metadata?.name ||
                user.email ||
                "Customer";


            const nameElement =
                document.getElementById(
                    "userProfileName"
                );


            if (nameElement) {

                nameElement.textContent =
                    customerName;

            }


            /* =========================================================
               CUSTOMER EMAIL
            ========================================================= */

            const emailElement =
                document.getElementById(
                    "userProfileEmail"
                );


            if (emailElement) {

                emailElement.textContent =
                    customer?.email ||
                    user.email ||
                    "";

            }


            /* =========================================================
               CUSTOMER PROFILE IMAGE
            ========================================================= */

            const profileImageElement =
                document.getElementById(
                    "userProfileImage"
                );


            if (profileImageElement) {

                const profileImage =
                    customer?.profile_image ||
                    user.user_metadata?.avatar_url ||
                    user.user_metadata?.picture ||
                    "/images/default-profile.png";


                console.log(
                    "Profile image:",
                    profileImage
                );


                profileImageElement.src =
                    profileImage;


                profileImageElement.onerror =
                    function () {

                        console.warn(
                            "Profile image failed:",
                            this.src
                        );

                        this.onerror = null;

                        this.src =
                            "/images/default-profile.png";

                    };

            }


            return user;

        }

        /* =========================================================
           LOAD STUDIO LOGO
        ========================================================= */

        function loadStudioLogo() {

            const logo =
                document.getElementById(
                    "studioLogo"
                );


            if (!logo) {

                console.warn(
                    "studioLogo element not found."
                );

                return;

            }


            const {
                data
            } =
                supabaseClient.storage
                    .from("studio-assets")
                    .getPublicUrl(
                        "captured.png"
                    );


            if (
                data &&
                data.publicUrl
            ) {

                logo.src =
                    data.publicUrl;


            } else {

                logo.src =
                    "/images/captured.png";

            }


            /* -----------------------------------------
               FALLBACK IF SUPABASE LOGO FAILS
            ----------------------------------------- */

            logo.onerror =
                function () {

                    console.warn(
                        "Studio logo failed to load."
                    );

                    this.onerror = null;

                    this.src =
                        "/images/captured.png";

                };

        }


        /* =========================================================
           ERROR MESSAGE
        ========================================================= */

        function showGalleryLinkError(
            message
        ) {

            galleryLinkError.textContent =
                message;

            galleryLinkError.style.display =
                "block";

            galleryLinkError.style.color =
                "#a32121";

        }


        /* =========================================================
           SUCCESS / LOADING MESSAGE
        ========================================================= */

        function showGalleryLinkMessage(
            message
        ) {

            galleryLinkError.textContent =
                message;

            galleryLinkError.style.display =
                "block";

            galleryLinkError.style.color =
                "#247a3d";

        }


        /* =========================================================
           HIDE MESSAGE
        ========================================================= */

        function hideGalleryLinkError() {

            galleryLinkError.textContent =
                "";

            galleryLinkError.style.display =
                "none";

        }


        /* =========================================================
           VALIDATE GALLERY TOKEN
        ========================================================= */
        async function validateGalleryToken(
            token,
            userId
        ) {

            const {
                data: repository,
                error
            } = await supabaseClient
                .from("repository_client_links")
                .select(`
            id,
            booking_id,
            access_token
        `)
                .eq(
                    "access_token",
                    token
                )
                .maybeSingle();

            if (error) {

                console.error(
                    "Token validation error:",
                    error
                );

                throw error;
            }

            if (!repository) {

                return null;

            }

            /*
             * Verify that this repository belongs
             * to the logged-in customer's booking.
             */

            const {
                data: booking,
                error: bookingError
            } = await supabaseClient
                .from("bookings")
                .select(`
            id,
            customer_id
        `)
                .eq(
                    "id",
                    repository.booking_id
                )
                .eq(
                    "customer_id",
                    userId
                )
                .maybeSingle();

            if (bookingError) {

                console.error(
                    "Booking validation error:",
                    bookingError
                );

                throw bookingError;
            }

            if (!booking) {

                console.warn(
                    "Gallery does not belong to logged-in customer."
                );

                return null;
            }

            return repository;
        }

        async function loadApprovedGallery() {

            try {

                const {
                    data: {
                        user
                    },
                    error: authError
                } = await supabaseClient.auth.getUser();

                if (authError || !user) {

                    window.location.href =
                        "customer_login.html";

                    return;

                }

                console.log(
                    "Finding approved gallery for:",
                    user.id
                );

                /*
                 * Find approved gallery access request
                 */

                const {
                    data: request,
                    error: requestError
                } = await supabaseClient
                    .from("gallery_access_requests")
                    .select(`
                id,
                booking_id,
                repository_id,
                status
            `)
                    .eq(
                        "customer_id",
                        user.id
                    )
                    .eq(
                        "status",
                        "approved"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(1)
                    .maybeSingle();

                if (requestError) {

                    throw requestError;

                }

                if (!request) {

                    showGalleryLinkError(
                        "Your gallery access has not been approved yet."
                    );

                    return;

                }

                /*
                 * Get repository
                 */

                const {
                    data: repository,
                    error: repositoryError
                } = await supabaseClient
                    .from("repository_client_links")
                    .select(`
                id,
                booking_id,
                access_token
            `)
                    .eq(
                        "id",
                        request.repository_id
                    )
                    .eq(
                        "booking_id",
                        request.booking_id
                    )
                    .maybeSingle();

                if (repositoryError) {

                    throw repositoryError;

                }

                if (!repository) {

                    showGalleryLinkError(
                        "Your gallery link has not been created yet."
                    );

                    return;

                }

                /*
                 * Make sure repository belongs
                 * to logged-in customer.
                 */

                const {
                    data: booking,
                    error: bookingError
                } = await supabaseClient
                    .from("bookings")
                    .select(`
                id,
                customer_id
            `)
                    .eq(
                        "id",
                        repository.booking_id
                    )
                    .eq(
                        "customer_id",
                        user.id
                    )
                    .maybeSingle();

                if (bookingError) {

                    throw bookingError;

                }

                if (!booking) {

                    showGalleryLinkError(
                        "This gallery does not belong to your account."
                    );

                    return;

                }

                /*
                 * Gallery is valid
                 */

                const token =
                    repository.access_token;

                if (!token) {

                    showGalleryLinkError(
                        "Your gallery access token is missing."
                    );

                    return;

                }

                showGalleryLinkMessage(
                    "Gallery found. Opening your photos..."
                );

                setTimeout(
                    () => {

                        window.location.href =
                            "customer_gallery_view.html?token=" +
                            encodeURIComponent(token);

                    },
                    500
                );

            } catch (error) {

                console.error(
                    "Automatic gallery loading error:",
                    error
                );

                showGalleryLinkError(
                    "Unable to load your gallery. Please try again."
                );

            }
        }
        async function initializePage() {

            const user =
                await loadCustomerProfile();


            if (!user) {

                return;

            }


            console.log(
                "Customer loaded successfully."
            );
            await loadApprovedGallery();

        }

        initializePage();

        galleryLinkForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                hideGalleryLinkError();


                const enteredLink =
                    galleryLinkInput.value.trim();



                if (!enteredLink) {

                    showGalleryLinkError(
                        "Please enter your gallery link."
                    );

                    return;

                }
                let galleryURL;


                try {

                    galleryURL =
                        new URL(
                            enteredLink
                        );

                } catch {

                    showGalleryLinkError(
                        "Please enter a valid gallery link."
                    );

                    return;

                }


                /* -----------------------------------------
                   GET TOKEN
                ----------------------------------------- */

                const token =
                    galleryURL.searchParams.get(
                        "token"
                    );


                if (
                    !token ||
                    token.trim() === ""
                ) {

                    showGalleryLinkError(
                        "This gallery link is invalid or incomplete."
                    );

                    return;

                }


                /* -----------------------------------------
                   VALIDATE TOKEN
                ----------------------------------------- */

                try {

                    showGalleryLinkMessage(
                        "Checking your gallery link..."
                    );


                    const repository =
                        await validateGalleryToken(
                            token.trim()
                        );


                    /* -----------------------------------------
                       INVALID TOKEN
                    ----------------------------------------- */

                    if (!repository) {

                        showGalleryLinkError(
                            "This gallery link is invalid or has expired."
                        );

                        return;

                    }


                    /* -----------------------------------------
                       VALID TOKEN
                    ----------------------------------------- */

                    showGalleryLinkMessage(
                        "Gallery found. Opening your photos..."
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "customer_gallery_view.html?token=" +
                                encodeURIComponent(
                                    token.trim()
                                );

                        },
                        300
                    );


                } catch (error) {

                    console.error(
                        "Gallery access error:",
                        error
                    );


                    showGalleryLinkError(
                        "Unable to verify your gallery link. Please try again."
                    );

                }

            }
        );

    </script>

</body>

</html>
