<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Folders</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/design/admin_dashboard.css">
    <link rel="stylesheet" href="/design/admin_client.css">
    <link rel="stylesheet" href="/design/admin_repository.css">
</head>

<body>

    <header class="top-navbar">
        <div class="logo-section">
            <img src="/images/captured.png" class="logo-box" alt="Captured Studio Logo">
            <span>Captured Studio</span>
        </div>

        <div class="navbar-right">
            <!-- Clickable notification bell icon -->
            <button type="button" class="notification-btn" id="notificationTrigger" aria-label="Notifications">
                <i class="fa-solid fa-bell"></i>
            </button>
            <div class="user-profile">
                <img id="userAvatar" class="avatar" src="https://via.placeholder.com/42" alt="Profile">
                <span id="userName">Loading...</span>
            </div>
        </div>
    </header>

    <div class="dashboard-wrapper">

        <aside class="sidebar">
            <nav>
                <a href="admin_dashboard.html">
                    <i class="fa-solid fa-table-cells-large"></i>
                    Dashboard
                </a>
                <a href="admin_client.html">
                    <i class="fa-solid fa-users"></i>
                    Clients
                </a>
                <a href="admin_repository.html" class="active">
                    <i class="fa-solid fa-book"></i>
                    Repository
                </a>
                <a href="admin_payment.html">
                    <i class="fa-solid fa-credit-card"></i>
                    Payments
                </a>
                <!-- Archives Menu Item positioned correctly below Payments -->
                <a href="admin_archives.html">
                    <i class="fa-solid fa-box-archive"></i>
                    Archives
                </a>
                <a href="admin_profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
                <a href="admin_settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </nav>

            <a href="admin_login.html" class="logout-btn" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket logout-icon"></i>
                <span>Log out</span>
            </a>
        </aside>

        <main class="content">

            <div class="repo-top-header-block">
                <div class="page-header">
                    <h1 id="eventTitle">Customer Folders</h1>

                    <p>
                        Select a customer folder to manage photos.
                    </p>
                </div>

                <div class="filter-dropdown-wrapper">
                    <button class="add-new-client-btn" id="addNewDropdownTrigger">
                        <i class="fa-solid fa-plus"></i>
                        Add New
                    </button>
                    <div class="add-new-dropdown-box" id="addNewDropdownMenu">
                        <button id="uploadPhotosActionOption">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span>Upload Photos</span>
                        </button>
                        <button id="createFolderActionOption">
                            <i class="fa-regular fa-folder"></i>
                            <span>Create Customer Folder</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="repo-sub-actions-container">
                <div class="repo-filter-selects-group">
                    <div class="repo-select-wrapper">
                        <select>
                            <option>All tags</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-arrow"></i>
                    </div>
                    <div class="repo-select-wrapper">
                        <select>
                            <option>All events</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-arrow"></i>
                    </div>
                    <div class="repo-select-wrapper">
                        <select>
                            <option>Sort by:</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-arrow"></i>
                    </div>
                </div>

                <div class="client-actions-row">
                    <div class="table-search-box">
                        <input type="text" id="repoFolderSearchInput" placeholder="Search repository...">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                </div>
            </div>

            <div class="repo-view-container">

                <div class="repo-folders-grid-panel" id="foldersView">
                    <div class="empty-repo-message">Loading active directories...</div>
                </div>

                <div class="repo-photos-grid-panel" id="photosView" style="display:none;">
                    <div class="empty-repo-message">No photos yet.</div>
                </div>

            </div>

        </main>
    </div>
    <div class="modal-overlay" id="createFolderModal">
        <div class="modal-card">

            <div class="modal-header">
                <i class="fa-solid fa-folder-plus"></i>
                <h2>Create Folder</h2>
            </div>

            <form id="newCustomerFolderForm" class="modal-form">

                <div class="form-field">

                    <input type="text" id="customerNameInput" placeholder="Customer Name" required>

                </div>

                <button type="submit" class="save-client-btn">
                    Create Folder
                </button>

            </form>
        </div>
    </div>
    <input type="file" id="photoFilesUploader" multiple accept="image/*" style="display: none;">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        /* =========================================================
           SUPABASE CONFIGURATION
        ========================================================= */

        const SUPABASE_URL =
            "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        /* =========================================================
           PAGE VARIABLES
        ========================================================= */

        const params = new URLSearchParams(window.location.search);

        const eventId = params.get("event");

        let currentUser = null;
        let selectedFolderId = null;
        let selectedFolder = null;
        let allFolders = [];


        /* =========================================================
           DOM ELEMENTS
        ========================================================= */

        const addNewBtn =
            document.getElementById("addNewDropdownTrigger");

        const addNewMenu =
            document.getElementById("addNewDropdownMenu");

        const createFolderModal =
            document.getElementById("createFolderModal");

        const createFolderActionOption =
            document.getElementById("createFolderActionOption");

        const uploadPhotosActionOption =
            document.getElementById("uploadPhotosActionOption");

        const photoFilesUploader =
            document.getElementById("photoFilesUploader");

        const foldersView =
            document.getElementById("foldersView");

        const photosView =
            document.getElementById("photosView");

        const searchInput =
            document.getElementById("repoFolderSearchInput");


        /* =========================================================
           CHECK EVENT ID
        ========================================================= */

        if (!eventId) {

            alert("No event was selected.");

            window.location.href = "admin_dashboard.html";
        }


        /* =========================================================
           ADD NEW DROPDOWN
        ========================================================= */

        addNewBtn.addEventListener("click", (e) => {

            e.stopPropagation();

            addNewMenu.classList.toggle("show");

        });


        document.addEventListener("click", () => {

            addNewMenu.classList.remove("show");

        });


        /* =========================================================
           OPEN CREATE FOLDER MODAL
        ========================================================= */

        createFolderActionOption.addEventListener("click", (e) => {

            e.preventDefault();

            e.stopPropagation();

            addNewMenu.classList.remove("show");

            createFolderModal.classList.add("show");

            document
                .getElementById("customerNameInput")
                .focus();

        });


        /* =========================================================
           CLOSE MODAL WHEN CLICKING OUTSIDE
        ========================================================= */

        createFolderModal.addEventListener("click", (e) => {

            if (e.target === createFolderModal) {

                createFolderModal.classList.remove("show");

            }

        });


        /* =========================================================
           PAGE LOAD
        ========================================================= */

        window.addEventListener("load", async () => {

            try {

                const {
                    data: { session },
                    error
                } = await supabaseClient.auth.getSession();

                if (error) {

                    console.error(error);

                    window.location.href = "admin_login.html";

                    return;
                }


                /* -------------------------------------------------
                   CHECK LOGIN
                ------------------------------------------------- */

                if (!session) {

                    window.location.href = "admin_login.html";

                    return;
                }


                currentUser = session.user;


                /* -------------------------------------------------
                   LOAD ADMIN PROFILE
                ------------------------------------------------- */

                const {
                    data: profile,
                    error: profileError
                } = await supabaseClient
                    .from("staff_profiles")
                    .select("*")
                    .eq("id", currentUser.id)
                    .single();


                if (profileError) {

                    console.error(
                        "Profile loading error:",
                        profileError
                    );

                }


                if (profile) {

                    document.getElementById("userName").textContent =
                        profile.full_name || "Admin";


                    if (profile.avatar_url) {

                        document.getElementById("userAvatar").src =
                            profile.avatar_url;

                    }

                }


                /* -------------------------------------------------
                   LOAD CUSTOMER FOLDERS
                ------------------------------------------------- */

                await loadCustomerFolders();

            }

            catch (error) {

                console.error(
                    "Page initialization error:",
                    error
                );

            }

        });


        /* =========================================================
           LOAD CUSTOMER FOLDERS
        ========================================================= */

        async function loadCustomerFolders() {

            foldersView.innerHTML = `
        <div class="empty-repo-message">
            Loading customer folders...
        </div>
    `;


            const {
                data,
                error
            } = await supabaseClient
                .from("customer_folders")
                .select("*")
                .eq("event_id", eventId)
                .order("customer_name", {
                    ascending: true
                });


            if (error) {

                console.error(
                    "Error loading folders:",
                    error
                );

                foldersView.innerHTML = `
            <div class="empty-repo-message">
                Failed to load customer folders.
            </div>
        `;

                return;
            }


            /* Save folders globally for search */

            allFolders = data || [];


            renderCustomerFolders(allFolders);

        }


        /* =========================================================
           RENDER CUSTOMER FOLDERS
        ========================================================= */

        function renderCustomerFolders(folders) {

            foldersView.innerHTML = "";


            if (!folders || folders.length === 0) {

                foldersView.innerHTML = `
            <div class="empty-repo-message">
                No customer folders yet.
            </div>
        `;

                return;
            }


            folders.forEach(folder => {

                const folderCard =
                    document.createElement("div");

                folderCard.className = "folder-card";

                folderCard.dataset.id = folder.id;


                folderCard.innerHTML = `
            <i class="fa-solid fa-folder folder-icon"></i>

            <h3>
                ${escapeHTML(folder.customer_name)}
            </h3>
        `;


                /* ---------------------------------------------
                   OPEN FOLDER
                --------------------------------------------- */

                folderCard.addEventListener("click", () => {

                    openCustomerFolder(folder);

                });


                foldersView.appendChild(folderCard);

            });

        }


        /* =========================================================
           OPEN CUSTOMER FOLDER
        ========================================================= */

        function openCustomerFolder(folder) {

            selectedFolderId = folder.id;

            selectedFolder = folder;


            console.log(
                "Selected folder:",
                folder
            );


            /* ---------------------------------------------
               Hide folders
            --------------------------------------------- */

            foldersView.style.display = "none";


            /* ---------------------------------------------
               Show photos
            --------------------------------------------- */

            photosView.style.display = "grid";


            /* ---------------------------------------------
               Update page title
            --------------------------------------------- */

            const eventTitle =
                document.getElementById("eventTitle");

            if (eventTitle) {

                eventTitle.textContent =
                    folder.customer_name;

            }


            /* ---------------------------------------------
               Update description
            --------------------------------------------- */

            const description =
                document.querySelector(".page-header p");

            if (description) {

                description.textContent =
                    "Manage photos for this customer.";

            }


            /* ---------------------------------------------
               Load photos
            --------------------------------------------- */

            loadPhotos(folder.id);

        }


        /* =========================================================
           LOAD PHOTOS
        ========================================================= */

        async function loadPhotos(folderId) {

            photosView.innerHTML = `
        <div class="empty-repo-message">
            Loading photos...
        </div>
    `;


            const {
                data,
                error
            } = await supabaseClient
                .from("photos")
                .select("*")
                .eq("folder_id", folderId)
                .order("created_at", {
                    ascending: false
                });


            if (error) {

                console.error(
                    "Error loading photos:",
                    error
                );


                photosView.innerHTML = `
            <div class="empty-repo-message">
                Failed to load photos.
            </div>
        `;

                return;
            }


            renderPhotos(data || []);

        }


        /* RENDER PHOTOS */

        function renderPhotos(photos) {

            photosView.innerHTML = "";


            if (!photos || photos.length === 0) {

                photosView.innerHTML = `
            <div class="empty-repo-message">
                No photos yet.
                <br>
                Click "Add New → Upload Photos"
                to add photos.
            </div>
        `;

                return;
            }


            photos.forEach(photo => {

                const photoCard =
                    document.createElement("div");

                photoCard.className =
                    "photo-card";


                /*
                 * This assumes your photos table has
                 * an image_url column.
                 *
                 * We can adjust this later depending
                 * on your actual database structure.
                 */

                photoCard.innerHTML = `
            <img
                src="${escapeHTML(photo.image_url || "")}"
                alt="Customer photo"
            >
        `;


                photosView.appendChild(photoCard);

            });

        }


        /*   CREATE CUSTOMER FOLDER   */

        document
            .getElementById("newCustomerFolderForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                console.log("CREATE FOLDER BUTTON CLICKED");


                /* =========================================
                   CHECK USER
                ========================================= */

                if (!currentUser) {

                    alert("Your session has expired. Please log in again.");

                    return;
                }


                /* =========================================
                   CHECK EVENT
                ========================================= */

                if (!eventId) {

                    alert("No event was selected.");

                    return;
                }

                const input =
                    document.getElementById("customerNameInput");

                const customerName =
                    input.value.trim();


                console.log(
                    "Customer name:",
                    customerName
                );

                console.log(
                    "Event ID:",
                    eventId
                );

                console.log(
                    "User ID:",
                    currentUser.id
                );


                if (!customerName) {

                    alert("Please enter a customer name.");

                    input.focus();

                    return;
                }

                const submitButton =
                    document.querySelector(
                        "#newCustomerFolderForm .save-client-btn"
                    );


                if (!submitButton) {

                    console.error(
                        "Create Folder button not found."
                    );

                    alert(
                        "Create Folder button could not be found."
                    );

                    return;
                }


                submitButton.disabled = true;

                submitButton.textContent =
                    "Creating...";


                try {

                    const {
                        data,
                        error
                    } = await supabaseClient
                        .from("customer_folders")
                        .insert({
                            event_id: eventId,
                            user_id: currentUser.id,
                            customer_name: customerName
                        })
                        .select()
                        .single();


                    if (error) {

                        console.error(
                            "SUPABASE CREATE FOLDER ERROR:",
                            error
                        );

                        alert(
                            "Folder could not be created.\n\n" +
                            error.message
                        );

                        return;
                    }

                    console.log(
                        "FOLDER CREATED:",
                        data
                    );


                    /* Close modal */

                    createFolderModal.classList.remove(
                        "show"
                    );


                    /* Clear input */

                    input.value = "";


                    /* Reload folders */

                    await loadCustomerFolders();


                    console.log(
                        "Folder list refreshed."
                    );


                    alert(
                        "Customer folder created successfully!"
                    );

                }

                catch (error) {

                    console.error(
                        "UNEXPECTED ERROR:",
                        error
                    );

                    alert(
                        "Something went wrong.\n\n" +
                        error.message
                    );

                }

                finally {

                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Create Folder";

                }

            });
        /* search customers fodler*/

        searchInput.addEventListener(
            "input",
            (e) => {

                const keyword =
                    e.target.value
                        .trim()
                        .toLowerCase();


                if (!keyword) {

                    renderCustomerFolders(
                        allFolders
                    );

                    return;
                }


                const filtered =
                    allFolders.filter(folder => {

                        const customerName =
                            (
                                folder.customer_name ||
                                ""
                            ).toLowerCase();


                        const folderName =
                            (
                                folder.folder_name ||
                                ""
                            ).toLowerCase();


                        const eventType =
                            (
                                folder.event_type ||
                                ""
                            ).toLowerCase();


                        return (
                            customerName.includes(
                                keyword
                            )

                            ||

                            folderName.includes(
                                keyword
                            )

                            ||

                            eventType.includes(
                                keyword
                            )
                        );

                    });


                renderCustomerFolders(
                    filtered
                );

            }
        );


        /* =========================================================
           UPLOAD PHOTOS BUTTON
        ========================================================= */

        uploadPhotosActionOption.addEventListener(
            "click",
            () => {

                addNewMenu.classList.remove("show");


                /* ---------------------------------------------
                   Make sure a folder is selected
                --------------------------------------------- */

                if (!selectedFolderId) {

                    alert(
                        "Please open a customer folder first."
                    );

                    return;
                }


                /* ---------------------------------------------
                   Open file selector
                --------------------------------------------- */

                photoFilesUploader.click();

            }
        );


        /* =========================================================
           PHOTO FILE SELECTION
        ========================================================= */

        photoFilesUploader.addEventListener(
            "change",
            async (e) => {

                const files =
                    Array.from(e.target.files);


                if (!selectedFolderId) {

                    alert(
                        "Please open a customer folder first."
                    );

                    return;
                }


                if (files.length === 0) {

                    return;
                }


                console.log(
                    "Selected folder:",
                    selectedFolderId
                );


                console.log(
                    "Selected photos:",
                    files
                );


                /*
                 * -------------------------------------------------
                 * FUTURE PHOTO PROCESSING
                 * -------------------------------------------------
                 *
                 * This is where we will eventually:
                 *
                 * 1. Upload the photo to Supabase Storage
                 * 2. Save its URL to the photos table
                 * 3. Send the image to your ML system
                 * 4. Receive the ML result
                 * 5. Categorize/tag the photo
                 * 6. Display the processed photos
                 *
                 * For now, nothing is uploaded yet.
                 */


                alert(
                    files.length +
                    " photo(s) selected.\n\n" +
                    "Photo uploading and machine learning " +
                    "processing will be added next."
                );


                /* Reset input so the same files
                   can be selected again */

                photoFilesUploader.value = "";

            }
        );


        /* LOGOUT */

        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                async (e) => {

                    e.preventDefault();


                    await supabaseClient.auth.signOut();


                    window.location.href =
                        "admin_login.html";

                }
            );




        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }
    </script>
</body>

</html>
