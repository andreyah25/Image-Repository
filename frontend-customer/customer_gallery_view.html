            async function fetchBooking(bookingId) {

            /* =========================================================
               CHECK HIGH-QUALITY ACCESS

            function canAccessHighQuality() {

        if (!currentAccessRequest) {

            return false;
        }


            if (
            String(
            currentAccessRequest.status || ""
            ).toLowerCase() !== "approved"
            ) {

            return false;
        }


            if (
            currentAccessRequest.access_expires_at
            ) {

            const expiresAt =
            new Date(
            currentAccessRequest.access_expires_at
            );


            if (
            !Number.isNaN(
            expiresAt.getTime()
            ) &&
                new Date() >= expiresAt
            ) {

                return false;

            }

        }
            let requestNumber =
            Number(
            currentAccessRequest.request_number
            );


            if (
            !Number.isFinite(requestNumber) ||
            requestNumber < 1
            ) {

                requestNumber = 1;

        }


          

            if (requestNumber === 1) {

            return true;

        }

        if (requestNumber >= 2) {

            const paymentConfirmed =
            currentAccessRequest.payment_confirmed === true;


            const paymentPaid =
            String(
            currentAccessRequest.payment_status || ""
            ).toLowerCase() === "paid";


            return (
            paymentConfirmed &&
            paymentPaid
            );

        }


            return false;
    }

            async function downloadPhoto(photo) {


        if (!canAccessHighQuality()) {

                openPaymentModal();

            return;
        }


            if (!photo) {

                alert(
                    "Photo is not available."
                );

            return;
        }


            try {

            const {
                token
            } =
            getGalleryParameters();


            const requestId =
            currentAccessRequest?.id;


            if (!token) {

                throw new Error(
            "Gallery token is missing."
            );

            }


            if (!requestId) {

                throw new Error(
            "Gallery access request ID is missing."
            );

            }


            const response =
            await fetch(
            `${SERVER_URL}/api/gallery-access/open/${encodeURIComponent(requestId)}` +
            `?token=${encodeURIComponent(token)}`
            );


            if (!response.ok) {

                const errorText =
            await response.text();

            console.error(
            "GALLERY: Download response:",
            errorText
            );


            throw new Error(
            "Unable to download photo."
            );

            }


            const blob =
            await response.blob();


            const blobUrl =
            URL.createObjectURL(
            blob
            );


            const link =
            document.createElement("a");


            link.href =
            blobUrl;


            link.download =
            photo.original_name ||
            "gallery-photo.jpg";


            document.body.appendChild(
            link
            );


            link.click();


            document.body.removeChild(
            link
            );


            setTimeout(
                () => {
                URL.revokeObjectURL(
                    blobUrl
                );
                },
            1000
            );


        } catch (error) {

                console.error(
                    "GALLERY: Photo download error:",
                    error
                );


            alert(
            error.message ||
            "Unable to download the photo."
            );

        }
    }

            async function downloadAllPhotos() {

        if (!canAccessHighQuality()) {

                openPaymentModal();

            return;
        }


            if (
            !currentPhotos ||
            currentPhotos.length === 0
            ) {

                alert(
                    "No photos available to download."
                );

            return;
        }


            const originalText =
            downloadAllBtn.innerHTML;


            downloadAllBtn.disabled =
            true;


            downloadAllBtn.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Downloading...
            `;


            let successfulDownloads = 0;


            try {

            for (
            let i = 0;
            i < currentPhotos.length;
            i++
            ) {

                const photo =
            currentPhotos[i];


            try {

                await downloadPhoto(
                    photo
                );


            successfulDownloads++;


            await new Promise(
                        resolve =>
            setTimeout(
            resolve,
            500
            )
            );

                } catch (error) {

                console.error(
                    "GALLERY: Failed to download:",
                    error
                );

                }

            }


            alert(
            `${successfulDownloads} of ${currentPhotos.length} photos downloaded.`
            );


        } finally {

                downloadAllBtn.disabled =
                false;


            downloadAllBtn.innerHTML =
            originalText;

        }
    }

            async function startPayMongoGalleryPayment() {

        if (!currentAccessRequest) {

                alert(
                    "Your gallery access request could not be verified."
                );

            return;
        }


            if (
            canAccessHighQuality()
            ) {

                closePaymentModal();

            return;

        }


            if (
            currentAccessRequest.payment_required !== true
            ) {

                alert(
                    "Payment is not required for this gallery request."
                );

            return;
        }


            if (
            currentAccessRequest.payment_confirmed === true
            ) {

                alert(
                    "Your gallery payment has already been confirmed."
                );

            return;
        }


            try {

            if (btnPayMongo) {

                btnPayMongo.disabled =
                true;

            btnPayMongo.innerHTML =
            `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Creating Payment...
            `;

            }


            const {
                token
            } =
            getGalleryParameters();


            const response =
            await fetch(
            `${SERVER_URL}/api/gallery-access/create-payment`,
            {
                method: "POST",

            headers: {
                "Content-Type":
            "application/json"
                        },

            body: JSON.stringify({

                requestId:
            currentAccessRequest.id,

            token:
            token

                        })
                    }
            );


            const result =
            await response.json();


            if (
            !response.ok ||
            !result.success
            ) {

                throw new Error(
            result.message ||
            "Unable to create payment."
            );

            }


            if (!result.checkoutUrl) {

                throw new Error(
            "PayMongo checkout URL was not returned."
            );

            }


            sessionStorage.setItem(
            "galleryPaymentRequestId",
            currentAccessRequest.id
            );


            window.location.href =
            result.checkoutUrl;


        } catch (error) {

                console.error(
                    "GALLERY: PayMongo error:",
                    error
                );


            alert(
            error.message ||
            "Unable to start payment."
            );


            if (btnPayMongo) {

                btnPayMongo.disabled =
                false;

            btnPayMongo.innerHTML =
            `
            <i class="fa-solid fa-credit-card"></i>
            Pay with PayMongo
            `;

            }

        }

    }
            async function checkGalleryPayment() {

        const params =
            new URLSearchParams(
            window.location.search
            );


            if (
            params.get("payment") !== "success"
            ) {

            return;

        }


            const requestId =
            params.get("requestId") ||
            sessionStorage.getItem(
            "galleryPaymentRequestId"
            );


            const token =
            params.get("token");


            if (!requestId) {
            return;
        }


            for (
            let i = 0;
            i < 10;
            i++
            ) {

            try {

                const response =
            await fetch(
            `${SERVER_URL}/api/gallery-access/payment-status/${requestId}` +
            `?token=${encodeURIComponent(token || "")}`
            );


            const result =
            await response.json();


            if (
            result.paymentConfirmed === true
            ) {

                currentAccessRequest.payment_confirmed =
                true;


            currentAccessRequest.payment_status =
            "paid";


            currentAccessRequest.payment_required =
            true;


            if (
            result.accessExpiresAt
            ) {

                currentAccessRequest.access_expires_at =
                result.accessExpiresAt;

                    }


            galleryPreviewMode =
            false;


            renderGalleryPhotos(
            currentPhotos
            );


            sessionStorage.removeItem(
            "galleryPaymentRequestId"
            );


            alert(
            "Payment confirmed! Your gallery is now unlocked."
            );


            return;

                }

            } catch (error) {

                console.error(
                    "GALLERY: Payment verification error:",
                    error
                );

            }


            await new Promise(
                resolve =>
            setTimeout(
            resolve,
            1500
            )
            );

        }


            alert(
            "Payment is still being verified. Please refresh shortly."
            );

    }

            function showGalleryError(
            title,
            message
            ) {

        if (galleryTitle) {

                galleryTitle.textContent =
                title;

        }


            if (gallerySubtitle) {

                gallerySubtitle.textContent =
                message;

        }


            if (downloadAllBtn) {

                downloadAllBtn.style.display =
                "none";

        }


            if (!galleryGrid) {
            return;
        }


            galleryGrid.innerHTML = `
            <div class="gallery-loading">

                <i class="fa-solid fa-link-slash"></i>

                <p>
                    ${escapeHTML(message)}
                </p>

                <a
                    href="/customer_gallery_request.html"
                    style="
                        display:inline-block;
                        margin-top:15px;
                        padding:10px 18px;
                        background:#639A88;
                        color:white;
                        text-decoration:none;
                        border-radius:8px;
                    "
                >
                    Enter Gallery Link
                </a>

            </div>
        `;

    }

    function formatDate(dateString) {

        if (!dateString) {

            return "Date not specified";

        }


        const date =
            new Date(
                dateString +
                "T00:00:00"
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return dateString;

        }


        return date.toLocaleDateString(
            "en-US",
            {
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );

    }


    function escapeHTML(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    async function initializeGallery() {

        console.log(
            "===================================="
        );

        console.log(
            "GALLERY: Starting initialization..."
        );

        console.log(
            "URL:",
            window.location.href
        );

        console.log(
            "===================================="
        );


        const photosLoaded =
            await loadRepositoryPhotos();


        if (!photosLoaded) {
            return;
        }


        /*
         * Load customer/booking information AFTER
         * the gallery request and photos are available.
         */

        await loadBookingInformation();


       

        await checkGalleryPayment();

        renderGalleryPhotos(
            currentPhotos
        );


        console.log(
            "GALLERY: Initialization complete."
        );

    }

    window.addEventListener(
        "DOMContentLoaded",
        async () => {

            await initializeGallery();

        }
    );

    </script>
