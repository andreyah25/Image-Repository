        function escapeHTML(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* =========================================================
           LOAD NOTIFICATIONS
        ========================================================= */

        async function loadNotifications() {

            if (!currentUser) {
                return;
            }

            try {

                const {
                    data,
                    error
                } = await supabaseClient

                    .from("notifications")

                    .select(`
                id,
                booking_id,
                recipient,
                title,
                message,
                is_read,
                created_at

                    .eq("recipient", "admin")

                    .order("created_at", {

                }


                notifications = data || [];

            catch (error) {

                );

            }

        }


        /* =========================================================
           RENDER NOTIFICATIONS
        ========================================================= */

        function renderNotifications() {

            notificationList.innerHTML = "";


            if (!notifications || notifications.length === 0) {

                notificationList.innerHTML = `

            <div class="notification-empty">

                <i class="fa-regular fa-bell-slash"></i>

                <p>No notifications</p>

            </div>

        `;

                notificationBadge.style.display = "none";

                notificationCountText.textContent =
                    "No new notifications";

                return;
            }


            /* =====================================================
               COUNT ONLY UNREAD NOTIFICATIONS
            ===================================================== */

            const unreadNotifications =
                notifications.filter(
                    notification => !notification.is_read
                );


            const unreadCount =
                unreadNotifications.length;


            if (unreadCount > 0) {

                notificationBadge.textContent =
                    unreadCount;

                notificationBadge.style.display =
                    "flex";

                notificationCountText.textContent =
                    `${unreadCount} notification${unreadCount === 1 ? "" : "s"}`;

            }

            else {

                notificationBadge.style.display =
                    "none";

                notificationCountText.textContent =
                    "No new notifications";

            }


            /* =====================================================
               CREATE NOTIFICATION ITEMS
            ===================================================== */

            notifications.forEach(notification => {

                const item =
                    document.createElement("div");


                item.className =
                    "notification-item";


                /*
                 * Add unread class.
                 * You can style this in CSS if needed.
                 */

                if (!notification.is_read) {

                    item.classList.add("unread");

                }


                item.innerHTML = `

            <div class="notification-item-icon">

                <i class="fa-regular fa-folder"></i>

            </div>


            <div class="notification-item-content">

                <p class="notification-item-title">

                    ${escapeHTML(
                    notification.title ||
                    "Notification"
                )}

                </p>


                <p class="notification-item-message">

                    ${escapeHTML(
                    notification.message ||
                    ""
                )}

                </p>


                <span class="notification-item-time">

                    ${formatNotificationDate(
                    notification.created_at
                )}

                </span>

            </div>

        `;


                /* =================================================
                   CLICK NOTIFICATION
                ================================================= */

                item.addEventListener("click", async () => {

                    /*
                     * Mark this notification as read.
                     */

                    if (!notification.is_read) {

                        const {
                            error
                        } = await supabaseClient

                            .from("notifications")

                            .update({
                                is_read: true
                            })

                            .eq("id", notification.id);


                        if (error) {

                            console.error(
                                "Could not mark notification as read:",
                                error
                            );

                        }
                        else {

                            notification.is_read = true;

                        }

                    }


                    /*
                     * If notification belongs to a booking,
                     * open that customer's repository.
                     */

                    if (notification.booking_id) {

                        window.location.href =
                            `admin_customer_folders.html?booking=${encodeURIComponent(
                                notification.booking_id
                            )}`;

                    }

                });


                notificationList.appendChild(item);

            });

        }


        /* =========================================================
           MARK ALL NOTIFICATIONS AS READ
        ========================================================= */

        markNotificationsRead.addEventListener(
            "click",
            async () => {

                if (!currentUser) {
                    return;
                }


                const unreadNotifications =
                    notifications.filter(
                        notification => !notification.is_read
                    );


                if (unreadNotifications.length === 0) {

                        "none";

                    notificationCountText.textContent =
                        "No new notifications";

                    return;
                }


                const {
                    error
                } = await supabaseClient

                    .from("notifications")

                    .update({
                        is_read: true
                    })

                    .eq("recipient", "admin")
                    .eq("is_read", false);


                if (error) {

                    console.error(
                        "Mark notifications read error:",
                        error
                    );

                    return;
                }


                /*
                 * Update local data immediately.
                 */

                notifications.forEach(notification => {

                    notification.is_read = true;

                });


                notificationBadge.style.display =
                    "none";

                notificationCountText.textContent =
                    "No new notifications";


                renderNotifications();

            }
        );


        /* =========================================================
           FORMAT NOTIFICATION DATE
        ========================================================= */

        function formatNotificationDate(date) {

            if (!date) {
                return "";
            }


            const notificationDate =
                new Date(date);

            const now =
                new Date();

            const difference =
                now.getTime() -
                notificationDate.getTime();


            const minutes =
                Math.floor(
                    difference / 60000
                );


            if (minutes < 1) {

                return "Just now";

            }


            if (minutes < 60) {

                return `${minutes} minute${minutes === 1 ? "" : "s"} ago`;

            }


            const hours =
                Math.floor(
                    minutes / 60
                );


            if (hours < 24) {

                return `${hours} hour${hours === 1 ? "" : "s"} ago`;

            }


            const days =
                Math.floor(
                    hours / 24
                );


            if (days < 7) {

                return `${days} day${days === 1 ? "" : "s"} ago`;

            }


            return notificationDate.toLocaleDateString(
                "en-US",
                {
                    month: "short",
                    day: "numeric",
                    year: "numeric"
                }
            );

        }

                /*

            </div>

            <h3>

        `;

        function renderCustomerFolders(bookings) {

            const view =
                document.getElementById("foldersView");

            view.style.display = "grid";

            document.getElementById("photosView").style.display = "none";

            view.innerHTML = "";

            if (!bookings || bookings.length === 0) {

                view.innerHTML = `
            <div class="empty-repo-message">
                No completed customer bookings yet.
            </div>
        `;

                return;
            }

            /*
             * Counter for each package.
             *
             * Basic Package:
             * basic_1
             * basic_2
             *
             * Premium Package:
             * premium_1
             * premium_2
             */

            const packageCounters = {};

            bookings.forEach(booking => {

                const packageName =
                    booking.session_type || "Package";

                /*
                 * Convert package name into folder-safe name.
                 *
                 * Basic Package
                 *      ↓
                 * basic
                 */

                const packageSlug =
                    packageName
                        .toLowerCase()
                        .replace(/\s*package\s*/gi, "")
                        .trim()
                        .replace(/[^a-z0-9]+/g, "_")
                        .replace(/^_+|_+$/g, "");

                /*
                 * Increment package counter.
                 */

                if (!packageCounters[packageSlug]) {

                    packageCounters[packageSlug] = 1;

                } else {

                    packageCounters[packageSlug]++;
                }

                const folderNumber =
                    packageCounters[packageSlug];

                const folderName =
                    `${packageSlug}_${folderNumber}`;

                /*
                 * Create repository folder.
                 */

                const card =
                    document.createElement("div");

                card.className =
                    "folder-card repository-client-card";

                card.dataset.bookingId =
                    booking.id;

                card.dataset.folderName =
                    folderName;

                card.innerHTML = `

            <div class="folder-icon-wrapper">

                <i class="fa-solid fa-folder folder-icon"></i>

            </div>

            <div class="client-name">

                <strong>
                    ${escapeHTML(folderName)}
                </strong>

            </div>

            <div class="client-event">

                <i class="fa-solid fa-camera"></i>

                <span>
                    ${escapeHTML(packageName)}
                </span>

            </div>

            <div class="client-date">

                <i class="fa-regular fa-calendar"></i>

                <span>
                    ${escapeHTML(
                    formatRepositoryDate(
                        booking.booking_date
                    )
                )}
                </span>

            </div>

            <div class="client-status">

                <i class="fa-solid fa-user"></i>

                <span>
                    ${escapeHTML(
                    booking.full_name ||
                    "Unnamed Customer"
                )}
                </span>

            </div>

        `;

                /*
                 * Open this customer's repository.
                 */

                card.addEventListener("click", () => {

                    window.location.href =
                        `admin_customer_folders.html?booking=${encodeURIComponent(
                            booking.id
                        )}`;

                });

                view.appendChild(card);

            });
        }
        function formatRepositoryDate(dateString) {

            if (!dateString) {
                return "-";
            }

            const date =
                new Date(dateString + "T00:00:00");

            if (Number.isNaN(date.getTime())) {
                return dateString;
            }

            return date.toLocaleDateString(
                "en-US",
                {
                    month: "short",
                    day: "numeric",
                    year: "numeric"
                }
            );
        }

        async function uploadPhotos(e) {

            const files = e.target.files;

            if (!files.length) return;


            for (const file of files) {

                const filePath =
                    `${currentUser.id}/${selectedFolderId}/${Date.now()}_${file.name}`;


                const { error: uploadError } =
                    await supabaseClient.storage
                        .from("repository-photos")
                        .upload(filePath, file);


                if (uploadError) {

                    console.log(uploadError);
                    continue;

                }


                const { data: urlData } =
                    supabaseClient.storage
                        .from("repository-photos")
                        .getPublicUrl(filePath);



                await supabaseClient
                    .from("photos")
                    .insert([{

                        folder_id: selectedFolderId,

                        image_url: urlData.publicUrl,

                        file_name: file.name

                    }]);

            }


            alert("Photos uploaded successfully.");

            loadPhotos(selectedFolderId);

        }

                    selectedFolderId = eventId;

                    location.href =
                        `admin_customer_folders.html?event=${eventId}`;
                };

            });
        }

        document
            .getElementById("newEventForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                const eventName =
                    document.getElementById("eventNameInput").value.trim();

                const { error } = await supabaseClient

                    .from("event_folders")

                    .insert([{

                        user_id: currentUser.id,

                        event_name: eventName

                    }]);

                if (error) {

                    alert(error.message);

                    return;

                }

                createFolderModal.classList.remove("show");

                e.target.reset();

                loadEvents();


            });
        //SEARCH FUNCTIONALITY
        document
            .getElementById("repoFolderSearchInput")
            .addEventListener("input", (e) => {

                const keyword =
                    e.target.value
                        .trim()
                        .toLowerCase();

                const filtered =
                    allFolders.filter(packageName =>
                        packageName
                            .toLowerCase()
                            .includes(keyword)
                    );

                renderPackageFolders(filtered);

            });

        document

            .getElementById("logoutBtn")

            .addEventListener("click", async (e) => {

                e.preventDefault();

                await supabaseClient.auth.signOut();

                location.href = "admin_login.html";

            });
    </script>
</body>

</html>
