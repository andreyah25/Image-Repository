<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/design/admin_dashboard.css">
    <link rel="stylesheet" href="/design/admin_client_list.css">
    <link rel="stylesheet" href="/design/admin_repository.css">
    <link rel="stylesheet" href="/design/admin_archives.css?v=1.2">
</head>

<body>

    <header class="top-navbar">
        <div class="logo-section">
            <img src="/images/captured.png" class="logo-box" alt="Captured Studio Logo">
            <span>Captured Studio</span>
        </div>

        <div class="navbar-right">
            <button type="button" class="notification-btn" id="notificationTrigger" aria-label="Notifications">
                <i class="fa-solid fa-bell"></i>
            </button>
            <div class="user-profile">
                <img id="userAvatar" class="avatar" src="https://via.placeholder.com/42" alt="Profile">
                <span id="userName">Loading...</span>
            </div>
        </div>
    </header>

    <div class="dashboard-wrapper">

        <aside class="sidebar">
            <nav>
                <a href="admin_dashboard.html">
                    <i class="fa-solid fa-table-cells-large"></i>
                    Dashboard
                </a>
                <a href="admin_client.html">
                    <i class="fa-solid fa-users"></i>
                    Clients
                </a>
                <a href="admin_repository.html">
                    <i class="fa-solid fa-book"></i>
                    Repository
                </a>
                <a href="admin_payment.html">
                    <i class="fa-solid fa-credit-card"></i>
                    Payments
                </a>
                <a href="admin_archives.html" class="active">
                    <i class="fa-solid fa-box-archive"></i>
                    Archives
                </a>
                <a href="admin_profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
                <a href="admin_settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </nav>

            <a href="admin_login.html" class="logout-btn" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket logout-icon"></i>
                <span>Log out</span>
            </a>
        </aside>

        <main class="content">

            <div class="repo-top-header-block">
                <div class="page-header">
                    <h1>Archives</h1>
                    <p>Review and manage archived customers, folders, and bookings.</p>
                </div>
            </div>

            <div class="archive-tab-navigation">
                <button type="button" class="archive-tab-btn active" data-filter="all">All Archives</button>
                <button type="button" class="archive-tab-btn" data-filter="customer">All Customers</button>
                <button type="button" class="archive-tab-btn" data-filter="folder">All Folders</button>
                <button type="button" class="archive-tab-btn" data-filter="booking">All Bookings</button>
            </div>

            <div class="archive-controls-row">
                <div class="archive-search-wrapper">
                    <input type="text" id="archiveSearchInput" placeholder="Search" autocomplete="off">

                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>

            </div>

            <div class="archive-table-card">
                <table class="archive-table">
                    <thead>
                        <tr>
                            <th style="width: 35%;">Item</th>
                            <th style="width: 20%;">Type</th>
                            <th style="width: 25%;">Archived On</th>
                            <th style="width: 25%; text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="archiveTableBody">
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        // Dynamic local database storage array matching your requirements.
        // You can easily replace this array with database tables later!
        let archiveItems = [];

        let currentFilter = "all";
        function escapeHtml(value) {
            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Function to render the table data dynamically based on active filter button
        function renderArchiveTable() {
            const tbody = document.getElementById("archiveTableBody");
            tbody.innerHTML = "";

            const searchInput = document.getElementById("archiveSearchInput");
            const packageFilter = document.getElementById("packageFilter");

            const searchTerm = searchInput
                ? searchInput.value.trim().toLowerCase()
                : "";

            const selectedPackage = packageFilter
                ? packageFilter.value.toLowerCase()
                : "all";

            const filteredItems = archiveItems.filter(item => {

                // -----------------------------------------
                // 1. ARCHIVE CATEGORY FILTER
                // -----------------------------------------
                if (currentFilter !== "all" && item.category !== currentFilter) {
                    return false;
                }

                // -----------------------------------------
                // 2. PACKAGE / SESSION TYPE FILTER
                // -----------------------------------------
                if (
                    selectedPackage !== "all" &&
                    item.sessionType.toLowerCase() !== selectedPackage
                ) {
                    return false;
                }

                // -----------------------------------------
                // 3. SEARCH FILTER
                // -----------------------------------------
                if (searchTerm) {

                    const searchableText = [
                        item.title,
                        item.subtext,
                        item.email,
                        item.sessionType,
                        item.bookingDate,
                        item.archivedDate,
                        item.date,
                        item.time
                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();

                    if (!searchableText.includes(searchTerm)) {
                        return false;
                    }
                }

                return true;
            });

            // -----------------------------------------
            // NO RESULTS
            // -----------------------------------------
            if (filteredItems.length === 0) {
                tbody.innerHTML = `
            <tr>
                <td colspan="4" style="
                    text-align: center;
                    color: #888888;
                    padding: 30px;
                ">
                    No archived items found.
                </td>
            </tr>
        `;
                return;
            }

            // -----------------------------------------
            // DISPLAY RESULTS
            // -----------------------------------------
            filteredItems.forEach(item => {

                const tr = document.createElement("tr");

                tr.innerHTML = `
            <td>
                <div class="item-meta-cell">
                    <h4>${escapeHtml(item.title)}</h4>
                    <p>${escapeHtml(item.subtext)}</p>
                </div>
            </td>

            <td>
                <span class="badge booking-type">
                    ${escapeHtml(item.sessionType)}
                </span>
            </td>

            <td>
                <div class="timestamp-cell">
                    ${escapeHtml(item.date)}
                    <span>${escapeHtml(item.time)}</span>
                </div>
            </td>

            <td class="actions-cell">
                <select 
                    class="archive-actions-select" 
                    data-id="${item.id}"
                >
                    <option selected disabled>Select Action</option>
                    <option value="restore">Restore</option>
                    <option value="delete">Delete Permanently</option>
                </select>
            </td>
        `;

                tbody.appendChild(tr);

                // -----------------------------------------
                // ACTION HANDLER
                // -----------------------------------------
                tr.querySelector(".archive-actions-select")
                    .addEventListener("change", async function () {

                        if (this.value === "restore") {

                            const { error } = await supabaseClient
                                .from("bookings")
                                .update({
                                    is_archived: false,
                                    archived_at: null
                                })
                                .eq("id", item.id);

                            if (error) {
                                alert(error.message);
                                return;
                            }

                            archiveItems = archiveItems.filter(
                                b => b.id !== item.id
                            );

                            populatePackageFilter();
                            renderArchiveTable();

                            return;
                        }

                        if (this.value === "delete") {

                            if (!confirm(
                                `Delete the archived booking for "${item.title}" permanently?`
                            )) {
                                this.value = "";
                                return;
                            }

                            const { error } = await supabaseClient
                                .from("bookings")
                                .delete()
                                .eq("id", item.id);

                            if (error) {
                                alert(error.message);
                                return;
                            }

                            archiveItems = archiveItems.filter(
                                b => b.id !== item.id
                            );

                            populatePackageFilter();
                            renderArchiveTable();
                        }
                    });
            });
        }
        // Add Click Events to navigation buttons
        const tabButtons = document.querySelectorAll(".archive-tab-btn");
        tabButtons.forEach(button => {
            button.addEventListener("click", () => {
                // Remove active classes from all tabs
                tabButtons.forEach(btn => btn.classList.remove("active"));

                // Add active class to clicked tab
                button.classList.add("active");

                // Set the active filter state and update UI
                currentFilter = button.getAttribute("data-filter");
                renderArchiveTable();
            });
        });

        // Initialize display on load
        let currentUser = null;

        window.addEventListener("load", async () => {

            await archiveCompletedBookings();
            await loadArchivedBookings();
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();

                if (!session) {
                    window.location.href = "admin_login.html";
                    return;
                }

                currentUser = session.user;

                const { data: profile } = await supabaseClient
                    .from("staff_profiles")
                    .select("*")
                    .eq("id", currentUser.id)
                    .single();

                if (profile) {
                    document.getElementById("userName").textContent = profile.full_name;
                    if (profile.avatar_url) {
                        document.getElementById("userAvatar").src = profile.avatar_url;
                    }
                }

            } catch (err) {
                console.error("Init error:", err);
            }
        });
        async function archiveCompletedBookings() {

            const today = new Date().toISOString().split("T")[0];

            // Archive all completed bookings
            const { error: completedError } = await supabaseClient
                .from("bookings")
                .update({
                    is_archived: true,
                    archived_at: new Date().toISOString()
                })
                .eq("status", "Completed")
                .eq("is_archived", false);

            if (completedError) {
                console.error(completedError);
            }

            // Archive all outdated bookings
            const { error: outdatedError } = await supabaseClient
                .from("bookings")
                .update({
                    is_archived: true,
                    archived_at: new Date().toISOString()
                })
                .lt("booking_date", today)
                .eq("is_archived", false);

            if (outdatedError) {
                console.error(outdatedError);
            }
        }
        async function loadArchivedBookings() {

            const { data, error } = await supabaseClient
                .from("bookings")
                .select("*")
                .eq("is_archived", true)
                .order("archived_at", {
                    ascending: false
                });

            if (error) {
                console.error("Error loading archived bookings:", error);
                return;
            }

            archiveItems = (data || []).map(item => {

                const archivedDate = item.archived_at
                    ? new Date(item.archived_at)
                    : null;

                const bookingDate = item.booking_date
                    ? new Date(item.booking_date)
                    : null;

                return {

                    // Database ID
                    id: item.id,

                    // Used for the archive tabs
                    category: "booking",

                    // Client name
                    title: item.full_name || "Unknown Client",

                    // Email
                    email: item.email || "",

                    // Actual package / booking type
                    // Example: Graduation, Birthday, Prenup
                    sessionType: item.session_type || "Unspecified",

                    // Text underneath client name
                    subtext: [
                        item.email,
                        item.session_type
                    ]
                        .filter(Boolean)
                        .join(" • "),

                    // Actual booking date
                    bookingDate: bookingDate
                        ? bookingDate.toLocaleDateString()
                        : "",

                    // Archived date
                    archivedDate: archivedDate
                        ? archivedDate.toLocaleDateString()
                        : "",

                    // Table date
                    date: archivedDate
                        ? archivedDate.toLocaleDateString()
                        : "-",

                    // Table time
                    time: archivedDate
                        ? archivedDate.toLocaleTimeString([], {
                            hour: "2-digit",
                            minute: "2-digit"
                        })
                        : "-"
                };
            });

            populatePackageFilter();
            renderArchiveTable();
        }
        function populatePackageFilter() {

            const packageFilter = document.getElementById("packageFilter");

            if (!packageFilter) return;

            // Get unique booking types
            const packageTypes = [
                ...new Set(
                    archiveItems
                        .map(item => item.sessionType)
                        .filter(type => type && type.trim() !== "")
                )
            ].sort();

            packageFilter.innerHTML = `
        <option value="all">All Packages</option>
    `;

            packageTypes.forEach(type => {

                const option = document.createElement("option");

                option.value = type.toLowerCase();
                option.textContent = type;

                packageFilter.appendChild(option);
            });
        }
        document
            .getElementById("archiveSearchInput")
            .addEventListener("input", function () {
                renderArchiveTable();
            });
        document.getElementById("logoutBtn").addEventListener("click", async (e) => {
            e.preventDefault();
            await supabaseClient.auth.signOut();
            window.location.href = "admin_login.html";
        });
    </script>
</body>

</html>
