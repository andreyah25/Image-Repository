    <script>
        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        // Dynamic local database storage array matching your requirements.
        // You can easily replace this array with database tables later!
        let archiveItems = [];

        let currentFilter = "all";
        function escapeHtml(value) {
            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Function to render the table data dynamically based on active filter button
        function renderArchiveTable() {

            const tbody =
                document.getElementById("archiveTableBody");

            tbody.innerHTML = "";

            const searchInput =
                document.getElementById("archiveSearchInput");

            const packageFilter =
                document.getElementById("packageFilter");

            const searchTerm =
                searchInput
                    ? searchInput.value.trim().toLowerCase()
                    : "";

            const selectedPackage =
                packageFilter
                    ? packageFilter.value.toLowerCase()
                    : "all";


            const filteredItems =
                archiveItems.filter(item => {

                    /*
                     ============================================
                     1. CATEGORY FILTER
                     ============================================
                     */

                    if (
                        currentFilter !== "all" &&
                        item.category !== currentFilter
                    ) {
                        return false;
                    }


                    /*
                     ============================================
                     2. PACKAGE FILTER
                     ============================================
                     */

                    if (
                        selectedPackage !== "all" &&
                        String(item.sessionType || "")
                            .trim()
                            .toLowerCase() !== selectedPackage
                    ) {
                        return false;
                    }


                    /*
                     ============================================
                     3. SEARCH FILTER
                     ============================================
                     */

                    if (searchTerm) {

                        const searchableText = [

                            item.title,
                            item.subtext,
                            item.email,
                            item.sessionType,
                            item.bookingDate,
                            item.archivedDate,
                            item.date,
                            item.time,
                            item.bookingId,
                            item.repositoryId

                        ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();


                        if (
                            !searchableText.includes(searchTerm)
                        ) {
                            return false;
                        }

                    }


                    return true;

                });


            /*
             ============================================
             NO RESULTS
             ============================================
             */

            if (filteredItems.length === 0) {

                tbody.innerHTML = `
            <tr>
                <td colspan="4"
                    style="
                        text-align:center;
                        color:#888;
                        padding:40px;
                    ">

                    <i
                        class="fa-regular fa-folder-open"
                        style="
                            font-size:28px;
                            margin-bottom:10px;
                            display:block;
                        "
                    ></i>

                    No archived items found.

                </td>
            </tr>
        `;

                return;
            }


            /*
             ============================================
             DISPLAY ITEMS
             ============================================
             */

            filteredItems.forEach(item => {

                const tr =
                    document.createElement("tr");


                let typeLabel = "Booking";

                if (item.category === "customer") {
                    typeLabel = "Customer";
                }

                if (item.category === "folder") {
                    typeLabel = "Folder";
                }

                if (item.category === "photo") {
                    typeLabel = "Photo";
                }


                tr.innerHTML = `

            <td>

                <div class="item-meta-cell">

                    <h4>
                        ${escapeHtml(item.title)}
                    </h4>

                    <p>
                        ${escapeHtml(item.subtext || "")}
                    </p>

                </div>

            </td>


            <td>

                <span class="badge booking-type">

                    ${typeLabel}

                </span>

            </td>


            <td>

                <div class="timestamp-cell">

                    ${escapeHtml(item.date)}

                    <span>
                        ${escapeHtml(item.time)}
                    </span>

                </div>

            </td>


            <td class="actions-cell">

                <select
                    class="archive-actions-select"
                    data-id="${escapeHtml(item.id)}"
                >

                    <option value="" selected disabled>
                        Select Action
                    </option>

                    <option value="restore">
                        Restore
                    </option>

                    <option value="delete">
                        Delete Permanently
                    </option>

                </select>

            </td>

        `;


                tbody.appendChild(tr);


                const select =
                    tr.querySelector(
                        ".archive-actions-select"
                    );


                select.addEventListener(
                    "change",
                    async function () {

                        const action =
                            this.value;


                        try {

                            /*
                             ====================================
                             RESTORE
                             ====================================
                             */

                            if (
                                action === "restore"
                            ) {

                                const confirmed =
                                    confirm(
                                        `Restore "${item.title}"?`
                                    );


                                if (!confirmed) {

                                    this.value = "";

                                    return;

                                }


                                await restoreArchiveItem(
                                    item
                                );


                                archiveItems =
                                    archiveItems.filter(
                                        archivedItem =>
                                            !(
                                                archivedItem.id ===
                                                item.id
                                                &&
                                                archivedItem.category ===
                                                item.category
                                            )
                                    );


                                populatePackageFilter();

                                renderArchiveTable();

                                return;

                            }


                            /*
                             ====================================
                             PERMANENT DELETE
                             ====================================
                             */

                            if (
                                action === "delete"
                            ) {

                                const confirmed =
                                    confirm(
                                        `PERMANENTLY DELETE "${item.title}"?\n\n` +
                                        `This will permanently remove the archived ${item.category}.\n\n` +
                                        `This action cannot be undone.`
                                    );


                                if (!confirmed) {

                                    this.value = "";

                                    return;

                                }


                                await permanentlyDeleteArchiveItem(item);

                                // Reload the actual database state
                                await loadArchivedItems();

                                populatePackageFilter();

                                renderArchiveTable();

                            }

                        } catch (error) {

                            console.error(
                                "Archive action error:",
                                error
                            );


                            alert(
                                "Action failed:\n\n" +
                                error.message
                            );


                            this.value = "";

                        }

                    }
                );

            });

        }

        // Initialize display on load
        let currentUser = null;

        window.addEventListener("load", async () => {

            try {

                const {
                    data: {
                        session
                    }
                } = await supabaseClient.auth.getSession();

                if (!session) {

                    window.location.href =
                        "admin_login.html";

                    return;
                }

                currentUser =
                    session.user;

                const {
                    data: profile
                } = await supabaseClient
                    .from("staff_profiles")
                    .select("*")
                    .eq("id", currentUser.id)
                    .single();

                if (profile) {

                    document.getElementById(
                        "userName"
                    ).textContent =
                        profile.full_name || "Admin";

                    if (profile.avatar_url) {

                        document.getElementById(
                            "userAvatar"
                        ).src =
                            profile.avatar_url;

                    }

                }

                await archiveCompletedBookings();

                await loadArchivedItems();

                populatePackageFilter();

                initializeArchiveTabs();

                renderArchiveTable();
            } catch (err) {

                console.error(
                    "Init error:",
                    err
                );

            }

        });
        async function restoreArchiveItem(item) {

            /*
             ============================================================
             RESTORE CUSTOMER / BOOKING
             ============================================================
            */

            if (item.category === "customer") {

                const {
                    error
                } = await supabaseClient
                    .from("bookings")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", item.id);

                if (error) {
                    throw error;
                }

                return;
            }


            /*
             ============================================================
             RESTORE FOLDER
             ============================================================
            */

            if (item.category === "folder") {

                const {
                    error
                } = await supabaseClient
                    .from("repository_client_links")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", item.id);

                if (error) {
                    throw error;
                }

                return;
            }


            /*
             ============================================================
             RESTORE PHOTO
             ============================================================
            */

            if (item.category === "photo") {

                const {
                    error
                } = await supabaseClient
                    .from("repository_photos")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", item.id);

                if (error) {
                    throw error;
                }

                return;
            }

        }
        async function permanentlyDeleteArchiveItem(item) {

            console.log("PERMANENT DELETE STARTED:", item);

            /*
             ============================================================
             PHOTO
             ============================================================
            */

            if (item.category === "photo") {

                // --------------------------------------------
                // 1. Delete physical image from Storage
                // --------------------------------------------

                if (item.storagePath) {

                    console.log(
                        "Deleting storage file:",
                        item.storagePath
                    );

                    const {
                        error: storageError
                    } = await supabaseClient
                        .storage
                        .from("client-photos")
                        .remove([
                            item.storagePath
                        ]);

                    if (storageError) {
                        throw new Error(
                            "Storage deletion failed: " +
                            storageError.message
                        );
                    }
                }


                // --------------------------------------------
                // 2. Delete photo database record
                // --------------------------------------------

                const {
                    error: photoDeleteError
                } = await supabaseClient
                    .from("repository_photos")
                    .delete()
                    .eq("id", item.id);

                if (photoDeleteError) {
                    throw photoDeleteError;
                }


                // --------------------------------------------
                // 3. VERIFY deletion
                // --------------------------------------------

                const {
                    data: remainingPhoto,
                    error: verifyError
                } = await supabaseClient
                    .from("repository_photos")
                    .select("id")
                    .eq("id", item.id)
                    .maybeSingle();

                if (verifyError) {
                    throw verifyError;
                }

                if (remainingPhoto) {
                    throw new Error(
                        "Photo was not permanently deleted from the database."
                    );
                }


                console.log(
                    "Photo permanently deleted."
                );

                return;
            }


            /*
             ============================================================
             FOLDER
             ============================================================
            */

            if (item.category === "folder") {

                // --------------------------------------------
                // 1. Get photos in folder
                // --------------------------------------------

                const {
                    data: photos,
                    error: photoFetchError
                } = await supabaseClient
                    .from("repository_photos")
                    .select("id, storage_path")
                    .eq("repository_id", item.id);

                if (photoFetchError) {
                    throw photoFetchError;
                }


                // --------------------------------------------
                // 2. Delete physical files
                // --------------------------------------------

                const storagePaths =
                    (photos || [])
                        .map(photo => photo.storage_path)
                        .filter(Boolean);


                if (storagePaths.length > 0) {

                    const {
                        error: storageError
                    } = await supabaseClient
                        .storage
                        .from("client-photos")
                        .remove(storagePaths);

                    if (storageError) {
                        throw storageError;
                    }
                }


                // --------------------------------------------
                // 3. Delete photo records
                // --------------------------------------------

                const {
                    error: photoDeleteError
                } = await supabaseClient
                    .from("repository_photos")
                    .delete()
                    .eq("repository_id", item.id);

                if (photoDeleteError) {
                    throw photoDeleteError;
                }


                // --------------------------------------------
                // 4. Delete folder
                // --------------------------------------------

                const {
                    error: folderDeleteError
                } = await supabaseClient
                    .from("repository_client_links")
                    .delete()
                    .eq("id", item.id);

                if (folderDeleteError) {
                    throw folderDeleteError;
                }


                // --------------------------------------------
                // 5. Verify folder is gone
                // --------------------------------------------

                const {
                    data: remainingFolder,
                    error: verifyFolderError
                } = await supabaseClient
                    .from("repository_client_links")
                    .select("id")
                    .eq("id", item.id)
                    .maybeSingle();

                if (verifyFolderError) {
                    throw verifyFolderError;
                }

                if (remainingFolder) {
                    throw new Error(
                        "Folder was not permanently deleted."
                    );
                }


                console.log(
                    "Folder permanently deleted."
                );

                return;
            }


            /*
             ============================================================
             CUSTOMER
             ============================================================
            */

            if (item.category === "customer") {

                // --------------------------------------------
                // 1. Get all customer folders
                // --------------------------------------------

                const {
                    data: folders,
                    error: folderFetchError
                } = await supabaseClient
                    .from("repository_client_links")
                    .select("id")
                    .eq("booking_id", item.id);

                if (folderFetchError) {
                    throw folderFetchError;
                }


                // --------------------------------------------
                // 2. Get all photos
                // --------------------------------------------

                let allStoragePaths = [];


                for (const folder of (folders || [])) {

                    const {
                        data: photos,
                        error: photoFetchError
                    } = await supabaseClient
                        .from("repository_photos")
                        .select("id, storage_path")
                        .eq("repository_id", folder.id);

                    if (photoFetchError) {
                        throw photoFetchError;
                    }


                    const paths =
                        (photos || [])
                            .map(photo => photo.storage_path)
                            .filter(Boolean);

                    allStoragePaths.push(...paths);
                }


                // --------------------------------------------
                // 3. Delete physical images
                // --------------------------------------------

                if (allStoragePaths.length > 0) {

                    console.log(
                        "Deleting customer storage files:",
                        allStoragePaths
                    );

                    const {
                        error: storageError
                    } = await supabaseClient
                        .storage
                        .from("client-photos")
                        .remove(allStoragePaths);

                    if (storageError) {
                        throw storageError;
                    }
                }


                // --------------------------------------------
                // 4. Delete customer database records
                // --------------------------------------------

                const {
                    data: deleteResult,
                    error: rpcError
                } = await supabaseClient
                    .rpc(
                        "permanently_delete_customer",
                        {
                            p_booking_id: item.id
                        }
                    );

                if (rpcError) {
                    throw rpcError;
                }


                console.log(
                    "Permanent customer deletion result:",
                    deleteResult
                );


                // --------------------------------------------
                // 5. FINAL VERIFICATION
                // --------------------------------------------

                const {
                    data: remainingBooking,
                    error: verifyBookingError
                } = await supabaseClient
                    .from("bookings")
                    .select("id")
                    .eq("id", item.id)
                    .maybeSingle();

                if (verifyBookingError) {
                    throw verifyBookingError;
                }


                if (remainingBooking) {

                    throw new Error(
                        "Customer still exists in the bookings table."
                    );
                }


                console.log(
                    "CUSTOMER PERMANENTLY DELETED:",
                    item.id
                );

                return;
            }


            throw new Error(
                "Unknown archive category: " +
                item.category
            );
        }
        async function archiveCompletedBookings() {

            const today = new Date()
                .toISOString()
                .split("T")[0];

            console.log("Checking for records ready to archive...");

            /*
             ============================================================
             1. FIND COMPLETED BOOKINGS THAT ARE READY TO BE ARCHIVED
             ============================================================
             
             Conditions:
             - status = Completed
             - booking_date is before today
             - is_archived = false
            */

            const {
                data: bookings,
                error: bookingFetchError
            } = await supabaseClient
                .from("bookings")
                .select("id, full_name, booking_date, status, is_archived")
                .eq("status", "Completed")
                .eq("is_archived", false)
                .lt("booking_date", today);

            if (bookingFetchError) {

                console.error(
                    "Error finding bookings ready for archive:",
                    bookingFetchError
                );

                throw bookingFetchError;
            }

            if (!bookings || bookings.length === 0) {

                console.log(
                    "No completed bookings are ready to be archived."
                );

                return;
            }


            console.log(
                `${bookings.length} booking(s) ready to be archived.`
            );


            /*
             ============================================================
             2. ARCHIVE EACH CUSTOMER
             ============================================================
            */

            for (const booking of bookings) {

                const archiveTime =
                    new Date().toISOString();


                console.log(
                    `Archiving customer: ${booking.full_name}`
                );


                /*
                 ========================================================
                 2A. FIND ALL FOLDERS FOR THIS CUSTOMER
                 ========================================================
                */

                const {
                    data: folders,
                    error: folderFetchError
                } = await supabaseClient
                    .from("repository_client_links")
                    .select("id, booking_id, is_archived")
                    .eq("booking_id", booking.id);

                if (folderFetchError) {

                    console.error(
                        `Error finding folders for ${booking.full_name}:`,
                        folderFetchError
                    );

                    throw folderFetchError;
                }


                /*
                 ========================================================
                 2B. ARCHIVE ALL PHOTOS INSIDE CUSTOMER FOLDERS
                 ========================================================
                */

                for (const folder of (folders || [])) {

                    const {
                        error: photoArchiveError
                    } = await supabaseClient
                        .from("repository_photos")
                        .update({
                            is_archived: true,
                            archived_at: archiveTime
                        })
                        .eq("repository_id", folder.id)
                        .eq("is_archived", false);

                    if (photoArchiveError) {

                        console.error(
                            `Error archiving photos in folder ${folder.id}:`,
                            photoArchiveError
                        );

                        throw photoArchiveError;
                    }


                    /*
                     ====================================================
                     2C. ARCHIVE THE FOLDER
                     ====================================================
                    */

                    const {
                        error: folderArchiveError
                    } = await supabaseClient
                        .from("repository_client_links")
                        .update({
                            is_archived: true,
                            archived_at: archiveTime
                        })
                        .eq("id", folder.id)
                        .eq("is_archived", false);

                    if (folderArchiveError) {

                        console.error(
                            `Error archiving folder ${folder.id}:`,
                            folderArchiveError
                        );

                        throw folderArchiveError;
                    }

                }


                /*
                 ========================================================
                 3. ARCHIVE THE CUSTOMER / BOOKING
                 ========================================================
                */

                const {
                    error: bookingArchiveError
                } = await supabaseClient
                    .from("bookings")
                    .update({
                        is_archived: true,
                        archived_at: archiveTime
                    })
                    .eq("id", booking.id)
                    .eq("is_archived", false);

                if (bookingArchiveError) {

                    console.error(
                        `Error archiving customer ${booking.full_name}:`,
                        bookingArchiveError
                    );

                    throw bookingArchiveError;
                }


                console.log(
                    `Successfully archived: ${booking.full_name}`
                );

            }


            console.log(
                "Finished archiving customers, folders, and photos."
            );
        }
        async function loadArchivedItems() {

            archiveItems = [];

            /*
             ============================================================
             1. ARCHIVED CLIENTS / BOOKINGS
             ============================================================
            */

            const {
                data: archivedBookings,
                error: bookingError
            } = await supabaseClient
                .from("bookings")
                .select("*")
                .eq("is_archived", true)
                .order("archived_at", {
                    ascending: false
                });

            if (bookingError) {

                console.error(
                    "Error loading archived bookings:",
                    bookingError
                );

            } else {

                (archivedBookings || []).forEach(item => {

                    const archivedDate = item.archived_at
                        ? new Date(item.archived_at)
                        : null;

                    archiveItems.push({

                        id: item.id,

                        category: "customer",

                        title:
                            item.full_name ||
                            item.name ||
                            item.client_name ||
                            "Unknown Client",

                        email:
                            item.email || "",

                        sessionType:
                            item.session_type ||
                            "Unspecified",

                        subtext: [
                            item.email,
                            item.session_type
                        ]
                            .filter(Boolean)
                            .join(" • "),

                        bookingDate:
                            item.booking_date || "",

                        archivedDate:
                            item.archived_at || "",

                        date:
                            archivedDate
                                ? archivedDate.toLocaleDateString()
                                : "-",

                        time:
                            archivedDate
                                ? archivedDate.toLocaleTimeString([], {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                })
                                : "-"

                    });

                });

            }


            /*
             ============================================================
             2. ARCHIVED FOLDERS
             ============================================================
            */

            const {
                data: archivedFolders,
                error: folderError
            } = await supabaseClient
                .from("repository_client_links")
                .select(`
            *,
            bookings (
                id,
                full_name,
                email,
                session_type
            )
        `)
                .eq("is_archived", true)
                .order("archived_at", {
                    ascending: false
                });

            if (folderError) {

                console.error(
                    "Error loading archived folders:",
                    folderError
                );

            } else {

                (archivedFolders || []).forEach(folder => {

                    const booking = folder.bookings || {};

                    const archivedDate = folder.archived_at
                        ? new Date(folder.archived_at)
                        : null;

                    archiveItems.push({

                        id: folder.id,

                        category: "folder",

                        title:
                            booking.full_name ||
                            "Customer Folder",

                        email:
                            booking.email || "",

                        sessionType:
                            booking.session_type ||
                            "Folder",

                        subtext:
                            "Customer Repository Folder",

                        bookingId:
                            folder.booking_id,

                        repositoryId:
                            folder.id,

                        archivedDate:
                            folder.archived_at || "",

                        date:
                            archivedDate
                                ? archivedDate.toLocaleDateString()
                                : "-",

                        time:
                            archivedDate
                                ? archivedDate.toLocaleTimeString([], {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                })
                                : "-"

                    });

                });

            }


            /*
             ============================================================
             3. ARCHIVED PHOTOS
             ============================================================
            */

            const {
                data: archivedPhotos,
                error: photoError
            } = await supabaseClient
                .from("repository_photos")
                .select(`
            *,
            bookings (
                id,
                full_name,
                email,
                session_type
            )
        `)
                .eq("is_archived", true)
                .order("archived_at", {
                    ascending: false
                });

            if (photoError) {

                console.error(
                    "Error loading archived photos:",
                    photoError
                );

            } else {

                (archivedPhotos || []).forEach(photo => {

                    const booking = photo.bookings || {};

                    const archivedDate = photo.archived_at
                        ? new Date(photo.archived_at)
                        : null;

                    archiveItems.push({

                        id: photo.id,

                        category: "photo",

                        title:
                            photo.original_name ||
                            "Photo",

                        email:
                            booking.email || "",

                        sessionType:
                            booking.session_type ||
                            "Photo",

                        subtext:
                            booking.full_name
                                ? `Photo from ${booking.full_name}`
                                : "Archived Photo",

                        bookingId:
                            photo.booking_id,

                        repositoryId:
                            photo.repository_id,

                        storagePath:
                            photo.storage_path,

                        archivedDate:
                            photo.archived_at || "",

                        date:
                            archivedDate
                                ? archivedDate.toLocaleDateString()
                                : "-",

                        time:
                            archivedDate
                                ? archivedDate.toLocaleTimeString([], {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                })
                                : "-"

                    });

                });

            }

            renderArchiveTable();
        }
        function initializeArchiveTabs() {

            const tabButtons =
                document.querySelectorAll(
                    ".archive-tab-btn"
                );


            tabButtons.forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        /*
                         * Remove active state
                         * from every tab.
                         */

                        tabButtons.forEach(tab => {

                            tab.classList.remove(
                                "active"
                            );

                        });


                        /*
                         * Activate clicked tab.
                         */

                        button.classList.add(
                            "active"
                        );


                        /*
                         * Get selected category.
                         */

                        currentFilter =
                            button.dataset.filter ||
                            "all";


                        /*
                         * Re-render table.
                         */

                        renderArchiveTable();

                    }
                );

            });

        }
        function populatePackageFilter() {

            const packageFilter =
                document.getElementById(
                    "packageFilter"
                );


            if (!packageFilter) {
                return;
            }


            /*
             * Save current selection.
             */

            const previousValue =
                packageFilter.value;


            /*
             * Get unique package names.
             */

            const packageTypes = [
                ...new Set(

                    archiveItems
                        .map(
                            item =>
                                item.sessionType
                        )
                        .filter(
                            type =>
                                type &&
                                type.trim() !== ""
                        )

                )
            ]
                .sort(
                    (a, b) =>
                        a.localeCompare(b)
                );


            /*
             * Reset dropdown.
             */

            packageFilter.innerHTML = `

        <option value="all">
            All Packages
        </option>

    `;


            /*
             * Add packages.
             */

            packageTypes.forEach(type => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    type
                        .trim()
                        .toLowerCase();


                option.textContent =
                    type;


                packageFilter.appendChild(
                    option
                );

            });


            /*
             * Restore previous selection
             * if it still exists.
             */

            if (
                [...packageFilter.options]
                    .some(
                        option =>
                            option.value ===
                            previousValue
                    )
            ) {

                packageFilter.value =
                    previousValue;

            }

        }
        document
            .getElementById("packageFilter")
            .addEventListener(
                "change",
                () => {

                    renderArchiveTable();

                }
            );
        document
            .getElementById("archiveSearchInput")
            .addEventListener(
                "input",
                () => {

                    renderArchiveTable();

                }
            );
    </script>
</body>

</html>
