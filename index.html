
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FAF9F7">
    <title>Captured Photography Studio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FAF9F7;
            font-family: Arial, sans-serif;
            color: #292E2D;
            overflow: hidden;
        }

        .top-gradient,
        .bottom-accent {
            position: fixed;
            left: 0;
            width: 100%;
            background: linear-gradient(
                90deg,
                #E5E9E8,
                #F8DDBB,
                #F9F0A5,
                #DDF5E9,
                #EAE2EB
            );
        }

        .top-gradient {
            top: 0;
            height: 5px;
        }

        .bottom-accent {
            bottom: 0;
            height: 4px;
        }

        .splash {
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            animation: fadeIn 1s ease-out both;
        }

        .logo-wrapper {
            width: 155px;
            height: 155px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #EAE2EB;
            border: 1px solid #DCD0DF;
            box-shadow: 0 8px 25px rgba(180, 157, 183, 0.15);
        }

        .logo {
            width: 115px;
            height: 115px;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            animation: logoBlink 2.5s ease-in-out infinite;
        }

        @keyframes logoBlink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.65;
            }
        }

        h1 {
            font-size: 27px;
            font-weight: 600;
            letter-spacing: 6px;
            color: #292E2D;
        }

        .subtitle {
            margin-top: 12px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #9C849F;
        }

        .divider {
            width: 38px;
            height: 2px;
            background: #B49DB7;
            margin: 25px auto;
            border-radius: 10px;
        }

        .welcome {
            font-size: 13px;
            line-height: 1.6;
            color: #777E7A;
            letter-spacing: 0.5px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .logo-wrapper {
                width: 130px;
                height: 130px;
                margin-bottom: 24px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            h1 {
                font-size: 23px;
                letter-spacing: 5px;
            }

            .subtitle {
                font-size: 9px;
                letter-spacing: 3px;
            }

            .welcome {
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .splash,
            .logo {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="top-gradient"></div>

    <main class="splash">

        <div class="logo-wrapper">
            <img
                src="/images/captured.png"
                alt="Captured Photography Studio Logo"
                class="logo"
                draggable="false"
            >
        </div>

        <h1>CAPTURED</h1>

        <div class="subtitle">
            PHOTOGRAPHY STUDIO
        </div>

        <div class="divider"></div>

        <p class="welcome">
            Welcome to your own little space of memories.
        </p>

    </main>

    <div class="bottom-accent"></div>

    <script>
        window.setTimeout(() => {
            window.location.replace("/home");
        }, 4500);
    </script>

</body>
</html>
