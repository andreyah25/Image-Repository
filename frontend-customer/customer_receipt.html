/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(dateString) {

    if (!dateString) {
        return "—";
    }

    const date =
        new Date(`${dateString}T00:00:00`);

    return date.toLocaleDateString(
        "en-US",
        {
            month: "long",
            day: "numeric",
            year: "numeric"
        }
    );

}



/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(timeString) {

    if (!timeString) {
        return "—";
    }

    const parts =
        String(timeString)
            .split(":");

    const hour =
        Number(parts[0]);

    const minute =
        Number(parts[1]);

    if (
        Number.isNaN(hour) ||
        Number.isNaN(minute)
    ) {

        return timeString;

    }

    const date =
        new Date();

    date.setHours(
        hour,
        minute,
        0,
        0
    );

    return date.toLocaleTimeString(
        "en-US",
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );

}



/* =========================================================
   FORMAT MONEY
   ========================================================= */

function formatMoney(amount) {

    const number =
        Number(amount || 0);

    return `₱${number.toLocaleString(
        "en-PH",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    )}`;

}



/* =========================================================
   DISPLAY STATUS
   ========================================================= */

function statusClass(status) {

    const value =
        String(status || "")
            .toLowerCase();

    if (value === "confirmed") {
        return "status-confirmed";
    }

    if (
        value === "cancelled" ||
        value === "canceled" ||
        value === "rejected" ||
        value === "declined"
    ) {

        return "status-cancelled";

    }

    return "status-pending";

}



/* =========================================================
   LOAD CUSTOMER
   ========================================================= */

async function loadCustomer() {

    const {
        data: {
            user
        },
        error
    } =
        await supabaseClient.auth.getUser();


    if (error) {

        console.error(
            "Authentication error:",
            error
        );

        return false;

    }


    if (!user) {

        window.location.href =
            "/frontend-customer/customer_login.html";

        return false;

    }


    currentUser = user;


    const {
        data: customer
    } =
        await supabaseClient
            .from("customers")
            .select(`
                id,
                full_name,
                email,
                profile_image,
                phone
            `)
            .eq("id", user.id)
            .maybeSingle();


    const customerName =
        customer?.full_name ||
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email ||
        "Customer";


    document.getElementById(
        "customer-name"
    ).textContent =
        customerName;


    const profileImage =
        customer?.profile_image ||
        user.user_metadata?.avatar_url ||
        user.user_metadata?.picture ||
        "/images/default-profile.png";


    const profileImageElement =
        document.getElementById(
            "profile-image"
        );


    profileImageElement.src =
        profileImage;


    profileImageElement.onerror =
        function () {

            this.onerror = null;

            this.src =
                "/images/default-profile.png";

        };


    return true;

}



/* =========================================================
   LOAD BOOKINGS
   ========================================================= */

async function loadBookings() {

    const loading =
        document.getElementById(
            "loadingState"
        );

    const empty =
        document.getElementById(
            "emptyState"
        );

    const list =
        document.getElementById(
            "bookingList"
        );


    loading.style.display =
        "flex";

    empty.style.display =
        "none";

    list.innerHTML =
        "";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("bookings")
            .select(`
                id,
                customer_id,
                full_name,
                contact_number,
                email,
                booking_date,
                booking_time,
                session_type,
                notes,
                payment_method,
                payment_proof,
                downpayment_amount,
                payment_status,
                status,
                created_at,
                confirmed_at,
                confirmed_by
            `)
            .eq(
                "customer_id",
                currentUser.id
            )
            .order(
                "booking_date",
                {
                    ascending: false
                }
            );


    loading.style.display =
        "none";


    if (error) {

        console.error(
            "Booking loading error:",
            error
        );


        list.innerHTML = `

            <div class="error-state">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <h2>
                    Unable to load bookings
                </h2>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

        return;

    }


    allBookings =
        data || [];


    if (!allBookings.length) {

        empty.style.display =
            "flex";

        return;

    }


    allBookings.forEach(
        booking => {

            renderBookingCard(
                booking
            );

        }
    );


    /*
     * If URL contains:
     *
     * ?booking=UUID
     *
     * automatically open it.
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const bookingId =
        params.get("booking");


    if (bookingId) {

        const booking =
            allBookings.find(
                item =>
                    item.id === bookingId
            );


        if (booking) {

            openReceipt(
                booking
            );

        }

    }

}

/* =========================================================
   NOTIFICATIONS
   ========================================================= */

async function loadNotifications() {

    if (!currentUser) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("notifications")
            .select("*")
            .eq(
                "customer_id",
                currentUser.id
            )
            .eq(
                "recipient",
                "customer"
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Notification error:",
            error
        );

        return;

    }


    const list =
        document.getElementById(
            "notificationList"
        );


    list.innerHTML =
        "";


    let unread = 0;


    (data || []).forEach(
        notification => {

            if (!notification.is_read) {
                unread++;
            }


            const title =
                notification.title ||
                "";


            let icon =
                "fa-circle-info";


            if (
                title
                    .toLowerCase()
                    .includes("confirmed") ||
                title
                    .toLowerCase()
                    .includes("approved")
            ) {

                icon =
                    "fa-circle-check";

            }


            let button =
                "";


            if (
                notification.booking_id &&
                title
                    .toLowerCase()
                    .includes("confirmed")
            ) {

                button = `

                    <button
                        class="notification-booking-btn"
                        onclick="openBookingFromNotification('${notification.booking_id}')"
                    >

                        <i class="fa-regular fa-file-lines"></i>

                        View Booking

                    </button>

                `;

            }


            list.innerHTML += `

                <div
                    class="notification-item ${
                        notification.is_read
                            ? ""
                            : "unread"
                    }"
                >

                    <div class="notification-icon">

                        <i
                            class="fa-solid ${icon}"
                        ></i>

                    </div>


                    <div class="notification-content">

                        <h4>
                            ${escapeHTML(
                                notification.title
                            )}
                        </h4>


                        <p class="notification-message">

                            ${escapeHTML(
                                notification.message
                            )}

                        </p>


                        <small>

                            ${
                                notification.created_at
                                    ? new Date(
                                        notification.created_at
                                    ).toLocaleString()
                                    : ""
                            }

                        </small>


                        ${button}

                    </div>

                </div>

            `;

        }
    );


    const badge =
        document.getElementById(
            "notificationCount"
        );


    if (unread > 0) {

        badge.textContent =
            unread;

        badge.style.display =
            "inline-flex";

    } else {

        badge.style.display =
            "none";

    }

}



/* =========================================================
   OPEN BOOKING FROM NOTIFICATION
   ========================================================= */

async function openBookingFromNotification(
    bookingId
) {

    if (!bookingId) {
        return;
    }


    /*
     * If the booking isn't currently loaded,
     * retrieve it directly.
     */

    let booking =
        allBookings.find(
            item =>
                item.id === bookingId
        );


    if (!booking) {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("bookings")
                .select(`
                    id,
                    customer_id,
                    full_name,
                    contact_number,
                    email,
                    booking_date,
                    booking_time,
                    session_type,
                    notes,
                    payment_method,
                    payment_proof,
                    downpayment_amount,
                    payment_status,
                    status,
                    created_at,
                    confirmed_at,
                    confirmed_by
                `)
                .eq(
                    "id",
                    bookingId
                )
                .eq(
                    "customer_id",
                    currentUser.id
                )
                .maybeSingle();


        if (error || !data) {

            alert(
                "Unable to find this booking."
            );

            return;

        }


        booking =
            data;

    }


    openReceipt(
        booking
    );

}



/* =========================================================
   NOTIFICATION BUTTON
   ========================================================= */

document
    .getElementById(
        "notificationBtn"
    )
    .addEventListener(
        "click",
        async function () {

            const dropdown =
                document.getElementById(
                    "notificationDropdown"
                );


            if (
                dropdown.style.display ===
                "block"
            ) {

                dropdown.style.display =
                    "none";

                return;

            }


            dropdown.style.display =
                "block";


            /*
             * Mark unread notifications as read.
             */

            const {
                error
            } =
                await supabaseClient
                    .from("notifications")
                    .update({
                        is_read: true
                    })
                    .eq(
                        "customer_id",
                        currentUser.id
                    )
                    .eq(
                        "recipient",
                        "customer"
                    )
                    .eq(
                        "is_read",
                        false
                    );


            if (error) {

                console.error(
                    "Notification update error:",
                    error
                );

            }


            await loadNotifications();

        }
    );



/* =========================================================
   CLOSE NOTIFICATION DROPDOWN
   ========================================================= */

document.addEventListener(
    "click",
    function (event) {

        const button =
            document.getElementById(
                "notificationBtn"
            );


        const dropdown =
            document.getElementById(
                "notificationDropdown"
            );


        if (
            !button.contains(event.target) &&
            !dropdown.contains(event.target)
        ) {

            dropdown.style.display =
                "none";

        }

    }
);



/* =========================================================
   REALTIME CUSTOMER NOTIFICATIONS
   ========================================================= */

supabaseClient
    .channel(
        "customer_booking_notifications"
    )
    .on(
        "postgres_changes",
        {
            event: "INSERT",
            schema: "public",
            table: "notifications"
        },
        async payload => {

            if (
                !currentUser
            ) {

                return;

            }


            if (
                payload.new.recipient ===
                    "customer" &&
                payload.new.customer_id ===
                    currentUser.id
            ) {

                await loadNotifications();

            }

        }
    )
    .subscribe();



/* =========================================================
   INITIALIZE
   ========================================================= */

(async function () {

    const customerLoaded =
        await loadCustomer();


    if (!customerLoaded) {
        return;
    }


    await loadBookings();

    await loadNotifications();

})();

</script>
