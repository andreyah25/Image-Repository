<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery - Captured Photography Studio</title>

    <!-- Direct Google Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Dedicated CSS for this page only -->
    <link rel="stylesheet" href="/design/customer_gallery_view.css?v=1.2">
</head>

<body>

    <!-- TOP NAVBAR -->
    <header class="top-navbar">
        <div class="logo-section">
            <img src="/images/captured.png" class="logo-img" alt="Captured Photography Studio"> <span>Captured
                Photography Studio</span>
        </div>
        <div class="navbar-right">
            <img id="userAvatar" class="avatar" alt="Profile" style="display:none;"><span id="userName">
                Loading...
            </span>
        </div>
    </header>

    <div class="dashboard-wrapper">

        <main class="content">

            <div class="gallery-header">

                <div>
                    <h1 id="galleryTitle">Loading...</h1>
                    <p id="gallerySubtitle">Loading...</p>
                </div>

                <button id="downloadAllBtn" class="btn-download-all">
                    <i class="fa-solid fa-download"></i>
                    Download All
                </button>

            </div>

            <div id="galleryGrid" class="gallery-grid"></div>

        </main>

    </div>

    <!-- PAYMENT MODAL -->
    <div class="modal-overlay" id="paymentModal">
        <div class="payment-modal-card" style="width:420px; min-height:420px; border-radius:8px; padding:24px;">

            <div id="paymentNoticeStep">
                <div class="modal-header">
                    <i class="fa-regular fa-credit-card modal-card-icon"></i>
                    <h2>Make a Payment</h2>
                </div>

                <div class="modal-body">
                    <p class="modal-prompt-text">
                        Complete your payment to download your high-quality photos. </p>

                    <div style="background:#f4f5f7; padding:16px;
                    border-radius:4px; text-align:left;">

                        <h4>Payment Summary</h4>

                        <div style="display:flex;
                        justify-content:space-between;">
                            <span>Order ID:</span>
                            <strong id="summaryOrderId">#ORD-001</strong>
                        </div>

                        <div style="display:flex;
                        justify-content:space-between;">
                            <span>Client:</span>
                            <strong id="summaryClientName">Customer</strong>
                        </div>

                        <div style="display:flex;
                        justify-content:space-between;">
                            <span>Access:</span>
                            <strong>Folder Access</strong>
                        </div>

                        <div style="display:flex;
                        justify-content:space-between;
                        margin-top:10px;
                        padding-top:8px;
                        border-top:1px solid #ddd;">

                            <span>Total Amount:</span>
                            <strong id="summaryAmount">₱1.00</strong>
                        </div>
                    </div>

                    <button type="button" id="btnPayMongo" style="width:100%; margin-top:20px;
                    padding:12px; background:#639A88;
                    color:white; border:0; border-radius:4px;
                    font-weight:700; cursor:pointer;">

                        <i class="fa-solid fa-credit-card"></i>
                        Pay with PayMongo
                    </button>

                    <button type="button" id="btnMaybeLater" class="btn-modal-cancel" style="width:100%; margin-top:10px;
                    border-radius:4px;">

                        Maybe Later
                    </button>

                    <p id="paymentErrorMsg" style="color:#d9534f;
                    font-size:12px;
                    display:none;">
                    </p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );
        const SERVER_URL = "https://captured-server.onrender.com";
        const galleryTitle =
            document.getElementById("galleryTitle");

        const gallerySubtitle =
            document.getElementById("gallerySubtitle");

        const galleryGrid =
            document.getElementById("galleryGrid");

        const downloadAllBtn =
            document.getElementById("downloadAllBtn");

        const paymentModal =
            document.getElementById("paymentModal");

        const closeButton =
            document.getElementById("btnMaybeLater");

        let currentRepository = null;

        let currentBooking = null;

        let currentPhotos = [];
        let currentAccessRequest = null;

        let galleryPreviewMode = false;
        let galleryAccessNumber = 0;

        function displayClientInformation(booking) {

            if (!booking) {
                return;
            }

            if (galleryTitle) {
                galleryTitle.textContent =
                    `${booking.full_name || "Customer"}'s Gallery`;
            }

            if (gallerySubtitle) {
                const sessionDate = booking.booking_date
                    ? formatDate(booking.booking_date)
                    : "Date not specified";

                gallerySubtitle.textContent =
                    `${booking.session_type || "Photography Session"} • ${sessionDate}`;
            }

            const userName =
                document.getElementById("userName");

            if (userName) {
                userName.textContent =
                    booking.full_name || "Customer";
            }
        }
        async function loadRepositoryPhotos() {
            const params = new URLSearchParams(window.location.search);

            const token = params.get("token");
            const requestId = params.get("request");
            if (!token || token.trim() === "") {
                console.error("No gallery token provided.");

                showGalleryError(
                    "Invalid Gallery Link",
                    "Your gallery link is missing or invalid."
                );

                return false;
            }

            try {
                const response =
                    await fetch(
                        `${SERVER_URL}/api/gallery-access/photos` +
                        `?token=${encodeURIComponent(token)}` +
                        `&request=${encodeURIComponent(requestId || "")}`
                    );
                const result =
                    await response.json();

                if (!response.ok || !result.success) {

                    showGalleryError(
                        "Gallery Access Expired",
                        result.error ||
                        "Your gallery access has expired or payment is still required."
                    );

                    return false;
                }

                if (result.request) {

                    currentAccessRequest = {
                        ...currentAccessRequest,
                        ...result.request
                    };

                    galleryAccessNumber =
                        Number(
                            result.request.request_number || 0
                        );

                    galleryPreviewMode =
                        galleryAccessNumber >= 2 &&
                        !(
                            result.request.payment_confirmed === true &&
                            String(
                                result.request.payment_status || ""
                            ).toLowerCase() === "paid"
                        );
                }

                currentPhotos =
                    result.photos || [];

                renderGalleryPhotos(
                    currentPhotos
                );

                return true;

            } catch (error) {

                console.error(
                    "Authorized gallery loading error:",
                    error
                );

                showGalleryError(
                    "Unable to Open Gallery",
                    "We could not verify your gallery access."
                );

                return false;
            }
        }
        async function initializeGallery() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const token =
                params.get("token");

            if (!token) {

                showGalleryError(
                    "Invalid Gallery Link",
                    "Your gallery link is missing or invalid."
                );

                return;
            }

            try {

                const photosLoaded =
                    await loadRepositoryPhotos();

                if (!photosLoaded) {
                    return;
                }

                if (!currentAccessRequest) {

                    showGalleryError(
                        "Gallery Access Required",
                        "Your gallery access has not been approved yet."
                    );

                    return;
                }

                /*
                 * The backend already verified:
                 * - gallery token
                 * - booking
                 * - approved request
                 * - expiration
                 * - payment for request #2/#3
                 */

                const bookingId =
                    currentAccessRequest.booking_id;

                if (bookingId) {

                    const {
                        data: booking,
                        error: bookingError
                    } =
                        await supabaseClient
                            .from("bookings")
                            .select("*")
                            .eq("id", bookingId)
                            .maybeSingle();

                    if (!bookingError && booking) {

                        currentBooking =
                            booking;

                        displayClientInformation(
                            booking
                        );

                    }

                }

                await checkGalleryPayment();

            } catch (error) {

                console.error(
                    "Gallery initialization error:",
                    error
                );

                showGalleryError(
                    "Unable to Open Gallery",
                    "We could not verify your gallery access."
                );

            }
        }
        function renderGalleryPhotos(
            photos
        ) {

            galleryGrid.innerHTML = "";

            if (
                !photos ||
                photos.length === 0
            ) {

                galleryGrid.innerHTML = `
                    <div class="gallery-loading">
                        <i class="fa-regular fa-images"></i>
                        <p>No photos have been uploaded yet.</p>
                        <small>Please check again later.</small>
                    </div>
                `;

                return;
            }

            photos.forEach(
                photo => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "photo-card";

                    const image =
                        document.createElement("img");

                    const canViewFullQuality =
                        canAccessHighQuality();

                    if (canViewFullQuality) {

                        image.src =
                            photo.image_url || "";

                        image.style.filter =
                            "none";

                        image.style.opacity =
                            "1";

                    } else {
                        image.src =
                            photo.preview_url || "";

                        image.style.filter =
                            "blur(8px)";

                        image.style.opacity =
                            "0.75";
                    }

                    image.alt =
                        photo.original_name ||
                        "Gallery Photo";

                    image.loading =
                        "lazy";

                    const button =
                        document.createElement("button");

                    button.type =
                        "button";

                    button.className =
                        "individual-download-btn";

                    button.innerHTML =
                        `<i class="fa-solid fa-download"></i>`;

                    button.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                            downloadPhoto(
                                photo
                            );

                        }
                    );

                    card.appendChild(
                        image
                    );
                    if (galleryPreviewMode) {

                        const watermark =
                            document.createElement("div");

                        watermark.textContent =
                            "CAPTURED PHOTOGRAPHY STUDIO • PREVIEW";

                        watermark.style.position =
                            "absolute";

                        watermark.style.top =
                            "50%";

                        watermark.style.left =
                            "50%";

                        watermark.style.transform =
                            "translate(-50%, -50%) rotate(-25deg)";

                        watermark.style.fontSize =
                            "18px";

                        watermark.style.fontWeight =
                            "700";

                        watermark.style.color =
                            "rgba(255,255,255,0.75)";

                        watermark.style.textAlign =
                            "center";

                        watermark.style.whiteSpace =
                            "nowrap";

                        watermark.style.pointerEvents =
                            "none";

                        watermark.style.textShadow =
                            "0 1px 4px rgba(0,0,0,0.7)";

                        watermark.style.zIndex =
                            "5";

                        card.appendChild(
                            watermark
                        );
                    }
                    if (galleryPreviewMode) {

                        const lockOverlay =
                            document.createElement("div");

                        lockOverlay.style.position = "absolute";
                        lockOverlay.style.inset = "0";
                        lockOverlay.style.display = "flex";
                        lockOverlay.style.flexDirection = "column";
                        lockOverlay.style.alignItems = "center";
                        lockOverlay.style.justifyContent = "center";
                        lockOverlay.style.background = "rgba(0, 0, 0, 0.20)";
                        lockOverlay.style.color = "#ffffff";
                        lockOverlay.style.textAlign = "center";
                        lockOverlay.style.pointerEvents = "none";

                        lockOverlay.innerHTML = galleryPreviewMode
                            ? `
        <i class="fa-solid fa-eye-slash"
           style="font-size:28px; margin-bottom:8px;"></i>

        <strong style="font-size:14px;">
            Preview Mode
        </strong>

        <span style="font-size:11px; margin-top:4px;">
         High-quality downloads require payment        </span>
      `
                            : `
        <i class="fa-solid fa-lock"
           style="font-size:28px; margin-bottom:8px;"></i>

        <strong style="font-size:14px;">
            Payment Required
        </strong>

        <span style="font-size:11px; margin-top:4px;">
            Complete payment to view and download
        </span>
      `;
                        card.style.position = "relative";

                        card.appendChild(
                            lockOverlay
                        );
                    }
                    card.appendChild(
                        button
                    );

                    galleryGrid.appendChild(
                        card
                    );

                }
            );

        }

        function canAccessHighQuality() {

            if (!currentAccessRequest) {
                return false;
            }

            if (currentAccessRequest.status !== "approved") {
                return false;
            }
            if (currentAccessRequest.access_expires_at) {

                const expiresAt =
                    new Date(
                        currentAccessRequest.access_expires_at
                    );

                if (
                    Number.isNaN(expiresAt.getTime()) ||
                    new Date() >= expiresAt
                ) {
                    return false;
                }
            }
            const requestNumber =
                Number(
                    currentAccessRequest.request_number || 0
                );

            if (requestNumber === 1) {
                return true;
            }

            if (requestNumber >= 2) {

                const paymentConfirmed =
                    currentAccessRequest.payment_confirmed === true;

                const paymentPaid =
                    String(
                        currentAccessRequest.payment_status || ""
                    ).toLowerCase() === "paid";

                return (
                    paymentConfirmed &&
                    paymentPaid
                );
            }
            return false;
        }

        async function downloadAllPhotos() {

            if (!canAccessHighQuality()) {

                openPaymentModal();

                return;
            }

            // Check photos
            if (!currentPhotos || currentPhotos.length === 0) {

                alert(
                    "No photos available to download."
                );

                return;
            }

            const photosToDownload =
                currentPhotos.filter(
                    photo =>
                        photo &&
                        photo.image_url
                );

            if (photosToDownload.length === 0) {

                alert(
                    "No downloadable photos are available."
                );

                return;
            }

            const originalText =
                downloadAllBtn.innerHTML;

            downloadAllBtn.disabled = true;

            downloadAllBtn.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin"></i>
        Downloading...
    `;

            let successfulDownloads = 0;

            try {

                for (
                    let i = 0;
                    i < photosToDownload.length;
                    i++
                ) {

                    const photo =
                        photosToDownload[i];

                    try {

                        const params =
                            new URLSearchParams(window.location.search);

                        const token =
                            params.get("token");

                        const requestId =
                            currentAccessRequest?.id;

                        if (!requestId) {
                            throw new Error("Gallery access request ID is missing.");
                        }

                        const openResponse =
                            await fetch(
                                `${SERVER_URL}/api/gallery-access/open/${encodeURIComponent(requestId)}` +
                                `?token=${encodeURIComponent(token)}`
                            );

                        if (!openResponse.ok) {
                            throw new Error(
                                "Unable to download photo."
                            );
                        }

                        const blob =
                            await openResponse.blob();

                        const blobUrl =
                            URL.createObjectURL(blob);

                        const link =
                            document.createElement("a");

                        link.href =
                            blobUrl;

                        link.download =
                            photo.original_name ||
                            `gallery-photo-${i + 1}.jpg`;

                        document.body.appendChild(link);

                        link.click();

                        document.body.removeChild(link);

                        URL.revokeObjectURL(blobUrl);

                        successfulDownloads++;

                        await new Promise(
                            resolve =>
                                setTimeout(resolve, 500)
                        );

                    } catch (photoError) {

                        console.error(
                            "Failed to download photo:",
                            photoError
                        );
                    }
                }

                alert(
                    `${successfulDownloads} of ${photosToDownload.length} photos downloaded.`
                );

            } catch (error) {

                console.error(
                    "Download all error:",
                    error
                );

                alert(
                    "Unable to download the photos."
                );

            } finally {

                downloadAllBtn.disabled = false;

                downloadAllBtn.innerHTML =
                    originalText;
            }
        }
        const paymentNoticeStep =
            document.getElementById("paymentNoticeStep");

        const btnPayMongo =
            document.getElementById("btnPayMongo");

        const summaryOrderId =
            document.getElementById("summaryOrderId");

        const summaryClientName =
            document.getElementById("summaryClientName");

        const summaryAmount =
            document.getElementById("summaryAmount");

        const paymentErrorMsg =
            document.getElementById("paymentErrorMsg");


        function openPaymentModal() {
            if (!paymentModal) return;

            if (currentBooking) {
                if (summaryOrderId) {
                    summaryOrderId.textContent =
                        currentBooking.id
                            ? `#ORD-${String(currentBooking.id).slice(-3)}`
                            : "#ORD-001";
                }

                if (summaryClientName) {
                    summaryClientName.textContent =
                        currentBooking.full_name || "Customer";
                }
            }

            if (summaryAmount) {
                summaryAmount.textContent = "₱1.00";
            }

            paymentModal.classList.add("active");
        }
        function closePaymentModal() {

            if (paymentModal) {
                paymentModal.classList.remove("active");
            }
        }


        if (closeButton) {

            closeButton.addEventListener(
                "click",
                closePaymentModal
            );
        }
        if (btnPayMongo) {
            btnPayMongo.addEventListener(
                "click",
                startPayMongoGalleryPayment
            );
        }

        if (paymentModal) {
            paymentModal.addEventListener("click", event => {
                if (event.target === paymentModal) {
                    closePaymentModal();
                }
            });
        }

        if (downloadAllBtn) {

            downloadAllBtn.addEventListener(
                "click",
                downloadAllPhotos
            );

        }
        function showGalleryError(title, message) {
            galleryTitle.textContent = title;
            gallerySubtitle.textContent = message;

            if (downloadAllBtn) {
                downloadAllBtn.style.display = "none";
            }

            if (!galleryGrid) {
                return;
            }

            galleryGrid.innerHTML = `
                <div class="gallery-loading">
                    <i class="fa-solid fa-link-slash"></i>
                    <p>${escapeHTML(message)}</p>
                    <a href="customer_gallery_request.html" style="display:inline-block; margin-top:15px; padding:10px 18px; background:#639A88; color:white; text-decoration:none; border-radius:8px;">
                        Enter Gallery Link
                    </a>
                </div>
            `;
        }

        function formatDate(dateString) {
            if (!dateString) {
                return "Date not specified";
            }

            const date = new Date(dateString + "T00:00:00");

            if (Number.isNaN(date.getTime())) {
                return dateString;
            }

            return date.toLocaleDateString("en-US", {
                month: "long",
                day: "numeric",
                year: "numeric"
            });
        }

        function escapeHTML(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        async function checkGalleryPayment() {

            const params =
                new URLSearchParams(window.location.search);

            if (params.get("payment") !== "success") {
                return;
            }

            const requestId =
                params.get("requestId") ||
                sessionStorage.getItem(
                    "galleryPaymentRequestId"
                );

            const token =
                params.get("token");

            if (!requestId) return;

            for (let i = 0; i < 10; i++) {

                try {

                    const response =
                        await fetch(
                            `${SERVER_URL}/api/gallery-access/payment-status/${requestId}?token=${encodeURIComponent(token || "")}`
                        )

                    const result =
                        await response.json();

                    if (
                        result.paymentConfirmed === true
                    ) {

                        currentAccessRequest.payment_confirmed =
                            true;

                        currentAccessRequest.payment_status =
                            "paid";

                        if (result.accessExpiresAt) {
                            currentAccessRequest.access_expires_at =
                                result.accessExpiresAt;
                        }

                        galleryPreviewMode = false;

                        renderGalleryPhotos(
                            currentPhotos
                        );

                        sessionStorage.removeItem(
                            "galleryPaymentRequestId"
                        );

                        alert(
                            "Payment confirmed! Your gallery is unlocked and can now download your high-qualityphotos."
                        );

                        return;
                    }

                } catch (error) {

                    console.error(
                        "Payment verification error:",
                        error
                    );

                }

                await new Promise(
                    resolve => setTimeout(resolve, 1500)
                );
            }

            alert(
                "Payment is still being verified. Please refresh shortly."
            );
        }
        async function startPayMongoGalleryPayment() {

            if (!currentAccessRequest) {

                alert(
                    "Your gallery access request could not be verified."
                );

                return;
            }

            if (
                currentAccessRequest.payment_required !== true
            ) {

                alert(
                    "Payment is not required for this gallery request."
                );

                return;
            }

            if (
                currentAccessRequest.payment_confirmed === true
            ) {

                alert(
                    "Your gallery payment has already been confirmed."
                );

                return;
            }

            try {

                const button =
                    document.getElementById(
                        "btnPayMongo"
                    );

                if (button) {

                    button.disabled = true;

                    button.innerHTML =
                        `<i class="fa-solid fa-spinner fa-spin"></i>
                 Creating Payment...`;
                }

                const token =
                    new URLSearchParams(
                        window.location.search
                    ).get("token");

                const response =
                    await fetch(
                        `${SERVER_URL}/api/gallery-access/create-payment`,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                requestId:
                                    currentAccessRequest.id,

                                token:
                                    token

                            })
                        }
                    );

                const result =
                    await response.json();

                if (!response.ok || !result.success) {

                    throw new Error(
                        result.message ||
                        "Unable to create payment."
                    );
                }

                if (!result.checkoutUrl) {

                    throw new Error(
                        "PayMongo checkout URL was not returned."
                    );
                }

                sessionStorage.setItem(
                    "galleryPaymentRequestId",
                    currentAccessRequest.id
                );

                window.location.href =
                    result.checkoutUrl;

            }

            catch (error) {

                console.error(
                    "PayMongo gallery payment error:",
                    error
                );

                alert(
                    error.message ||
                    "Unable to start payment."
                );

                const button =
                    document.getElementById(
                        "btnPayMongo"
                    );

                if (button) {

                    button.disabled = false;

                    button.innerHTML =
                        `<i class="fa-solid fa-credit-card"></i>
                 Pay with PayMongo`;
                }
            }
        }

        window.addEventListener("DOMContentLoaded", async () => {

            console.log("====================================");
            console.log("CUSTOMER GALLERY INITIALIZING");
            console.log("URL:", window.location.href);
            console.log("====================================");
            await initializeGallery();

        });
    </script>

</body>

</html>
