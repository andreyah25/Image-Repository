<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/design/admin_dashboard.css">

</head>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

<body>

    <header class="top-navbar">

        <div class="logo-section">
            <img src="/images/captured.png" class="logo-box" alt="Captured Studio Logo">
            <span>Captured Studio</span>
        </div>

        <div class="navbar-right">

            <button class="notification-btn" aria-label="Notifications">
                <i class="fa-solid fa-bell"></i>
            </button>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search photos by tag, email, or file name">
            </div>
            <div class="user-profile">

                <img id="userAvatar" class="avatar" src="https://via.placeholder.com/42" alt="Profile">

                <span id="userName">
                    Loading...
                </span>

            </div>
        </div>

    </header>


    <div class="dashboard-wrapper">

        <button id="sidebarToggle" class="sidebar-toggle">
            <i class="fa-solid fa-bars"></i>
        </button>

        <aside class="sidebar">
            <nav>

                <a href="admin_dashboard.html" class="active">
                    <i class="fa-solid fa-table-cells-large"></i>
                    Home
                </a>

                <a href="admin_client.html">
                    <i class="fa-solid fa-users"></i>
                    Clients
                </a>

                <a href="admin_repository.html">
                    <i class="fa-solid fa-book"></i>
                    Repository
                </a>

                <a href="admin_payment.html">
                    <i class="fa-solid fa-credit-card"></i>
                    Payments
                </a>

                <a href="admin_archives.html">
                    <i class="fa-solid fa-box-archive"></i>
                    Archives
                </a>

                <a href="admin_profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>

                <a href="admin_settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>

            </nav>

            <a href="admin_login.html" class="logout-btn" id="logoutBtn">

                <i class="fa-solid fa-arrow-right-from-bracket logout-icon"></i>

                <span>Log out</span>

            </a>

        </aside>
        <main class="content">

            <div class="page-header">
                <h1>Welcome back!</h1>
                <p>See the latest updates on your work.</p>
            </div>

            <div class="stats-grid">

                <div class="card">
                    <i class="fa-solid fa-users"></i>
                    <span>Total Customers</span>
                    <h2 id="totalCustomers">0</h2>
                </div>

                <div class="card">
                    <i class="fa-solid fa-folder"></i>
                    <span>Total Folders</span>
                    <h2 id="totalFolders">0</h2>
                </div>

                <div class="card">
                    <i class="fa-solid fa-image"></i>
                    <span>Total Photos</span>
                    <h2 id="totalPhotos">0</h2>
                </div>

                <div class="card">
                    <i class="fa-solid fa-circle-check green"></i>
                    <span>Active</span>
                    <h2 id="activeSessions">0</h2>
                </div>

                <div class="card">
                    <i class="fa-solid fa-circle-xmark red"></i>
                    <span>Expired</span>
                    <h2 id="expiredSessions">0</h2>
                </div>

            </div>

            <h3 class="section-title">
                Booking Calendar
            </h3>

            <div id="calendar"></div>
            <div id="bookingModal" class="booking-modal">

                <div class="booking-card">

                    <div class="booking-header">

                        <div class="booking-header-left">
                            <div class="booking-icon">
                                <i class="fa-solid fa-calendar-check"></i>
                            </div>

                            <div>
                                <h2 id="modalClient">Client Name</h2>
                                <span id="modalStatus" class="booking-status">
                                    Confirmed
                                </span>
                            </div>
                        </div>

                        <button class="close-booking-modal">
                            <i class="fa-solid fa-xmark"></i>
                        </button>

                    </div>

                    <div class="booking-body">

                        <div class="booking-info">

                            <div class="info-card">
                                <i class="fa-solid fa-envelope"></i>

                                <div>
                                    <label>Email</label>
                                    <span id="modalEmail"></span>
                                </div>
                            </div>

                            <div class="info-card">
                                <i class="fa-solid fa-phone"></i>

                                <div>
                                    <label>Contact Number</label>
                                    <span id="modalContact"></span>
                                </div>
                            </div>

                            <div class="info-card">
                                <i class="fa-solid fa-box"></i>

                                <div>
                                    <label>Package</label>
                                    <span id="modalPackage"></span>
                                </div>
                            </div>

                            <div class="info-card">
                                <i class="fa-solid fa-camera"></i>

                                <div>
                                    <label>Session Type</label>
                                    <span id="modalSession"></span>
                                </div>
                            </div>

                            <div class="info-card">
                                <i class="fa-solid fa-calendar-days"></i>

                                <div>
                                    <label>Booking Date</label>
                                    <span id="modalDate"></span>
                                </div>
                            </div>

                            <div class="info-card">
                                <i class="fa-solid fa-clock"></i>

                                <div>
                                    <label>Booking Time</label>
                                    <span id="modalTime"></span>
                                </div>
                            </div>

                        </div>

                        <div class="notes-section">

                            <h3>
                                <i class="fa-solid fa-note-sticky"></i>
                                Client Notes
                            </h3>

                            <div id="modalNotes" class="notes-box">
                                No notes.
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



    <script>
        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );
        window.addEventListener("load", async () => {

            try {


                const params = new URLSearchParams(window.location.search);

                if (params.get("error")) {
                    alert(params.get("error_description") || "Login failed");
                    window.location.href = "admin_login.html";
                    return;
                }


                const {
                    data: { session }
                } = await supabaseClient.auth.getSession();

                if (!session) {
                    window.location.href = "admin_login.html";
                    return;
                }

                const user = session.user;

                let { data: profile, error } = await supabaseClient
                    .from("staff_profiles")
                    .select("*")
                    .eq("id", user.id)
                    .single();

                if (error && error.code !== "PGRST116") {
                    console.error(error);
                }

                if (!profile) {

                    const { data: newProfile, error: insertError } =
                        await supabaseClient
                            .from("staff_profiles")
                            .insert([{
                                id: user.id,
                                email: user.email,
                                full_name:
                                    user.user_metadata?.full_name ||
                                    user.user_metadata?.name ||
                                    "Staff User",
                                avatar_url:
                                    user.user_metadata?.avatar_url || "",
                                role: "staff",
                                verified: true
                            }])
                            .select()
                            .single();

                    if (insertError) {
                        console.error(insertError);
                        alert("Unable to create profile.");
                        return;
                    }

                    profile = newProfile;
                }


                if (profile.verified === false) {
                    alert("Waiting for admin approval");
                    window.location.href = "verification_code.html";
                    return;
                }

                document.getElementById("userName").textContent =
                    profile.full_name;
                await loadDashboardStats(user.id);

                await loadBookingCalendar();
                if (profile.avatar_url) {
                    document.getElementById("userAvatar").src =
                        profile.avatar_url;
                }

            } catch (err) {
                console.error(err);
                alert("Something went wrong.");
            }

        });

        async function loadDashboardStats() {

            console.log("Loading dashboard stats...");


            // TOTAL CLIENTS
            const {
                count: customerCount,
                error: customerError
            } = await supabaseClient
                .from("bookings")
                .select("*", {
                    count: "exact",
                    head: true
                });


            if (customerError) {
                console.error("Clients error:", customerError);
            }


            document.getElementById("totalCustomers").textContent =
                customerCount || 0;



            // TOTAL FOLDERS
            const {
                count: folderCount,
                error: folderError
            } = await supabaseClient
                .from("event_folders")
                .select("*", {
                    count: "exact",
                    head: true
                });


            if (folderError) {
                console.error("Folders error:", folderError);
            }


            document.getElementById("totalFolders").textContent =
                folderCount || 0;




            // TOTAL PHOTOS
            const {
                count: photoCount,
                error: photoError
            } = await supabaseClient
                .from("photos")
                .select("*", {
                    count: "exact",
                    head: true
                });


            if (photoError) {
                console.error("Photos error:", photoError);
            }


            document.getElementById("totalPhotos").textContent =
                photoCount || 0;




            // ACTIVE ACCES TO FOLDERS
            const {
                count: activeCount,
                error: activeError
            } = await supabaseClient
                .from("access")
                .select("*", {
                    count: "exact",
                    head: true
                })
                .eq("status", "Confirmed");


            if (activeError) {
                console.error("Active booking error:", activeError);
            }


            document.getElementById("activeSessions").textContent =
                activeCount || 0;




            // EXPIRED ACCESS
            const today = new Date()
                .toISOString()
                .split("T")[0];


            const {
                count: expiredCount,
                error: expiredError
            } = await supabaseClient
                .from("expired")
                .select("*", {
                    count: "exact",
                    head: true
                })
                .lt("booking_date", today);



            if (expiredError) {
                console.error("Expired error:", expiredError);
            }


            document.getElementById("expiredSessions").textContent =
                expiredCount || 0;


            console.log({
                customers: customerCount,
                folders: folderCount,
                photos: photoCount,
                active: activeCount,
                expired: expiredCount
            });

        }
        async function loadBookingCalendar() {

            const { data, error } = await supabaseClient
                .from("bookings")
                .select("*")
                .eq("status", "Confirmed");

            if (error) {
                console.error(error);
                return;
            }

            const events = data.map(booking => ({

                title: booking.full_name,

                start: booking.booking_date + "T" + booking.booking_time,

                extendedProps: {

                    email: booking.email,

                    contact: booking.contact_number,

                    package: booking.package,

                    session: booking.session_type,

                    notes: booking.notes,

                    bookingDate: booking.booking_date,

                    bookingTime: booking.booking_time

                }

            }));

            const calendar = new FullCalendar.Calendar(
                document.getElementById("calendar"),
                {

                    initialView: "dayGridMonth",

                    height: 700,

                    events: events,

                    headerToolbar: {

                        left: "prev,next today",

                        center: "title",

                        right: "dayGridMonth,timeGridWeek,timeGridDay"

                    },

                    eventColor: "#5C3BFE",

                    eventClick(info) {

                        document.getElementById("modalClient").textContent =
                            info.event.title;

                        document.getElementById("modalEmail").textContent =
                            info.event.extendedProps.email;

                        document.getElementById("modalContact").textContent =
                            info.event.extendedProps.contact;

                        document.getElementById("modalPackage").textContent =
                            info.event.extendedProps.package;

                        document.getElementById("modalSession").textContent =
                            info.event.extendedProps.session;

                        document.getElementById("modalDate").textContent =
                            info.event.extendedProps.bookingDate;

                        document.getElementById("modalTime").textContent =
                            info.event.extendedProps.bookingTime;

                        document.getElementById("modalNotes").textContent =
                            info.event.extendedProps.notes || "No notes provided.";

                        document
                            .getElementById("bookingModal")
                            .classList.add("show");

                    }


                });
            document
                .querySelector(".close-booking-modal")
                .onclick = function () {

                    document
                        .getElementById("bookingModal")
                        .classList.remove("show");

                };

            window.onclick = function (e) {

                if (e.target.id === "bookingModal") {

                    document
                        .getElementById("bookingModal")
                        .classList.remove("show");

                }

            };

            calendar.render();

        }
        const sidebar = document.querySelector(".sidebar");
        const sidebarToggle = document.getElementById("sidebarToggle");


        sidebarToggle.addEventListener("click", () => {

            sidebar.classList.toggle("collapsed");


            if (sidebar.classList.contains("collapsed")) {

                sidebarToggle.style.left = "20px";

            }
            else {

                sidebarToggle.style.left = "240px";

            }

        });
        // Logout button
        document.getElementById("logoutBtn")
            .addEventListener("click", async (e) => {

                e.preventDefault();

                await supabaseClient.auth.signOut();

                window.location.href = "landing_page.html";
            });
    </script>
</body>

</html>
