    <script>
        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );
        const forgotPasswordForm =
            document.getElementById("forgotPasswordForm");

        forgotPasswordForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const button =
                document.querySelector(".submit-login-btn");

            if (!email) {
                alert("Please enter your email address.");
                return;
            }

            button.disabled = true;
            button.textContent = "Sending...";

            try {

                const { error } =
                    await supabaseClient.auth.resetPasswordForEmail(email, {
                        redirectTo:
                            "http://127.0.0.1:5500/frontend-admin/admin_updatepw.html"
                    });

                if (error) {
                    console.error(error);
                    alert(error.message);

                    button.disabled = false;
                    button.textContent = "Reset Password";

                    return;
                }

                alert(
                    "Password reset email sent! Please check your email."
                );

                button.textContent = "Email Sent";

            } catch (error) {

                console.error(error);

                alert(
                    "Something went wrong. Please try again."
                );

                button.disabled = false;
                button.textContent = "Reset Password";
            }
        });

    </script>
