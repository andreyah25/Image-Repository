    const loginForm = document.getElementById("staffLoginForm");
    const loginMessage = document.getElementById("loginMessage");
    const emailInput = document.getElementById("email");
    const submitButton = document.querySelector(".submit-login-btn");

    let loginTimer = null;

    function showLoginMessage(message, type = "error") {
      loginMessage.className = `login-message ${type === "success" ? "success" : ""}`;
      loginMessage.textContent = message;
      loginMessage.hidden = false;
    }

    function clearLoginMessage() {
      loginMessage.hidden = true;
      loginMessage.textContent = "";
      loginMessage.className = "login-message";

      if (loginTimer) {
        clearInterval(loginTimer);
        loginTimer = null;
      }
    }

    function startLoginCountdown(seconds) {
      if (loginTimer) {
        clearInterval(loginTimer);
      }

      let remaining = Math.max(1, Number(seconds) || 60);
      submitButton.disabled = true;
      emailInput.disabled = true;
      passwordInput.disabled = true;

      const updateCountdown = () => {
        const minutes = Math.floor(remaining / 60);
        const secs = remaining % 60;

        showLoginMessage(
          `Too many failed attempts. Please try again in ${minutes}:${String(secs).padStart(2, "0")}.`
        );

        if (remaining <= 0) {
          clearInterval(loginTimer);
          loginTimer = null;
          submitButton.disabled = false;
          emailInput.disabled = false;
          passwordInput.disabled = false;
          showLoginMessage("You can try logging in again.", "success");
          return;
        }

        remaining--;
      };

      updateCountdown();
      loginTimer = setInterval(updateCountdown, 1000);
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (submitButton.disabled) return;

      clearLoginMessage();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      const SERVER_URL =
        window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
          ? "http://localhost:3000"
          : "https://image-repository-1.onrender.com";
      submitButton.disabled = true;

      try {
        const response = await fetch(`${SERVER_URL}/api/admin/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const contentType = response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
          throw new Error(
            `Login server returned an unexpected response (${response.status}).`
          );
        }

        const result = await response.json();

        if (!response.ok) {
          if (result.locked || response.status === 429) {
            startLoginCountdown(result.retryAfter || 60);
            return;
          }

          showLoginMessage(result.error || "Login failed.");
          return;
        }

        const { error: sessionError } =
          await supabaseClient.auth.setSession({
            access_token: result.session.access_token,
            refresh_token: result.session.refresh_token
          });

        if (sessionError) {
          showLoginMessage("Unable to establish your login session.");
          return;
        }

        const user = result.user;
        const finalProfile = result.profile;

        if (finalProfile.verified === false) {
          showLoginMessage("Account not verified.");

          await fetch(`${SUPABASE_URL}/functions/v1/send-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: user.email })
          });

          localStorage.setItem("verification_email", user.email);
          window.location.href = "/admin/verification";
          return;
        }

        try {
          const { error: activityError } = await supabaseClient
            .from("staff_activity_logs")
            .insert({
              staff_id: user.id,
              staff_name: finalProfile.full_name,
              staff_email: user.email,
              role: finalProfile.role,
              action: "LOGIN"
            });

          if (activityError) {
            console.error("LOGIN ACTIVITY LOG ERROR:", activityError);
          }
        } catch (activityError) {
          console.error("LOGIN ACTIVITY LOG FAILED:", activityError);
        }

        try {
          const { data: { session } } =
            await supabaseClient.auth.getSession();

          if (session?.access_token) {
            const presenceResponse = await fetch(
              `${SERVER_URL}/api/admin/staff/presence`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${session.access_token}`
                },
                body: JSON.stringify({ page: "/admin/login" })
              }
            );

            if (!presenceResponse.ok) {
              console.error("PRESENCE UPDATE ERROR");
            }
          }
        } catch (presenceError) {
          console.error("STAFF PRESENCE REQUEST FAILED:", presenceError);
        }

        localStorage.setItem("loggedInUserId", user.id);
        localStorage.setItem("loggedInUserEmail", user.email);
        localStorage.setItem("staffProfile", JSON.stringify(finalProfile));

        window.location.href = "/admin/dashboard";

      } catch (err) {
        console.error("LOGIN ERROR:", err);
        showLoginMessage(
          err.message || "Unable to connect to the login server. Please try again."
        );
      } finally {
        if (!loginTimer) {
          submitButton.disabled = false;
        }
      }
    });


  </script>
