<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/design/admin_updatepw.css">

</head>

<body>

    <div class="reset-container">

        <h1>Reset Password</h1>

        <p>
            Enter your new password below.
        </p>

        <form id="updatePasswordForm">

            <div>
                <label for="newPassword">
                    New Password
                </label>

                <input type="password" id="newPassword" required minlength="6">
            </div>

            <div>
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input type="password" id="confirmPassword" required minlength="6">
            </div>

            <button type="submit">
                Update Password
            </button>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        const form = document.getElementById("updatePasswordForm");
        const button = form.querySelector('button[type="submit"]');

        let recoveryReady = false;

        async function initializeRecovery() {
            const hash = new URLSearchParams(
                window.location.hash.substring(1)
            );

            const params = new URLSearchParams(window.location.search);

            const errorCode = hash.get("error_code") || params.get("error_code");
            const errorDescription = hash.get("error_description") || params.get("error_description");

            if (errorCode) {
                alert(errorDescription || "The reset link is invalid or expired.");
                window.location.replace("/admin/forgot-password");
                return;
            }

            const accessToken = hash.get("access_token");
            const refreshToken = hash.get("refresh_token");
            const tokenHash = params.get("token_hash");
            const type = hash.get("type") || params.get("type");

            if (accessToken && refreshToken && type === "recovery") {
                const { error } = await supabaseClient.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken
                });

                if (error) {
                    alert("The reset link is invalid or expired.");
                    return;
                }
            } else if (tokenHash && type === "recovery") {
                const { error } = await supabaseClient.auth.verifyOtp({
                    token_hash: tokenHash,
                    type: "recovery"
                });

                if (error) {
                    alert("The reset link is invalid or expired.");
                    return;
                }
            }

            const { data, error } = await supabaseClient.auth.getSession();

            if (error || !data.session) {
                alert("Please request a new password reset link.");
                window.location.replace("/admin/forgot-password");
                return;
            }

            recoveryReady = true;
            history.replaceState(null, "", window.location.pathname);
        }

        initializeRecovery().catch(error => {
            console.error("Recovery initialization error:", error);
            alert("Unable to verify the reset link. Please request a new one.");
        });

        form.addEventListener("submit", async event => {
            event.preventDefault();

            if (!recoveryReady) {
                alert("Please wait while the reset link is verified.");
                return;
            }

            const password = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            button.disabled = true;
            button.textContent = "Updating...";

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password
                });

                if (error) {
                    alert(error.message);
                    return;
                }

                alert("Password updated successfully!");
                await supabaseClient.auth.signOut();
                window.location.replace("/admin/login");
            } catch (error) {
                console.error("Password update error:", error);
                alert("Something went wrong. Please try again.");
            } finally {
                button.disabled = false;
                button.textContent = "Update Password";
            }
        });
    </script>

</body>

</html>
