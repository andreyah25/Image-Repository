<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Cancelled | Captured Photography Studio</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .cancel-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 18px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .cancel-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #d9534f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            margin: 0 0 12px;
            color: #353535;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .notice {
            background: #faf6f6;
            border-radius: 12px;
            padding: 18px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 10px;
            background: #639a88;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="cancel-card">

        <div class="cancel-icon">
            <i class="fa-solid fa-xmark"></i>
        </div>

        <h1>Payment Cancelled</h1>

        <p class="subtitle">
            Your PayMongo payment was not completed.
        </p>

        <div class="notice">
            <strong>No payment was confirmed.</strong>
            <br><br>
            Your booking cannot be considered confirmed until
            the required reservation payment has been successfully
            completed and verified.
        </div>

        <a href="customer_booking.html" class="btn">
            <i class="fa-solid fa-arrow-left"></i>
            Return to Booking
        </a>

    </div>

</body>

</html>
