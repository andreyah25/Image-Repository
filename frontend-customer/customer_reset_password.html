<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/design/customer_reset_password.css">
</head>

<body>

    <button class="icon-arrow" onclick="history.back()" aria-label="Go Back">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back</span>
    </button>

    <div class="login-container">

        <!-- LEFT PANEL -->
        <div class="login-banner">

            <div class="banner-content">

                <div class="login-logo-container">
                    <img src="/images/captured.png" alt="Captured Studio Logo" class="login-logo">
                </div>

                <h1 class="banner-title">
                    Create a New Password
                </h1>

                <p class="banner-subtitle">
                    Enter a new password for your Captured Studio account.
                </p>

            </div>

        </div>


        <!-- RIGHT PANEL -->
        <div class="login-form-wrapper">

            <div class="login-form-container">

                <form id="resetPasswordForm" class="login-form">

                    <div class="input-group password-group">

                        <input type="password" id="newPassword" required minlength="6" placeholder=" ">

                        <label for="newPassword">
                            New Password
                        </label>

                        <button type="button" class="toggle-password" data-target="newPassword"
                            aria-label="Toggle password visibility">

                            <i class="fa-regular fa-eye-slash"></i>

                        </button>

                    </div>


                    <div class="input-group password-group">

                        <input type="password" id="confirmPassword" required minlength="6" placeholder=" ">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <button type="button" class="toggle-password" data-target="confirmPassword"
                            aria-label="Toggle password visibility">

                            <i class="fa-regular fa-eye-slash"></i>

                        </button>

                    </div>


                    <button type="submit" class="btn-login" id="resetPasswordBtn">

                        Reset Password

                    </button>

                    <p id="resetMessage" class="reset-message">
                    </p>

                </form>

            </div>

        </div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        // =========================
        // PASSWORD VISIBILITY
        // =========================

        document
            .querySelectorAll(".toggle-password")
            .forEach(button => {

                button.addEventListener("click", () => {

                    const input =
                        document.getElementById(
                            button.dataset.target
                        );

                    const icon =
                        button.querySelector("i");

                    if (input.type === "password") {

                        input.type = "text";

                        icon.className =
                            "fa-regular fa-eye";

                    } else {

                        input.type = "password";

                        icon.className =
                            "fa-regular fa-eye-slash";

                    }

                });

            });


        // =========================
        // RESET PASSWORD
        // =========================

        const resetForm =
            document.getElementById("resetPasswordForm");

        const resetButton =
            document.getElementById("resetPasswordBtn");

        const resetMessage =
            document.getElementById("resetMessage");


        resetForm.addEventListener("submit", async (e) => {

            e.preventDefault();


            const newPassword =
                document
                    .getElementById("newPassword")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            // Check password match

            if (newPassword !== confirmPassword) {

                resetMessage.textContent =
                    "Passwords do not match.";

                resetMessage.className =
                    "reset-message error";

                return;
            }


            // Minimum password length

            if (newPassword.length < 6) {

                resetMessage.textContent =
                    "Password must be at least 6 characters.";

                resetMessage.className =
                    "reset-message error";

                return;
            }


            resetButton.disabled = true;

            resetButton.textContent =
                "Updating...";


            try {

                const { error } =
                    await supabaseClient.auth.updateUser({

                        password: newPassword

                    });


                if (error) {
                    throw error;
                }


                resetMessage.textContent =
                    "Password updated successfully! Redirecting to login...";

                resetMessage.className =
                    "reset-message success";


                resetForm.reset();


                setTimeout(() => {

                    window.location.href =
                        "customer_login.html";

                }, 2000);


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                resetMessage.textContent =
                    error.message ||
                    "Unable to reset your password.";

                resetMessage.className =
                    "reset-message error";


            } finally {

                resetButton.disabled = false;

                resetButton.textContent =
                    "Reset Password";

            }

        });

    </script>

</body>

</html>
