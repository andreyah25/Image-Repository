        /* =========================================================
           AUTHENTICATION
        ========================================================= */

        async function checkAdminAccess() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.getUser();


                if (error) {

                    console.error(
                        "Auth error:",
                        error
                    );

                    redirectToLogin();

                    return false;

                }


                const user = data.user;


                if (!user) {

                    redirectToLogin();

                    return false;

                }


                currentUser = user;

                const {
                    data: staffProfile,
                    error: staffError
                } =
                    await supabaseClient
                        .from("staff_profiles")
                        .select("*")
                        .eq("id", user.id)
                        .maybeSingle();


                if (staffError) {

                    console.error(
                        "Staff profile error:",
                        staffError
                    );

                    alert(
                        "Unable to verify your admin account."
                    );

                    redirectToLogin();

                    return false;

                }


                if (!staffProfile) {

                    alert(
                        "You are not registered as an administrator."
                    );

                    redirectToDashboard();

                    return false;

                }


                /*
                 * ADMIN ONLY
                 */

                if (
                    String(staffProfile.role).toLowerCase()
                    !== "admin"
                ) {

                    alert(
                        "Access denied. Only administrators can manage packages."
                    );

                    redirectToDashboard();

                    return false;

                }


                /*
                 * ACTIVE ADMIN ONLY
                 */

                if (
                    staffProfile.status &&
                    String(staffProfile.status).toLowerCase()
                    !== "active"
                ) {

                    alert(
                        "Your admin account is not active."
                    );

                    redirectToDashboard();

                    return false;

                }


                currentAdmin = staffProfile;


                updateAdminHeader(
                    staffProfile,
                    user
                );


                return true;

            }

            catch (error) {

                console.error(
                    "Admin verification error:",
                    error
                );

                alert(
                    "Unable to verify administrator access."
                );

                redirectToLogin();

                return false;

            }

        }

        /* =========================================================

        async function loadPackages() {

            const grid =
                document.getElementById("packageGrid");


            grid.innerHTML = `

        <div class="loading-state">

            <i class="fa-solid fa-spinner fa-spin"></i>

            Loading packages...

        </div>

    `;


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("packages")
                        .select("*")
                        .order("name", {
                            ascending: true
                        });


                if (error) {

                    console.error(
                        "Load packages error:",
                        error
                    );

                    grid.innerHTML = `

                <div class="empty-state">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <p>
                        Unable to load packages.
                    </p>

                </div>

            `;

                    showToast(
                        error.message,
                        "error"
                    );

                    return;

                }


                packages = data || [];


                /*
                 * If database is empty,
                 * insert the default Captured packages.
                 */

                if (packages.length === 0) {

                    await createDefaultPackages();

                    return;

                }


                renderPackages();

            }

            catch (error) {

                console.error(
                    "Unexpected load error:",
                    error
                );

                showToast(
                    "Unable to load packages.",
                    "error"
                );

            }

        }

        function formatDuration(minutes) {

            minutes = Number(minutes);

            if (!minutes || minutes <= 0) {
                return "";
            }

            if (minutes < 60) {
                return `${minutes} minutes`;
            }

            const hours = Math.floor(minutes / 60);
            const remainingMinutes = minutes % 60;

            if (remainingMinutes === 0) {
                return hours === 1
                    ? "1 hour"
                    : `${hours} hours`;
            }

            return `${hours} hour${hours > 1 ? "s" : ""} ${remainingMinutes} minutes`;
        }

        /* =========================================================
           ADD / UPDATE PACKAGE
        ========================================================= */

        document
            .getElementById("packageForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const saveButton =
                        document.getElementById(
                            "savePackageBtn"
                        );


                    const id =
                        document.getElementById(
                            "packageId"
                        ).value;


                    const name =
                        document.getElementById(
                            "packageName"
                        ).value.trim();


                    const price =
                        Number(
                            document.getElementById(
                                "packagePrice"
                            ).value
                        );


                    const duration =
                        document.getElementById(
                            "packageDuration"
                        ).value;


                    const description =
                        document.getElementById(
                            "packageDescription"
                        ).value.trim();


                    const status =
                        document.getElementById(
                            "packageStatus"
                        ).value;


                    if (!name) {

                        showToast(
                            "Package name is required.",
                            "error"
                        );

                        return;

                    }


                    if (price < 0 || Number.isNaN(price)) {

                        showToast(
                            "Please enter a valid price.",
                            "error"
                        );

                        return;

                    }


                    saveButton.disabled = true;

                    saveButton.textContent =
                        id
                            ? "Updating..."
                            : "Saving...";


                    try {


                        /* =========================
                           UPDATE
                        ========================= */

                        if (id) {

                            const {
                                data,
                                error
                            } =
                                await supabaseClient
                                    .from("packages")
                                    .update({

                                        name: name,

                                        price: price,

                                        duration: duration,

                                        description:
                                            description,

                                        status: status

                                    })
                                    .eq(
                                        "id",
                                        id
                                    )
                                    .select()
                                    .single();


                            if (error) {

                                console.error(
                                    "Update error:",
                                    error
                                );

                                showToast(
                                    "Update failed: "
                                    + error.message,
                                    "error"
                                );

                                return;

                            }


                            /*
                             * Update local display
                             */

                            const index =
                                packages.findIndex(
                                    item =>
                                        item.id === id
                                );


                            if (index !== -1) {

                                packages[index] =
                                    data;

                            }


                            showToast(
                                "Package updated successfully."
                            );

                        }


                        /* =========================
                           ADD
                        ========================= */

                        else {

                            const {
                                data,
                                error
                            } =
                                await supabaseClient
                                    .from("packages")
                                    .insert({

                                        name: name,

                                        price: price,

                                        duration: duration,

                                        description:
                                            description,

                                        status: status

                                    })
                                    .select()
                                    .single();


                            if (error) {

                                console.error(
                                    "Insert error:",
                                    error
                                );

                                showToast(
                                    "Add failed: "
                                    + error.message,
                                    "error"
                                );

                                return;

                            }


                            packages.push(data);


                            showToast(
                                "Package added successfully."
                            );

                        }


                        renderPackages();

                        closeModal();

                    }

                    catch (error) {

                        console.error(
                            "Save package error:",
                            error
                        );

                        showToast(
                            "Something went wrong while saving.",
                            "error"
                        );

                    }

                    finally {

                        saveButton.disabled = false;

                        saveButton.textContent =
                            "Save Package";

                    }

                }
            );



        /* =========================================================
           DELETE PACKAGE
        ========================================================= */

        async function deletePackage(id) {

            const packageItem =
                packages.find(
                    item => item.id === id
                );


            if (!packageItem) {

                return;

            }


            const confirmed =
                confirm(
                    `Are you sure you want to delete "${packageItem.name}"?`
                );


            if (!confirmed) {

                return;

            }


            try {


                const {
                    error
                } =
                    await supabaseClient
                        .from("packages")
                        .delete()
                        .eq(
                            "id",
                            id
                        );


                if (error) {

                    console.error(
                        "Delete error:",
                        error
                    );

                    showToast(
                        "Delete failed: "
                        + error.message,
                        "error"
                    );

                    return;

                }


                packages =
                    packages.filter(
                        item =>
                            item.id !== id
                    );


                renderPackages();


                showToast(
                    "Package deleted successfully."
                );

            }

            catch (error) {

                console.error(error);

                showToast(
                    "Unable to delete package.",
                    "error"
                );

            }

        }



        /* =========================================================
           ACTIVATE / DEACTIVATE
        ========================================================= */

        async function togglePackage(id) {

            const packageItem =
                packages.find(
                    item => item.id === id
                );


            if (!packageItem) {

                return;

            }


            const newStatus =
                packageItem.status === "Available"
                    ? "Not Available"
                    : "Available";


            try {


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("packages")
                        .update({

                            status: newStatus

                        })
                        .eq("id", id)
                        .select()
                        .single();


                if (error) {

                    console.error(
                        "Toggle error:",
                        error
                    );

                    showToast(
                        "Unable to update status: "
                        + error.message,
                        "error"
                    );

                    return;

                }


                const index =
                    packages.findIndex(
                        item =>
                            item.id === id
                    );


                if (index !== -1) {

                    packages[index] =
                        data;

                }


                renderPackages();


                showToast(
                    `${data.name} is now ${data.status}.`
                );

            }
            catch (error) {

                console.error(error);

                showToast(
                    "Unable to update package status.",
                    "error"
                );

            }

        }



        /* =========================================================
           ESCAPE HTML
        ========================================================= */

        function escapeHTML(value) {

            return String(value)

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );

        }

        }



        /* =========================================================
           REDIRECT HELPERS
        ========================================================= */

        function redirectToLogin() {

            window.location.href =
                "admin_login.html";

        }


        function redirectToDashboard() {

            window.location.href =
                "admin_dashboard.html";

        }



        /* =========================================================
           CLOSE MODAL WHEN CLICKING OUTSIDE
        ========================================================= */

        document
            .getElementById("packageModal")
            .addEventListener(
                "click",
                function (event) {

                    if (
                        event.target === this
                    ) {

                        closeModal();

                    }

                }
            );



        /* =========================================================
           INITIALIZATION
        ========================================================= */

        async function initializePage() {

            /*
             * First verify login and admin role.
             */

            const isAdmin =
                await checkAdminAccess();


            if (!isAdmin) {

                return;

            }


            /*
             * Then load packages from Supabase.
             */

            await loadPackages();

        }


        initializePage();


    </script>

</body>
