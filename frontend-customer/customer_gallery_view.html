<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery - Website Name</title>

    <!-- Direct Google Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Dedicated CSS for this page only -->

</head>

<body>

    <!-- TOP NAVBAR -->
    <header class="top-navbar">
        <div class="logo-section">
            <img src="/images/captured.png" class="logo-img" alt="Captured Photography Studio"> <span>Captured
                Photography Studio</span>
        </div>
        <div class="navbar-right">
            <img id="userAvatar" class="avatar" alt="Profile" style="display:none;"><span id="userName">
                Loading...
            </span>
        </div>
    </header>

    <div class="dashboard-wrapper">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <nav>
                <a href="customer_booking.html">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span>Book a Session</span>
                </a>
                <a href="customer_gallery_request.html" class="active">
                    <i class="fa-regular fa-image"></i>
                    <span>My Gallery</span>
                </a>
                <a href="customer_profile.html">
                    <i class="fa-regular fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <button type="button" class="logout-btn" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket logout-icon"></i>
                <span>Log out</span>
            </button>
        </aside>
        <main class="content">

            <div class="gallery-header">

                <div>
                    <h1 id="galleryTitle">Loading...</h1>
                    <p id="gallerySubtitle">Loading...</p>
                </div>

                <button id="downloadAllBtn" class="btn-download-all">
                    <i class="fa-solid fa-download"></i>
                    Download All
                </button>

            </div>



            <!-- ADD THIS -->
            <div id="galleryGrid" class="gallery-grid"></div>

        </main>

    </div>

    <!-- PAYMENT REQUIRED POPUP MODAL (Hidden by default) -->
    <div class="modal-overlay" id="paymentModal">
        <div class="payment-modal-card">

            <!-- Dark Modal Header -->
            <div class="modal-header">
                <i class="fa-regular fa-credit-card modal-card-icon"></i>
                <h2>Payment Required</h2>
            </div>

            <!-- Modal Body Content -->
            <div class="modal-body">
                <p class="modal-prompt-text">
                    Complete your payment to save and<br>download your images.
                </p>

                <!-- Action Buttons -->
                <div class="modal-actions-row">
                    <button type="button" class="btn-modal-cancel" id="btnMaybeLater">Maybe Later</button>
                    <!-- Routes to a checkout or payment page -->
                    <a href="customer_checkout.html" class="btn-modal-proceed">Proceed to Payment</a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        /* =========================================================
           SUPABASE CONFIGURATION
        ========================================================= */
        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );
        let loggedInUser = null;

        async function getLoggedInCustomer() {

            try {

                const {
                    data: { user },
                    error
                } = await supabaseClient.auth.getUser();

                if (error) {
                    console.error("AUTH ERROR:", error);
                    return null;
                }

                if (!user) {
                    console.warn("NO LOGGED-IN USER");
                    return null;
                }

                loggedInUser = user;

                console.log("=================================");
                console.log("LOGGED-IN CUSTOMER");
                console.log("User ID:", user.id);
                console.log("Email:", user.email);
                console.log("Metadata:", user.user_metadata);
                console.log("=================================");

                return user;

            } catch (error) {

                console.error(
                    "Failed to fetch logged-in customer:",
                    error
                );

                return null;
            }
        }
        async function loadCustomerProfile() {

            const userNameElement =
                document.getElementById("userName");

            const avatarElement =
                document.getElementById("userAvatar");

            if (!userNameElement) {
                console.error("ERROR: #userName element was not found.");
                return;
            }

            if (!avatarElement) {
                console.error("ERROR: #userAvatar element was not found.");
                return;
            }

            if (!loggedInUser) {
                console.warn("No logged-in user.");
                return;
            }

            console.log("=================================");
            console.log("FETCHING CUSTOMER PROFILE");
            console.log("Auth User ID:", loggedInUser.id);
            console.log("Auth Email:", loggedInUser.email);
            console.log("=================================");

            try {

                let profile = null;

                // =====================================================
                // 1. FIND PROFILE USING AUTH USER ID
                // =====================================================

                const {
                    data: profileById,
                    error: profileIdError
                } = await supabaseClient
                    .from("profiles")
                    .select("*")
                    .eq("id", loggedInUser.id)
                    .maybeSingle();

                if (profileIdError) {

                    console.error(
                        "Profile ID lookup error:",
                        profileIdError
                    );

                } else if (profileById) {

                    profile = profileById;

                    console.log(
                        "Profile found using Auth User ID."
                    );
                }


                // =====================================================
                // 2. IF NOT FOUND, SEARCH BY EMAIL
                // =====================================================

                if (!profile && loggedInUser.email) {

                    console.log(
                        "No profile found by Auth ID."
                    );

                    console.log(
                        "Trying profile using email:",
                        loggedInUser.email
                    );

                    const {
                        data: profileByEmail,
                        error: profileEmailError
                    } = await supabaseClient
                        .from("profiles")
                        .select("*")
                        .eq("email", loggedInUser.email)
                        .maybeSingle();

                    if (profileEmailError) {

                        console.error(
                            "Profile email lookup error:",
                            profileEmailError
                        );

                    } else if (profileByEmail) {

                        profile = profileByEmail;

                        console.log(
                            "Profile found using email."
                        );
                    }
                }


                // =====================================================
                // 3. DISPLAY PROFILE RESULT
                // =====================================================

                console.log("=================================");
                console.log("FINAL PROFILE:");
                console.log(profile);
                console.log("=================================");


                // =====================================================
                // 4. GET CUSTOMER NAME
                // =====================================================

                const customerName =
                    profile?.full_name ||
                    profile?.name ||
                    loggedInUser.user_metadata?.full_name ||
                    loggedInUser.user_metadata?.name ||
                    loggedInUser.email ||
                    "Customer";


                // =====================================================
                // 5. GET CUSTOMER AVATAR
                // =====================================================

                const customerAvatar =
                    profile?.avatar_url ||
                    profile?.profile_image ||
                    profile?.avatar ||
                    loggedInUser.user_metadata?.avatar_url ||
                    loggedInUser.user_metadata?.picture ||
                    null;


                // =====================================================
                // 6. DISPLAY NAME
                // =====================================================

                userNameElement.textContent =
                    customerName;


                // =====================================================
                // 7. DISPLAY AVATAR
                // =====================================================

                if (customerAvatar) {

                    avatarElement.style.display = "block";

                    avatarElement.src = customerAvatar;

                    avatarElement.onerror = function () {

                        console.warn(
                            "Profile image failed to load:",
                            customerAvatar
                        );

                        this.onerror = null;
                        this.style.display = "none";

                    };

                } else {

                    // No profile image.
                    // Do not load default-profile.png.
                    avatarElement.style.display = "none";
                }


                console.log("=================================");
                console.log("CUSTOMER DISPLAY");
                console.log("Name:", customerName);
                console.log("Avatar:", customerAvatar);
                console.log("=================================");


            } catch (error) {

                console.error(
                    "LOAD CUSTOMER PROFILE ERROR:",
                    error
                );

                // Safe fallback
                userNameElement.textContent =
                    loggedInUser.email || "Customer";

                avatarElement.style.display = "none";
            }
        }
        const galleryTitle =
            document.getElementById("galleryTitle");

        const gallerySubtitle =
            document.getElementById("gallerySubtitle");

        const galleryGrid =
            document.getElementById("galleryGrid");

        const downloadAllBtn =
            document.getElementById("downloadAllBtn");

        const paymentModal =
            document.getElementById("paymentModal");

        const closeButton =
            document.getElementById("btnMaybeLater");


        let currentRepository = null;

        let currentBooking = null;

        let currentPhotos = [];
        window.addEventListener("DOMContentLoaded", async () => {

            // Get the currently logged-in Supabase user
            const user = await getLoggedInCustomer();

            // If nobody is logged in, stop here
            if (!user) {

                showGalleryError(
                    "Login Required",
                    "Please log in to access your gallery."
                );

                return;
            }

            // Load the logged-in customer's profile/avatar/name
            await loadCustomerProfile();

            // Load the customer's gallery
            await initializeGallery();

        });
        async function initializeGallery() {

            const urlParams =
                new URLSearchParams(
                    window.location.search
                );


            const token =
                urlParams.get("token");


            /* -----------------------------------------
               NO TOKEN
            ----------------------------------------- */

            if (!token || token.trim() === "") {

                showGalleryError(
                    "Invalid Gallery Link",
                    "Please use the gallery link provided by the studio."
                );

                return;
            }


            try {

                const {
                    data: repository,
                    error
                } = await supabaseClient
                    .from("repository_client_links")
                    .select("id, booking_id, access_token")
                    .eq("access_token", token.trim())
                    .limit(1)
                    .maybeSingle();

                console.log(
                    "TOKEN:",
                    token
                );

                console.log(
                    "REPOSITORY:",
                    repository
                );

                console.log(
                    "REPOSITORY ERROR:",
                    JSON.stringify(error, null, 2)
                );
                if (error) {

                    console.error(
                        "Repository validation error:",
                        error
                    );


                    showGalleryError(
                        "Unable to Open Gallery",
                        "We could not verify this gallery link."
                    );

                    return;
                }



                if (!repository) {

                    console.warn(
                        "Invalid gallery token."
                    );


                    showGalleryError(
                        "Invalid Gallery Link",
                        "This gallery link does not exist or may have expired."
                    );

                    return;
                }


                currentRepository =
                    repository;


                const {
                    data: booking,
                    error: bookingError
                } = await supabaseClient
                    .from("bookings")
                    .select("*")
                    .eq(
                        "id",
                        repository.booking_id
                    )
                    .maybeSingle();


                if (bookingError) {

                    console.error(
                        "Booking error:",
                        bookingError
                    );


                    showGalleryError(
                        "Unable to Load Gallery",
                        "The booking information could not be loaded."
                    );

                    return;
                }


                if (!booking) {

                    showGalleryError(
                        "Gallery Not Found",
                        "The booking associated with this gallery could not be found."
                    );

                    return;
                }


                /* =========================================================
                   VERIFY THAT THIS GALLERY BELONGS TO THE LOGGED-IN USER
                ========================================================= */

                if (!loggedInUser) {

                    showGalleryError(
                        "Login Required",
                        "Please log in to access your gallery."
                    );

                    return;
                }

                console.log("=================================");
                console.log("GALLERY OWNERSHIP CHECK");
                console.log("Logged-in Auth User ID:", loggedInUser.id);
                console.log("Booking Customer ID:", booking.customer_id);
                console.log("Logged-in Email:", loggedInUser.email);
                console.log("Booking Email:", booking.email);
                console.log("=================================");

                if (booking.customer_id !== loggedInUser.id) {

                    console.warn(
                        "Gallery does not belong to logged-in user."
                    );

                    showGalleryError(
                        "Gallery Access Denied",
                        "This gallery does not belong to the currently logged-in account."
                    );

                    return;
                }


                currentBooking =
                    booking;


                displayClientInformation(
                    booking
                );


                await loadRepositoryPhotos(
                    repository.id
                );


            } catch (error) {

                console.error(
                    "Gallery initialization error:",
                    error
                );


                showGalleryError(
                    "Unable to Open Gallery",
                    "Something went wrong while verifying your gallery link."
                );

            }

        }


        function displayClientInformation(
            booking
        ) {

            const clientName =
                booking.full_name ||
                "Customer";


            const sessionType =
                booking.session_type ||
                "Photography Session";


            const bookingDate =
                formatDate(
                    booking.booking_date
                );


            galleryTitle.textContent =
                clientName;


            gallerySubtitle.textContent =
                `${sessionType} • ${bookingDate}`;

        }

        async function loadRepositoryPhotos(
            repositoryId
        ) {

            galleryGrid.innerHTML = `

        <div class="gallery-loading">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <p>
                Loading your photos...
            </p>

        </div>

    `;


            const {
                data: photos,
                error
            } = await supabaseClient
                .from("repository_photos")
                .select("*")
                .eq(
                    "repository_id",
                    repositoryId
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Photo loading error:",
                    error
                );


                galleryGrid.innerHTML = `

            <div class="gallery-loading">

                <i class="fa-solid fa-circle-exclamation"></i>

                <p>
                    Unable to load your photos.
                </p>

            </div>

        `;

                return;
            }


            currentPhotos =
                photos || [];


            renderGalleryPhotos(
                currentPhotos
            );

        }


        /* =========================================================
           RENDER PHOTOS
        ========================================================= */

        function renderGalleryPhotos(
            photos
        ) {

            galleryGrid.innerHTML = "";


            if (
                !photos ||
                photos.length === 0
            ) {

                galleryGrid.innerHTML = `

            <div class="gallery-loading">

                <i class="fa-regular fa-images"></i>

                <p>
                    No photos have been uploaded yet.
                </p>

                <small>
                    Please check again later.
                </small>

            </div>

        `;

                return;
            }


            photos.forEach(
                photo => {

                    const card =
                        document.createElement("div");


                    card.className =
                        "photo-card";


                    const image =
                        document.createElement("img");


                    const highQuality =
                        canAccessHighQuality();

                    image.src =
                        highQuality
                            ? (photo.image_url || "")
                            : (photo.preview_url || "");


                    image.alt =
                        photo.original_name ||
                        "Gallery Photo";


                    image.loading =
                        "lazy";


                    const button =
                        document.createElement("button");


                    button.type =
                        "button";


                    button.className =
                        "individual-download-btn";


                    button.innerHTML =
                        `<i class="fa-solid fa-download"></i>`;


                    button.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                            downloadPhoto(
                                photo
                            );

                        }
                    );


                    card.appendChild(
                        image
                    );


                    card.appendChild(
                        button
                    );


                    galleryGrid.appendChild(
                        card
                    );

                }
            );

        }

        function canAccessHighQuality() {

            if (!currentRepository) {
                return false;
            }

            // Paid customers can always access high quality
            if (currentRepository.download_access === true) {
                return true;
            }

            // Check the 48-hour free period
            if (
                currentRepository.gallery_access_expires_at
            ) {

                const now = new Date();

                const expiresAt = new Date(
                    currentRepository.gallery_access_expires_at
                );

                return now < expiresAt;
            }

            return false;
        }
        /* =========================================================
           DOWNLOAD INDIVIDUAL
        ========================================================= */
        function downloadPhoto(photo) {

            /*
             * HIGH QUALITY
             *
             * Either:
             * 1. Still within the first 48 hours
             * 2. Customer has already paid
             */

            if (canAccessHighQuality()) {

                if (!photo.image_url) {

                    alert(
                        "High-quality photo is unavailable."
                    );

                    return;
                }

                window.open(
                    photo.image_url,
                    "_blank"
                );

                return;
            }


            /*
             * AFTER 48 HOURS
             *
             * Customer has not paid.
             * They can only download the low-quality preview.
             */

            if (!photo.preview_url) {

                alert(
                    "Preview photo is unavailable."
                );

                return;
            }

            window.open(
                photo.preview_url,
                "_blank"
            );
        }
        /* =========================================================
           PAYMENT MODAL
        ========================================================= */

        function openPaymentModal() {

            if (!paymentModal) {
                return;
            }


            paymentModal.classList.add(
                "active"
            );

        }


        function closePaymentModal() {

            if (!paymentModal) {
                return;
            }


            paymentModal.classList.remove(
                "active"
            );

        }


        if (closeButton) {

            closeButton.addEventListener(
                "click",
                closePaymentModal
            );

        }


        if (paymentModal) {

            paymentModal.addEventListener(
                "click",
                event => {

                    if (
                        event.target ===
                        paymentModal
                    ) {

                        closePaymentModal();

                    }

                }
            );

        }


        /* =========================================================
           ERROR SCREEN
        ========================================================= */

        function showGalleryError(
            title,
            message
        ) {

            galleryTitle.textContent =
                title;


            gallerySubtitle.textContent =
                message;


            if (downloadAllBtn) {

                downloadAllBtn.style.display =
                    "none";

            }


            if (!galleryGrid) {
                return;
            }


            galleryGrid.innerHTML = `

        <div class="gallery-loading">

            <i class="fa-solid fa-link-slash"></i>

            <p>
                ${escapeHTML(message)}
            </p>

            <a
                href="customer_gallery_request.html"
                style="
                    display:inline-block;
                    margin-top:15px;
                    padding:10px 18px;
                    background:#639A88;
                    color:white;
                    text-decoration:none;
                    border-radius:6px;
                "
            >
                Enter Gallery Link
            </a>

        </div>

    `;

        }


        /* =========================================================
           DATE
        ========================================================= */

        function formatDate(
            dateString
        ) {

            if (!dateString) {

                return "Date not specified";

            }


            const date =
                new Date(
                    dateString + "T00:00:00"
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return dateString;

            }


            return date.toLocaleDateString(
                "en-US",
                {
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            );

        }


        /* =========================================================
           ESCAPE HTML
        ========================================================= */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }
        document.getElementById("logoutBtn").addEventListener("click", async () => {

            const { error } = await supabaseClient.auth.signOut();

            if (error) {
                console.error("Logout error:", error);
                alert("Unable to log out.");
                return;
            }

            window.location.href = "customer_homepage.html";
        });
    </script>


</body>
