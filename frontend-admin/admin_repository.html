<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/design/admin_dashboard.css">
    <link rel="stylesheet" href="/design/admin_client.css">
    <link rel="stylesheet" href="/design/admin_repository.css">
</head>

<body>

    <header class="top-navbar">
        <div class="logo-section">
            <img src="/images/captured.png" class="logo-box" alt="Captured Studio Logo">
            <span>Captured Studio</span>
        </div>

        <div class="navbar-right">
            <!-- Clickable notification bell icon -->
            <button type="button" class="notification-btn" id="notificationTrigger" aria-label="Notifications">
                <i class="fa-solid fa-bell"></i>
            </button>
            <div class="user-profile">
                <img id="userAvatar" class="avatar" src="https://via.placeholder.com/42" alt="Profile">
                <span id="userName">Loading...</span>
            </div>
        </div>
    </header>

    <div class="dashboard-wrapper">

        <aside class="sidebar">
            <nav>
                <a href="admin_dashboard.html">
                    <i class="fa-solid fa-table-cells-large"></i>
                    Home
                </a>
                <a href="admin_client.html">
                    <i class="fa-solid fa-users"></i>
                    Clients
                </a>
                <a href="admin_repository.html" class="active">
                    <i class="fa-solid fa-book"></i>
                    Repository
                </a>
                <a href="admin_payment.html">
                    <i class="fa-solid fa-credit-card"></i>
                    Payments
                </a>
                <!-- Archives Menu Item positioned correctly below Payments -->
                <a href="admin_archives.html">
                    <i class="fa-solid fa-box-archive"></i>
                    Archives
                </a>
                <a href="admin_profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
                <a href="admin_settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </nav>

            <a href="admin_login.html" class="logout-btn" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket logout-icon"></i>
                <span>Log out</span>
            </a>
        </aside>

        <main class="content">

            <div class="repo-top-header-block">
                <div class="page-header">
                    <h1>Repository</h1>
                    <p>Manage and organize folders and images stored in your workspace.</p>
                </div>

                <div class="filter-dropdown-wrapper">
                    <button class="add-new-client-btn" id="addNewDropdownTrigger">
                        <i class="fa-solid fa-plus"></i>
                        Add New
                    </button>
                    <div class="add-new-dropdown-box" id="addNewDropdownMenu">
                        <button id="uploadPhotosActionOption">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span>Upload Photos</span>
                        </button>
                        <button id="createFolderActionOption">
                            <i class="fa-regular fa-folder"></i>
                            <span>Create New Events</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="repo-sub-actions-container">
                <div class="repo-filter-selects-group">
                    <div class="repo-select-wrapper">
                        <select>
                            <option>All tags</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-arrow"></i>
                    </div>
                    <div class="repo-select-wrapper">
                        <select>
                            <option>All events</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-arrow"></i>
                    </div>
                    <div class="repo-select-wrapper">
                        <select>
                            <option>Sort by:</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-arrow"></i>
                    </div>
                </div>

                <div class="client-actions-row">
                    <div class="table-search-box">
                        <input type="text" id="repoFolderSearchInput" placeholder="Search repository...">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                </div>
            </div>

            <div class="repo-view-container">

                <div class="repo-folders-grid-panel" id="foldersView">
                    <div class="empty-repo-message">Loading active directories...</div>
                </div>

                <div class="repo-photos-grid-panel" id="photosView" style="display:none;">
                    <div class="empty-repo-message">No photos yet.</div>
                </div>

            </div>

        </main>
    </div>
    <div class="modal-overlay" id="createFolderModal">
        <div class="modal-card">

            <div class="modal-header">
                <i class="fa-solid fa-folder-plus"></i>
                <h2>Create Folder</h2>
            </div>

            <form id="newEventForm" class="modal-form">

                <div class="form-field">

                    <input type="text" id="eventNameInput" placeholder="Event Name" required>

                </div>

                <button class="save-client-btn" type="submit">

                    Create Event

                </button>

            </form>
        </div>
    </div>
    <input type="file" id="photoFilesUploader" multiple accept="image/*" style="display: none;">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        
        const createFolderModal =
            document.getElementById("createFolderModal");

        document
            .getElementById("createFolderActionOption")
            .addEventListener("click", (e) => {

                e.preventDefault();
                e.stopPropagation();

                addNewMenu.classList.remove("show");

                createFolderModal.classList.add("show");

            });

        createFolderModal.onclick = (e) => {

            if (e.target === createFolderModal) {

                createFolderModal.classList.remove("show");

            }

        };
        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );
        let currentUser = null;
        let selectedFolderId = null;
        let allFolders = [];
        const addNewBtn = document.getElementById("addNewDropdownTrigger");
        const addNewMenu = document.getElementById("addNewDropdownMenu");

        addNewBtn.addEventListener("click", (e) => {

            e.stopPropagation();

            addNewMenu.classList.toggle("show");

        });

        document.addEventListener("click", () => {

            addNewMenu.classList.remove("show");

        });
        window.addEventListener("load", async () => {

            const {
                data: { session }
            } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = "admin_login.html";
                return;
            }

            currentUser = session.user;

            // Load profile
            const { data: profile } = await supabaseClient
                .from("staff_profiles")
                .select("*")
                .eq("id", currentUser.id)
                .single();

            if (profile) {

                document.getElementById("userName").textContent =
                    profile.full_name;

                if (profile.avatar_url) {
                    document.getElementById("userAvatar").src =
                        profile.avatar_url;
                }
            }

            loadEvents();
        });

        //LOAD FOLDERS
        async function loadEvents() {

            const { data, error } = await supabaseClient

                .from("event_folders")

                .select("*")

                .eq("user_id", currentUser.id)

                .order("event_name");

            if (error) {

                console.log(error);

                return;

            }

            allFolders = data;

            renderEvents(data);

        }

        async function loadPhotos(folderId) {

            document.getElementById("foldersView").style.display = "none";

            document.getElementById("photosView").style.display = "grid";

            const { data, error } = await supabaseClient

                .from("photos")

                .select("*")

                .eq("folder_id", folderId)

                .order("created_at", { ascending: false });

            if (error) {

                console.log(error);

                return;

            }

            renderPhotos(data);

        }
        function renderPhotos(photos) {

            const view =
                document.getElementById("photosView");


            view.innerHTML = "";


            if (photos.length === 0) {

                view.innerHTML = `
        <div class="empty-repo-message">
            No photos yet.
        </div>`;

                return;
            }


            photos.forEach(photo => {

                view.innerHTML += `

        <div class="photo-card">

            <img src="${photo.image_url}">

        </div>

        `;

            });

        }
        document

            .getElementById("uploadPhotosActionOption")

            .addEventListener("click", () => {

                if (!selectedFolderId) {

                    alert("Please open a folder first.");

                    return;

                }

                document.getElementById("photoFilesUploader").click();

            });
        document

            .getElementById("photoFilesUploader")

            .addEventListener("change", uploadPhotos);
        function renderEvents(events) {

            const view =
                document.getElementById("foldersView");

            view.innerHTML = "";

            if (events.length === 0) {

                view.innerHTML = `

            <div class="empty-repo-message">

                No events yet.

            </div>

        `;

                return;

            }

           
            events.forEach(event => {

                view.innerHTML += `

        <div class="folder-card"
        data-id="${event.id}">
            <i class="fa-solid fa-folder folder-icon"></i>
            <h3>${event.event_name}</h3>
        </div>

    `;

            });


            document.querySelectorAll(".folder-card").forEach(card => {

                card.onclick = () => {

                    const eventId = card.dataset.id;

                    location.href =
                        `admin_customer_folders.html?event=${eventId}`;

                };

            });


        }
        async function uploadPhotos(e) {

            const files = e.target.files;

            if (!files.length) return;


            for (const file of files) {

                const filePath =
                    `${currentUser.id}/${selectedFolderId}/${Date.now()}_${file.name}`;


                const { error: uploadError } =
                    await supabaseClient.storage
                        .from("repository-photos")
                        .upload(filePath, file);


                if (uploadError) {

                    console.log(uploadError);
                    continue;

                }


                const { data: urlData } =
                    supabaseClient.storage
                        .from("repository-photos")
                        .getPublicUrl(filePath);



                await supabaseClient
                    .from("photos")
                    .insert([{

                        folder_id: selectedFolderId,

                        image_url: urlData.publicUrl,

                        file_name: file.name

                    }]);

            }


            alert("Photos uploaded successfully.");

            loadPhotos(selectedFolderId);

        }
        function renderFolders(folders) {
            const view = document.getElementById("foldersView");

            view.innerHTML = "";

            if (folders.length === 0) {
                view.innerHTML = `
            <div class="empty-repo-message">
                No events found.
            </div>
        `;
                return;
            }

            folders.forEach(event => {

                view.innerHTML += `
            <div class="folder-card" data-id="${event.id}">
                <i class="fa-solid fa-folder folder-icon"></i>
                <h3>${event.event_name}</h3>
            </div>
        `;

            });


            document.querySelectorAll(".folder-card").forEach(card => {

                card.onclick = () => {

                    const eventId = card.dataset.id;

                    selectedFolderId = eventId;

                    location.href =
                        `admin_customer_folders.html?event=${eventId}`;
                };

            });
        }

        document
            .getElementById("newEventForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                const eventName =
                    document.getElementById("eventNameInput").value.trim();

                const { error } = await supabaseClient

                    .from("event_folders")

                    .insert([{

                        user_id: currentUser.id,

                        event_name: eventName

                    }]);

                if (error) {

                    alert(error.message);

                    return;

                }

                createFolderModal.classList.remove("show");

                e.target.reset();

                loadEvents();

            });
        //SEARCH FUNCTIONALITY
        document
            .getElementById("repoFolderSearchInput")
            .addEventListener("input", (e) => {

                const keyword =
                    e.target.value.toLowerCase();

                const filtered =

                    allFolders.filter(folder => {

                        return (

                            (folder.folder_name || "")
                                .toLowerCase()
                                .includes(keyword)

                            ||

                            (folder.customer_name || "")
                                .toLowerCase()
                                .includes(keyword)

                            ||

                            (folder.event_type || "")
                                .toLowerCase()
                                .includes(keyword)

                        );

                    });

                renderFolders(filtered);

            });
        document

            .getElementById("logoutBtn")

            .addEventListener("click", async (e) => {

                e.preventDefault();

                await supabaseClient.auth.signOut();

                location.href = "admin_login.html";

            });
    </script>
</body>

</html>
