        async function loadBookingInformation() {

            if (!currentAccessRequest) {

                console.warn(
                    "GALLERY: No access request available."
                );

                return;
            }


            const bookingId =
                currentAccessRequest.booking_id ||
                currentAccessRequest.bookingId ||
                currentAccessRequest.booking?.id;


            if (!bookingId) {

                console.warn(
                    "GALLERY: booking_id was not returned by server."
                );
                const photoBookingId =
                    currentPhotos?.find(
                        photo =>
                            photo &&
                            (
                                photo.booking_id ||
                                photo.bookingId
                            )
                    )?.booking_id ||
                    currentPhotos?.find(
                        photo =>
                            photo &&
                            (
                                photo.booking_id ||
                                photo.bookingId
                            )
                    )?.bookingId;


                if (photoBookingId) {

                    console.log(
                        "GALLERY: Found booking ID from photo:",
                        photoBookingId
                    );

                    await fetchBooking(
                        photoBookingId
                    );

                } else {

                    console.warn(
                        "GALLERY: Could not determine booking ID."
                    );

                }

                return;
            }


            await fetchBooking(
                bookingId
            );
        }
        async function fetchBooking(bookingId) {

            console.log(
                "GALLERY: Loading booking:",
                bookingId
            );


            const {
                data: booking,
                error
            } =
                await supabaseClient
                    .from("bookings")
                    .select("*")
                    .eq("id", bookingId)
                    .maybeSingle();


            if (error) {

                console.error(
                    "GALLERY: Booking query error:",
                    error
                );

                return;
            }


            if (!booking) {

                console.warn(
                    "GALLERY: Booking not found:",
                    bookingId
                );

                return;
            }


            if (booking.package_id) {

                try {

                    const {
                        data: packageData,
                        error: packageError
                    } =
                        await supabaseClient
                            .from("packages")
                            .select("*")
                            .eq("id", booking.package_id)
                            .maybeSingle();


                    if (!packageError && packageData) {

                        booking.package_name =
                            packageData.name ||
                            packageData.package_name ||
                            packageData.title ||
                            "Photography Session";

                    }

                } catch (packageError) {

                    console.warn(
                        "GALLERY: Could not load package:",
                        packageError
                    );

                }

            }


            displayClientInformation(
                booking
            );
        }


        async function loadRepositoryPhotos() {

            console.log("GALLERY: Loading gallery...");

            try {

                // Get token and request directly from the current URL
                const params = new URLSearchParams(
                    window.location.search
                );

                const token =
                    params.get("token") || "";

                const requestId =
                    params.get("request") ||
                    params.get("requestId") ||
                    "";

                console.log(
                    "GALLERY: Token exists:",
                    !!token
                );

                console.log(
                    "GALLERY: Request ID:",
                    requestId
                );

                if (!token) {

                    throw new Error(
                        "Gallery token is missing."
                    );

                }

                if (!requestId) {

                    throw new Error(
                        "Gallery access request ID is missing."
                    );

                }


                // Load gallery from backend
                const response = await fetch(
                    `${SERVER_URL}/api/gallery-access/photos` +
                    `?token=${encodeURIComponent(token)}` +
                    `&request=${encodeURIComponent(requestId)}`
                );


                console.log(
                    "GALLERY: Server response:",
                    response.status
                );


                const result =
                    await response.json();


                console.log(
                    "GALLERY: Gallery result:",
                    result
                );


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.error ||
                        result.message ||
                        "Unable to load gallery."
                    );

                }


                /* =====================================================
                   REQUEST INFORMATION
                ===================================================== */

                currentAccessRequest = {

                    ...(currentAccessRequest || {}),

                    ...(result.request || {})

                };


                const requestNumber =
                    Number(
                        result.request?.request_number || 1
                    );


                galleryAccessNumber =
                    requestNumber;


                const paymentRequired =
                    result.request?.payment_required === true;


                const paymentConfirmed =
                    result.request?.payment_confirmed === true;


                const paymentPaid =
                    String(
                        result.request?.payment_status || ""
                    ).toLowerCase() === "paid";


                /*
                 * FIRST ACCESS
                 * ------------------------------
                 * Always full quality.
                 *
                 * SECOND ACCESS+
                 * ------------------------------
                 * Full quality only after payment.
                 */

                const fullQuality =
                    requestNumber === 1 ||
                    (
                        requestNumber >= 2 &&
                        paymentRequired &&
                        paymentConfirmed &&
                        paymentPaid
                    );


                galleryPreviewMode =
                    !fullQuality;


                console.log(
                    "GALLERY: Access number:",
                    requestNumber
                );

                console.log(
                    "GALLERY: Payment required:",
                    paymentRequired
                );

                console.log(
                    "GALLERY: Payment confirmed:",
                    paymentConfirmed
                );

                console.log(
                    "GALLERY: Payment paid:",
                    paymentPaid
                );

                console.log(
                    "GALLERY: Full quality:",
                    fullQuality
                );

                console.log(
                    "GALLERY: Preview mode:",
                    galleryPreviewMode
                );


                /* =====================================================
                   BOOKING INFORMATION
                ===================================================== */

                if (result.booking) {

                    currentBooking =
                        result.booking;


                    console.log(
                        "GALLERY: Booking received from server:",
                        result.booking
                    );


                    displayClientInformation(
                        result.booking
                    );

                } else {

                    console.warn(
                        "GALLERY: Server did not return booking information."
                    );

                }


                /* =====================================================
                   PHOTOS
                ===================================================== */

                currentPhotos =
                    result.photos || [];


                console.log(
                    "GALLERY: Photos:",
                    currentPhotos
                );


                renderGalleryPhotos(
                    currentPhotos
                );


                console.log(
                    "GALLERY: Gallery loading complete."
                );


                // IMPORTANT:
                // initializeGallery() expects true here.
                return true;

            }

            catch (error) {

                console.error(
                    "GALLERY: Failed to load gallery:",
                    error
                );


                if (galleryGrid) {

                    galleryGrid.innerHTML = `
                <div class="gallery-loading">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <p>Unable to load gallery.</p>
                    <small>${escapeHTML(
                        error.message ||
                        "Please try again later."
                    )}</small>
                </div>
            `;

                }


                return false;

            }

        }
        function canAccessHighQuality() {

            if (!currentAccessRequest) {

                return false;

            }

            if (
                currentAccessRequest.status &&
                currentAccessRequest.status !== "approved"
            ) {

                return false;

            }


            if (
                currentAccessRequest.access_expires_at
            ) {

                const expiresAt =
                    new Date(
                        currentAccessRequest.access_expires_at
                    );


                if (
                    Number.isNaN(
                        expiresAt.getTime()
                    )
                ) {

                    return false;

                }


                if (
                    new Date() >= expiresAt
                ) {

                    return false;

                }

            }
            const requestNumber =
                Number(
                    currentAccessRequest.request_number || 1
                );


            const paymentRequired =
                currentAccessRequest.payment_required === true;

            if (
                requestNumber === 1
            ) {

                return true;

            }
            if (
                requestNumber >= 2
            ) {

                if (!paymentRequired) {

                    return true;

                }


                const paymentConfirmed =
                    currentAccessRequest.payment_confirmed === true;


                const paymentPaid =
                    String(
                        currentAccessRequest.payment_status || ""
                    ).toLowerCase() === "paid";


                return (
                    paymentConfirmed &&
                    paymentPaid
                );

            }


            return false;

        }
        function renderGalleryPhotos(
            photos
        ) {

            galleryGrid.innerHTML = "";


            if (
                !photos ||
                photos.length === 0
            ) {

                galleryGrid.innerHTML = `
            <div class="gallery-loading">
                <i class="fa-regular fa-images"></i>
                <p>No photos have been uploaded yet.</p>
                <small>Please check again later.</small>
            </div>
        `;

                return;

            }


            const fullQuality =
                canAccessHighQuality();


            const requestNumber =
                Number(
                    currentAccessRequest?.request_number || 1
                );


            console.log(
                "GALLERY: Rendering photos.",
                "Full quality:",
                fullQuality,
                "Preview:",
                !fullQuality,
                "Request:",
                requestNumber
            );


            photos.forEach(
                photo => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "photo-card";


                    const image =
                        document.createElement(
                            "img"
                        );


                    /*
                     * =================================================
                     * FIRST ACCESS
                     * =================================================
                     *
                     * Full-quality signed URL.
                     */

                    if (fullQuality) {

                        image.src =
                            photo.image_url || "";


                        image.style.filter =
                            "none";


                        image.style.opacity =
                            "1";

                    }


                    /*
                     * =================================================
                     * SECOND ACCESS BEFORE PAYMENT
                     * =================================================
                     */

                    else {

                        image.src =
                            photo.preview_url ||
                            photo.image_url ||
                            "";


                        image.style.filter =
                            "blur(8px)";


                        image.style.opacity =
                            "0.75";

                    }


                    image.alt =
                        photo.original_name ||
                        "Gallery Photo";


                    image.loading =
                        "lazy";


                    card.appendChild(
                        image
                    );


                    /*
                     * DOWNLOAD BUTTON
                     */

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "individual-download-btn";


                    button.innerHTML =

                    <i class="fa-solid fa-download"></i>
                    Download
                `;


                    button.addEventListener(
                        "click",
                        () => {

                            downloadPhoto(
                                photo
                            );

                        }
                    );


                    card.appendChild(
                        button
                    );


                    galleryGrid.appendChild(
                        card
                    );

                }
            );

        }
        async function downloadPhoto(photo) {


            if (!canAccessHighQuality()) {

                openPaymentModal();

                return;
            }


            if (!photo) {

                alert(
                    "Photo is not available."
                );

                return;
            }


            try {

                const {
                    token
                } =
                    getGalleryParameters();


                const requestId =
                    currentAccessRequest?.id;


                if (!token) {

                    throw new Error(
                        "Gallery token is missing."
                    );

                }


                if (!requestId) {

                    throw new Error(
                        "Gallery access request ID is missing."
                    );

                }


                const response =
                    await fetch(
                        `${SERVER_URL}/api/gallery-access/open/${encodeURIComponent(requestId)}` +
                        `?token=${encodeURIComponent(token)}`
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "GALLERY: Download response:",
                        errorText
                    );


                    throw new Error(
                        "Unable to download photo."
                    );

                }


                const blob =
                    await response.blob();


                const blobUrl =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement("a");


                link.href =
                    blobUrl;


                link.download =
                    photo.original_name ||
                    "gallery-photo.jpg";


                document.body.appendChild(
                    link
                );


                link.click();


                document.body.removeChild(
                    link
                );


                setTimeout(
                    () => {
                        URL.revokeObjectURL(
                            blobUrl
                        );
                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "GALLERY: Photo download error:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to download the photo."
                );

            }
        }

        async function downloadAllPhotos() {

            if (!canAccessHighQuality()) {

                openPaymentModal();

                return;
            }


            if (
                !currentPhotos ||
                currentPhotos.length === 0
            ) {

                alert(
                    "No photos available to download."
                );

                return;
            }


            const originalText =
                downloadAllBtn.innerHTML;


            downloadAllBtn.disabled =
                true;


            downloadAllBtn.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Downloading...
            `;


            let successfulDownloads = 0;


            try {

                for (
                    let i = 0;
                    i < currentPhotos.length;
                    i++
                ) {

                    const photo =
                        currentPhotos[i];


                    try {

                        await downloadPhoto(
                            photo
                        );


                        successfulDownloads++;


                        await new Promise(
                            resolve =>
                                setTimeout(
                                    resolve,
                                    500
                                )
                        );

                    } catch (error) {

                        console.error(
                            "GALLERY: Failed to download:",
                            error
                        );

                    }

                }


                alert(
                    `${successfulDownloads} of ${currentPhotos.length} photos downloaded.`
                );


            } finally {

                downloadAllBtn.disabled =
                    false;


                downloadAllBtn.innerHTML =
                    originalText;

            }
        }

        function openPaymentModal() {

            if (!paymentModal) {
                return;
            }

            if (
                canAccessHighQuality()
            ) {

                return;

            }
            if (currentBooking) {

                if (summaryOrderId) {

                    summaryOrderId.textContent =
                        currentBooking.id
                            ? `#ORD-${String(currentBooking.id).slice(-3)}`
                            : "#ORD-001";

                }


                if (summaryClientName) {

                    summaryClientName.textContent =
                        currentBooking.full_name ||
                        "Customer";

                }

            }


            if (summaryAmount) {

                summaryAmount.textContent =
                    "₱1.00";

            }

            paymentModal.classList.add(
                "active"
            );

        }


        function closePaymentModal() {

            if (paymentModal) {

                paymentModal.classList.remove(
                    "active"
                );

            }

        }


        if (closeButton) {

            closeButton.addEventListener(
                "click",
                closePaymentModal
            );

        }


        if (paymentModal) {

            paymentModal.addEventListener(
                "click",
                event => {

                    if (
                        event.target ===
                        paymentModal
                    ) {

                        closePaymentModal();

                    }

                }
            );

        }

        if (btnPayMongo) {

            btnPayMongo.addEventListener(
                "click",
                startPayMongoGalleryPayment
            );

        }


        async function startPayMongoGalleryPayment() {

            if (!currentAccessRequest) {

                alert(
                    "Your gallery access request could not be verified."
                );

                return;
            }


            if (
                canAccessHighQuality()
            ) {

                closePaymentModal();

                return;

            }


            if (
                currentAccessRequest.payment_required !== true
            ) {

                alert(
                    "Payment is not required for this gallery request."
                );

                return;
            }


            if (
                currentAccessRequest.payment_confirmed === true
            ) {

                alert(
                    "Your gallery payment has already been confirmed."
                );

                return;
            }


            try {

                if (btnPayMongo) {

                    btnPayMongo.disabled =
                        true;

                    btnPayMongo.innerHTML =
                        `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Creating Payment...
            `;

                }


                const {
                    token
                } =
                    getGalleryParameters();


                const response =
                    await fetch(
                        `${SERVER_URL}/api/gallery-access/create-payment`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                requestId:
                                    currentAccessRequest.id,

                                token:
                                    token

                            })
                        }
                    );


                const result =
                    await response.json();


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.message ||
                        "Unable to create payment."
                    );

                }


                if (!result.checkoutUrl) {

                    throw new Error(
                        "PayMongo checkout URL was not returned."
                    );

                }


                sessionStorage.setItem(
                    "galleryPaymentRequestId",
                    currentAccessRequest.id
                );


                window.location.href =
                    result.checkoutUrl;


            } catch (error) {

                console.error(
                    "GALLERY: PayMongo error:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to start payment."
                );


                if (btnPayMongo) {

                    btnPayMongo.disabled =
                        false;

                    btnPayMongo.innerHTML =
                        `
            <i class="fa-solid fa-credit-card"></i>
            Pay with PayMongo
            `;

                }

            }

        }
        async function checkGalleryPayment() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            if (
                params.get("payment") !== "success"
            ) {

                return;

            }


            const requestId =
                params.get("requestId") ||
                sessionStorage.getItem(
                    "galleryPaymentRequestId"
                );


            const token =
                params.get("token");


            if (!requestId) {
                return;
            }


            for (
                let i = 0;
                i < 10;
                i++
            ) {

                try {

                    const response =
                        await fetch(
                            `${SERVER_URL}/api/gallery-access/payment-status/${requestId}` +
                            `?token=${encodeURIComponent(token || "")}`
                        );


                    const result =
                        await response.json();


                    if (
                        result.paymentConfirmed === true
                    ) {

                        currentAccessRequest.payment_confirmed =
                            true;


                        currentAccessRequest.payment_status =
                            "paid";


                        currentAccessRequest.payment_required =
                            true;


                        if (
                            result.accessExpiresAt
                        ) {

                            currentAccessRequest.access_expires_at =
                                result.accessExpiresAt;

                        }


                        galleryPreviewMode =
                            false;


                        renderGalleryPhotos(
                            currentPhotos
                        );


                        sessionStorage.removeItem(
                            "galleryPaymentRequestId"
                        );


                        alert(
                            "Payment confirmed! Your gallery is now unlocked."
                        );


                        return;

                    }

                } catch (error) {

                    console.error(
                        "GALLERY: Payment verification error:",
                        error
                    );

                }


                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            1500
                        )
                );

            }


            alert(
                "Payment is still being verified. Please refresh shortly."
            );

        }

        function showGalleryError(
            title,
            message
        ) {

            if (galleryTitle) {

                galleryTitle.textContent =
                    title;

            }


            if (gallerySubtitle) {

                gallerySubtitle.textContent =
                    message;

            }


            if (downloadAllBtn) {

                downloadAllBtn.style.display =
                    "none";

            }


            if (!galleryGrid) {
                return;
            }


            galleryGrid.innerHTML = `
            <div class="gallery-loading">

                <i class="fa-solid fa-link-slash"></i>

                <p>
                    ${escapeHTML(message)}
                </p>

                <a
                    href="/customer_gallery_request.html"
                    style="
                        display:inline-block;
                        margin-top:15px;
                        padding:10px 18px;
                        background:#639A88;
                        color:white;
                        text-decoration:none;
                        border-radius:8px;
                    "
                >
                    Enter Gallery Link
                </a>

            </div>
        `;

        }

        function formatDate(dateString) {

            if (!dateString) {

                return "Date not specified";

            }


            const date =
                new Date(
                    dateString +
                    "T00:00:00"
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return dateString;

            }


            return date.toLocaleDateString(
                "en-US",
                {
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            );

        }


        function escapeHTML(value) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        async function initializeGallery() {

            console.log(
                "===================================="
            );

            console.log(
                "GALLERY: Starting initialization..."
            );

            console.log(
                "URL:",
                window.location.href
            );

            console.log(
                "===================================="
            );


            const photosLoaded =
                await loadRepositoryPhotos();


            if (!photosLoaded) {

                console.warn(
                    "GALLERY: Photo loading failed. Initialization stopped."
                );

                return;

            }

            await checkGalleryPayment();

            renderGalleryPhotos(
                currentPhotos
            );


            console.log(
                "GALLERY: Initialization complete."
            );

        }

    </script>
