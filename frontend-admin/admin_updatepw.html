<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/design/admin_updatepw.css">

</head>

<body>

    <div class="reset-container">

        <h1>Reset Password</h1>

        <p>
            Enter your new password below.
        </p>

        <form id="updatePasswordForm">

            <div>
                <label for="newPassword">
                    New Password
                </label>

                <input type="password" id="newPassword" required minlength="6">
            </div>

            <div>
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input type="password" id="confirmPassword" required minlength="6">
            </div>

            <button type="submit">
                Update Password
            </button>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        const form = document.getElementById("updatePasswordForm");
        const button = form.querySelector("button");

        async function initializeRecoverySession() {
            const url = new URL(window.location.href);
            const code = url.searchParams.get("code");
            const hashParams = new URLSearchParams(
                url.hash.substring(1)
            );

            if (code) {
                const { error } =
                    await supabaseClient.auth.exchangeCodeForSession(code);

                if (error) {
                    throw error;
                }

                window.history.replaceState(
                    {},
                    document.title,
                    url.pathname
                );

                return;
            }

            if (
                hashParams.get("type") === "recovery" &&
                hashParams.get("access_token") &&
                hashParams.get("refresh_token")
            ) {
                const { error } =
                    await supabaseClient.auth.setSession({
                        access_token: hashParams.get("access_token"),
                        refresh_token: hashParams.get("refresh_token")
                    });

                if (error) {
                    throw error;
                }

                window.history.replaceState(
                    {},
                    document.title,
                    url.pathname
                );

                return;
            }

            const { data, error } =
                await supabaseClient.auth.getSession();

            if (error || !data.session) {
                throw new Error(
                    "Your password reset link is invalid or expired. Please request a new one."
                );
            }
        }

        let recoveryReady = false;

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!recoveryReady) {
                alert("Your password reset session is not ready. Please reopen the reset link from your email.");
                return;
            }

            const password =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }

            button.disabled = true;
            button.textContent = "Updating...";

            try {
                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (error) {
                    throw error;
                }

                alert("Password updated successfully!");

                await supabaseClient.auth.signOut();

                window.location.href = "/admin/login";
            } catch (error) {
                console.error("Password update error:", error);
                alert(error.message || "Something went wrong. Please try again.");
                button.disabled = false;
                button.textContent = "Update Password";
            }
        });

        initializeRecoverySession()
            .then(() => {
                recoveryReady = true;
            })
            .catch((error) => {
                console.error("Recovery session error:", error);
                alert(error.message || "Invalid or expired reset link. Please request a new one.");
                form.querySelector("button").disabled = true;
            });
    </script>

</body>

</html>
