<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Session - Captured Photography Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/design/customer_booking.css?v=2.0">
</head>

<body>

    <header class="top-navbar">
        <div class="logo-section">
            <img src="/images/captured.png" alt="Logo" class="logo-img">
            <span>CAPTURED</span>
        </div>

        <div class="navbar-right">
            <div class="notification-container">
                <button id="notificationBtn" class="notification-btn">
                    <i class="fa-solid fa-bell"></i>
                    <span id="notificationCount">0</span>
                </button>
                <div id="notificationDropdown" class="notification-dropdown">
                    <div id="notificationList"></div>
                </div>
            </div>

            <div class="user-profile">
                <img id="profile-image" src="/images/default-profile.png" alt="Profile" class="profile-img">
                <span id="customer-name"></span>
            </div>
        </div>
    </header>

    <div class="dashboard-wrapper">

        <aside class="sidebar">
            <nav>
                <a href="customer_booking.html" class="active">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span>Book a Session</span>
                </a>
                <a href="customer_gallery_request.html">
                    <i class="fa-regular fa-image"></i>
                    <span>My Gallery</span>
                </a>
                <a href="customer_profile.html">
                    <i class="fa-regular fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <a href="customer_homepage.html" class="logout-btn">
                <i class="fa-solid fa-arrow-right-from-bracket logout-icon"></i>
                <span>Log out</span>
            </a>
        </aside>

        <main class="content">
            <div class="page-header">
                <h1>Schedule a Session</h1>
                <p>Provide your booking details so we can prepare for your session.</p>
            </div>

            <div class="sessions-panel booking-container">
                <form id="bookingForm" class="booking-form">

                    <!-- Section 1: Contact Information -->
                    <div class="form-section">
                        <h3 class="section-title-form">Contact Information</h3>
                        <div class="form-grid-three">
                            <div class="form-group">
                                <label for="fullName">Full Name</label>
                                <input type="text" id="fullName" placeholder="Enter your name" required>
                            </div>
                            <div class="form-group">
                                <label for="contactNumber">Contact Number <span style="color:red;">*</span></label>
                                <input type="tel" id="contactNumber" placeholder="Enter your contact number"
                                    maxlength="11" inputmode="numeric" autocomplete="tel" required>
                            </div>
                            <div class="form-group">
                                <label for="emailAddress">Email Address</label>
                                <input type="email" id="emailAddress" placeholder="Enter your email" readonly>
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Date, Time & Session Details -->
                    <div class="form-section form-grid-two">
                        <div>
                            <h3 class="section-title-form">Select Date and Time</h3>
                            <div class="form-group icon-input" style="margin-bottom: 15px;">
                                <label for="bookingDate">Photo Session Date <span style="color:red;">*</span></label>
                                <div class="field-wrapper">
                                    <input type="text" id="bookingDate" placeholder="Select a date"
                                        onfocus="(this.type='date')" onblur="(this.type='text')" required>
                                    <i class="fa-regular fa-calendar"></i>
                                </div>
                            </div>
                            <div class="form-group icon-input">
                                <label for="bookingTime">Preferred Time <span style="color:red;">*</span></label>
                                <div class="field-wrapper">
                                    <input type="text" id="bookingTime" placeholder="Select a time"
                                        onfocus="(this.type='time')" onblur="(this.type='text')" required>
                                    <i class="fa-regular fa-clock"></i>
                                </div>
                            </div>
                        </div>

                        <div>
                            <h3 class="section-title-form">Session Details</h3>
                            <div class="form-group" style="margin-bottom: 15px;">
                                <label for="photoPackage">Photo Package</label>
                                <select id="photoPackage">
                                    <option value="" selected>Select a photo package</option>
                                    <option value="basic_1">BASIC 1 (1 person) - ₱399</option>
                                    <option value="basic_2">BASIC 2 (2 persons) - ₱599</option>
                                    <option value="basic_3">BASIC 3 (3 persons) - ₱799</option>
                                    <option value="group_package">GROUP PACKAGE (4-8 persons) - ₱1,999</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="sessionType">Special Sessions</label>
                                <select id="sessionType">
                                    <option value="" selected>Select a session type</option>
                                    <option value="kids">Kids Pre-Birthday Shoot (6 yrs old and below) - ₱1,699</option>
                                    <option value="pre_birthday">Pre-Birthday Shoot (7 yrs old & up) - ₱999</option>
                                    <option value="theme_holiday">Theme / Holiday (3 persons) - ₱1,699</option>
                                    <option value="maternity">Maternity Shoot - ₱999</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Section 3: Reservation Down Payment -->
                    <!-- Section 3: Reservation Down Payment -->
                    <div class="form-section">

                        <div class="section-header-flex">
                            <h3 class="section-title-form">
                                Reservation Down Payment
                            </h3>
                        </div>

                        <div class="form-grid-two">

                            <div>

                                <div class="form-group">
                                    <label for="paymentMethod">
                                        Payment Method
                                        <span style="color:red">*</span>
                                    </label>

                                    <select id="paymentMethod" required>
                                        <option value="" selected disabled>
                                            Select payment method
                                        </option>

                                        <option value="GCash">
                                            GCash
                                        </option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>
                                        <strong>Down Payment</strong>
                                    </label>

                                    <input type="text" value="₱200.00 (Non-refundable)" readonly>
                                </div>

                            </div>


                            <div id="gcashPaymentBox" style="display:none;">

                                <h4 style="margin-bottom:15px;">
                                    Scan to Pay via GCash
                                </h4>

                                <img src="/images/gcash_qr.jpg" alt="GCash QR" style="
                    width:230px;
                    border-radius:12px;
                    border:1px solid #ddd;
                    margin-bottom:20px;
                ">

                                <div class="form-group">

                                    <label>
                                        Upload Proof of Payment
                                    </label>

                                    <input type="file" id="paymentProof" accept="image/png,image/jpeg,image/jpg"
                                        required>

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- Section 4: Notes / Special Requests -->
                    <div class="form-section">
                        <h3 class="section-title-form">Notes/Request (Optional)</h3>
                        <div class="form-group">
                            <textarea id="notes" placeholder="Any special requests or notes?"></textarea>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <div class="form-actions" style="justify-content: stretch;">
                        <button type="submit" class="btn-confirm"
                            style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <i class="fa-solid fa-calendar-check"></i> Confirm Booking
                        </button>
                    </div>

                </form>
            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );
        const paymentMethod =
            document.getElementById("paymentMethod");

        const gcashBox =
            document.getElementById("gcashPaymentBox");

        paymentMethod.addEventListener("change", () => {

            if (paymentMethod.value === "GCash") {

                gcashBox.style.display = "block";

            } else {

                gcashBox.style.display = "none";

            }

        });

        (async () => {

            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                window.location.href = "/frontend-customer/customer_login.html";
                return;
            }

            // Display Google profile
            document.getElementById("customer-name").textContent =
                user.user_metadata.full_name ||
                user.user_metadata.name ||
                user.email;

            document.getElementById("profile-image").src =
                user.user_metadata.avatar_url ||
                user.user_metadata.picture ||
                "/images/default-profile.png";

            document.getElementById("fullName").value =
                user.user_metadata.full_name || "";

            document.getElementById("emailAddress").value =
                user.email;

            document.getElementById("emailAddress").readOnly = true;
            loadNotifications();
        })();

        async function loadNotifications() {

            const { data: { user } } = await supabaseClient.auth.getUser();

            const { data, error } = await supabaseClient
                .from("notifications")
                .select("*")
                .eq("customer_id", user.id)
                .eq("recipient", "customer")
                .order("created_at", { ascending: false });

            if (error) {
                console.log(error);
                return;
            }

            const list = document.getElementById("notificationList");

            list.innerHTML = "";

            let unread = 0;

            data.forEach(notification => {
                console.log(notification.message);
                if (!notification.is_read) {
                    unread++;
                }

                list.innerHTML += `
<div class="notification-item ${notification.is_read ? "" : "unread"}">

    <div class="notification-icon">
        <i class="fa-solid fa-circle-check"></i>
    </div>

    <div class="notification-content">
        <h4>${notification.title}</h4>

        <p class="notification-message">
            ${notification.message}
        </p>

        <small>
            ${notification.created_at
                        ? new Date(notification.created_at).toLocaleString()
                        : ""
                    }
        </small>
    </div>

</div>
`;

            });

            const badge = document.getElementById("notificationCount");

            if (unread > 0) {
                badge.textContent = unread;
                badge.style.display = "inline-flex";
            } else {
                badge.style.display = "none";
            }
        }

        const bookingForm = document.getElementById("bookingForm");

        bookingForm.addEventListener("submit", async (e) => {

            e.preventDefault();

            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                alert("Please login first.");
                return;
            }

            const fullName = document.getElementById("fullName").value.trim();
            const contact = document.getElementById("contactNumber").value.trim();
            const email = user.email;
            const date = document.getElementById("bookingDate").value;
            const time = document.getElementById("bookingTime").value;
            const photoPackage = document.getElementById("photoPackage").value;
            const session = document.getElementById("sessionType").value;
            const paymentMethod = document.getElementById("paymentMethod").value;
            const notes = document.getElementById("notes").value.trim();

            // Validate contact number 
            if (!/^09\d{9}$/.test(contact)) {
                alert("Please enter a valid 11-digit mobile number (e.g. 09123456789).");
                document.getElementById("contactNumber").focus();
                return;
            }

            if (
                !fullName ||
                !contact ||
                !email ||
                !date ||
                !time ||
                !paymentMethod
            ) {
                alert("Please complete all required fields.");
                return;
            }
            const paymentFile = document.getElementById("paymentProof").files[0];

            if (!paymentFile) {
                alert("Please upload your GCash payment proof.");
                return;
            }

            const fileName = `${user.id}/${Date.now()}-${paymentFile.name}`;

            const { error: uploadError } = await supabaseClient.storage
                .from("payment-proofs")
                .upload(fileName, paymentFile);

            if (uploadError) {
                console.error(uploadError);
                alert("Failed to upload payment proof.");
                return;
            }

            const { data: publicUrlData } = supabaseClient.storage
                .from("payment-proofs")
                .getPublicUrl(fileName);

            const paymentProofURL = publicUrlData.publicUrl;
            const { data: bookingData, error } = await supabaseClient
                .from("bookings")
                .insert([
                    {
                        customer_id: user.id,
                        full_name: fullName,
                        contact_number: contact,
                        email: email,
                        booking_date: date,
                        booking_time: time,
                        photo_package: photoPackage || null,
                        session_type: session || null,
                        notes: notes,
                        payment_method: paymentMethod,
                        payment_proof_url: paymentProofURL,
                        downpayment_amount: 200.00,
                        payment_status: "Pending Verificaation",
                        status: "Pending"
                    }
                ])
                .select()
                .single();

            if (error) {
                console.error(error);
                alert(error.message);
                return;
            }

            // CUSTOMER NOTIFICATION
            await supabaseClient
                .from("notifications")
                .insert({
                    customer_id: user.id,
                    booking_id: bookingData.id,
                    recipient: "customer",
                    title: "Booking Submitted",
                    message:
                        "Your booking request has been submitted successfully.. Please wait while the administrator verifies your payment.",
                    is_read: false
                });

            // ADMIN NOTIFICATION
            await supabaseClient
                .from("notifications")
                .insert({
                    customer_id: user.id,
                    booking_id: bookingData.id,
                    recipient: "admin",
                    title: "New Booking Reservation",
                    message:
                        `${fullName} booked a session on ${date} at ${time}\nWaiting for approval.`,
                    is_read: false
                });

            alert("Booking request submitted successfully!");

            bookingForm.reset();

            document.getElementById("fullName").value =
                user.user_metadata.full_name || "";

            document.getElementById("emailAddress").value =
                user.email;
        });

        const contactInput = document.getElementById("contactNumber");

        contactInput.addEventListener("input", function () {

            // Remove everything except numbers
            this.value = this.value.replace(/[^0-9]/g, "");

            // Limit to 11 digits
            if (this.value.length > 11) {
                this.value = this.value.slice(0, 11);
            }

        });

        const notificationBtn = document.getElementById("notificationBtn");

        notificationBtn.addEventListener("click", async () => {

            const dropdown = document.getElementById("notificationDropdown");

            // If already open, just close it
            if (dropdown.style.display === "block") {
                dropdown.style.display = "none";
                return;
            }

            // Open dropdown
            dropdown.style.display = "block";

            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) return;

            // Mark all unread notifications as read
            const { data, error } = await supabaseClient
                .from("notifications")
                .update({ is_read: true })
                .eq("customer_id", user.id)
                .eq("recipient", "customer")
                .eq("is_read", false)
                .select();

            console.log("Updated notifications:", data);

            if (error) {
                console.error("Update error:", error);
                alert(error.message);
                return;
            }

            // Reload notifications and update badge
            await loadNotifications();

        });

        document.addEventListener("click", (e) => {

            const dropdown = document.getElementById("notificationDropdown");

            if (
                !notificationBtn.contains(e.target) &&
                !dropdown.contains(e.target)
            ) {
                dropdown.style.display = "none";
            }

        });

        supabaseClient
            .channel("customer_notifications")
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "notifications"
                },
                async (payload) => {

                    const { data: { user } } = await supabaseClient.auth.getUser();

                    if (
                        payload.new.recipient === "customer" &&
                        payload.new.customer_id === user.id
                    ) {
                        loadNotifications();
                    }
                }
            )
            .subscribe();
    </script>
</body>

</html>
