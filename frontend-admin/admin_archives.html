<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="/design/admin_dashboard.css">
    <link rel="stylesheet" href="/design/admin_client_list.css">
    <link rel="stylesheet" href="/design/admin_repository.css">
    <link rel="stylesheet" href="/design/admin_archives.css?v=1.2">
</head>

<body>

    <header class="top-navbar">
        <div class="logo-section">
            <img src="/images/captured.png" class="logo-box" alt="Captured Studio Logo">

        </div>

        <div class="navbar-right">

            </button>
            <div class="user-profile">
                <img id="userAvatar" class="avatar" src="https://via.placeholder.com/42" alt="Profile">
                <span id="userName">Loading...</span>
            </div>
        </div>
    </header>

    <div class="dashboard-wrapper">

        <aside class="sidebar">
            <nav>
                <a href="admin_dashboard.html">
                    <i class="fa-solid fa-table-cells-large"></i>
                    Dashboard
                </a>
                <a href="admin_client.html">
                    <i class="fa-solid fa-users"></i>
                    Clients
                </a>
                <a href="admin_repository.html">
                    <i class="fa-solid fa-book"></i>
                    Repository
                </a>
                <a href="admin_payment.html">
                    <i class="fa-solid fa-credit-card"></i>
                    Payments
                </a>
                <a href="admin_archives.html" class="active">
                    <i class="fa-solid fa-box-archive"></i>
                    Archives
                </a>
                <a href="admin_profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
                <a href="admin_settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings

            </nav>

            <a href="admin_login.html" class="logout-btn" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket logout-icon"></i>

            </a>
        </aside>

        <main class="content">

            <div class="repo-top-header-block">
                <div class="page-header">
                    <h1>Archives</h1>
                    <p>Review and manage archived customers, folders, and bookings.</p>
                </div>
            </div>

            <div class="archive-tab-navigation">
                <button type="button" class="archive-tab-btn active" data-filter="all">All Archives</button>
                <button type="button" class="archive-tab-btn" data-filter="customer">All Customers</button>
                <button type="button" class="archive-tab-btn" data-filter="folder">All Folders</button>
                <button type="button" class="archive-tab-btn" data-filter="photo">All Photos</button>
            </div>

            <div class="archive-controls-row">
                <div class="archive-search-wrapper">
                    <input type="text" id="archiveSearchInput" placeholder="Search" autocomplete="off">

                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>

            </div>

            <div class="archive-table-card">
                <table class="archive-table">
                    <thead>
                        <tr>
                            <th style="width: 35%;">Item</th>
                            <th style="width: 20%;">Type</th>
                            <th style="width: 25%;">Archived On</th>
                            <th style="width: 25%; text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="archiveTableBody">
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        // Dynamic local database storage array matching your requirements.
        // You can easily replace this array with database tables later!
        let archiveItems = [];

        let currentFilter = "all";
        function escapeHtml(value) {
            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Function to render the table data dynamically based on active filter button
        function renderArchiveTable() {
            const tbody = document.getElementById("archiveTableBody");
            tbody.innerHTML = "";

            const searchInput = document.getElementById("archiveSearchInput");
            const packageFilter = document.getElementById("packageFilter");

            const searchTerm = searchInput
                ? searchInput.value.trim().toLowerCase()
                : "";

            const selectedPackage = packageFilter
                ? packageFilter.value.toLowerCase()
                : "all";

            const filteredItems = archiveItems.filter(item => {

                // -----------------------------------------
                // 1. ARCHIVE CATEGORY FILTER
                // -----------------------------------------
                if (currentFilter !== "all" && item.category !== currentFilter) {
                    return false;
                }

                // -----------------------------------------
                // 2. PACKAGE / SESSION TYPE FILTER
                // -----------------------------------------
                if (
                    selectedPackage !== "all" &&
                    item.sessionType.toLowerCase() !== selectedPackage
                ) {
                    return false;
                }

                // -----------------------------------------
                // 3. SEARCH FILTER
                // -----------------------------------------
                if (searchTerm) {

                    const searchableText = [
                        item.title,
                        item.subtext,
                        item.email,
                        item.sessionType,
                        item.bookingDate,
                        item.archivedDate,
                        item.date,
                        item.time
                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();

                    if (!searchableText.includes(searchTerm)) {
                        return false;
                    }
                }

                return true;
            });

            // -----------------------------------------
            // NO RESULTS
            // -----------------------------------------
            if (filteredItems.length === 0) {
                tbody.innerHTML = `
            <tr>
                <td colspan="4" style="
                    text-align: center;
                    color: #888888;
                    padding: 30px;
                ">
                    No archived items found.
                </td>
            </tr>
        `;
                return;
            }

            // -----------------------------------------
            // DISPLAY RESULTS
            // -----------------------------------------
            filteredItems.forEach(item => {

                const tr = document.createElement("tr");

                tr.innerHTML = `
            <td>
                <div class="item-meta-cell">
                    <h4>${escapeHtml(item.title)}</h4>
                    <p>${escapeHtml(item.subtext)}</p>
                </div>
            </td>

          <td>
    <span class="badge booking-type">
        ${item.category === "customer"
                        ? "Customer"
                        : item.category === "folder"
                            ? "Folder"
                            : item.category === "photo"
                                ? "Photo"
                                : "Booking"
                    }
    </span>
</td>
            <td>
                <div class="timestamp-cell">
                    ${escapeHtml(item.date)}
                    <span>${escapeHtml(item.time)}</span>
                </div>
            </td>

            <td class="actions-cell">
                <select 
                    class="archive-actions-select" 
                    data-id="${item.id}"
                >
                    <option selected disabled>Select Action</option>
                    <option value="restore">Restore</option>
                    <option value="delete">Delete Permanently</option>
                </select>
            </td>
        `;

                tbody.appendChild(tr);

                tr.querySelector(".archive-actions-select")
                    .addEventListener("change", async function () {

                        const action =
                            this.value;

                        try {

                            /*
                             =====================================================
                             RESTORE
                             =====================================================
                            */

                            if (action === "restore") {

                                if (
                                    !confirm(
                                        `Restore "${item.title}"?`
                                    )
                                ) {

                                    this.value = "";
                                    return;

                                }

                                await restoreArchiveItem(item);

                                archiveItems =
                                    archiveItems.filter(
                                        archivedItem =>
                                            !(
                                                archivedItem.id === item.id &&
                                                archivedItem.category === item.category
                                            )
                                    );

                                renderArchiveTable();

                                return;
                            }


                            /*
                             =====================================================
                             PERMANENT DELETE
                             =====================================================
                            */

                            if (action === "delete") {

                                const confirmed =
                                    confirm(
                                        `PERMANENTLY DELETE "${item.title}"?\n\n` +
                                        `This action cannot be undone.`
                                    );

                                if (!confirmed) {

                                    this.value = "";
                                    return;

                                }

                                await permanentlyDeleteArchiveItem(item);

                                archiveItems =
                                    archiveItems.filter(
                                        archivedItem =>
                                            !(
                                                archivedItem.id === item.id &&
                                                archivedItem.category === item.category
                                            )
                                    );

                                renderArchiveTable();

                            }

                        } catch (error) {

                            console.error(
                                "Archive action error:",
                                error
                            );

                            alert(
                                "Action failed:\n\n" +
                                error.message
                            );

                            this.value = "";

                        }

                    });
            });
        }

        // Initialize display on load
        let currentUser = null;

        window.addEventListener("load", async () => {

            try {

                const {
                    data: {
                        session
                    }
                } = await supabaseClient.auth.getSession();

                if (!session) {

                    window.location.href =
                        "admin_login.html";

                    return;
                }

                currentUser =
                    session.user;

                const {
                    data: profile
                } = await supabaseClient
                    .from("staff_profiles")
                    .select("*")
                    .eq("id", currentUser.id)
                    .single();

                if (profile) {

                    document.getElementById(
                        "userName"
                    ).textContent =
                        profile.full_name || "Admin";

                    if (profile.avatar_url) {

                        document.getElementById(
                            "userAvatar"
                        ).src =
                            profile.avatar_url;

                    }

                }

                await archiveCompletedBookings();

                await loadArchivedItems();

            } catch (err) {

                console.error(
                    "Init error:",
                    err
                );

            }

        });
        async function restoreArchiveItem(item) {

            /*
             ============================================================
             RESTORE CUSTOMER / BOOKING
             ============================================================
            */

            if (item.category === "customer") {

                const {
                    error
                } = await supabaseClient
                    .from("bookings")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", item.id);

                if (error) {
                    throw error;
                }

                return;
            }


            /*
             ============================================================
             RESTORE FOLDER
             ============================================================
            */

            if (item.category === "folder") {

                const {
                    error
                } = await supabaseClient
                    .from("repository_client_links")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", item.id);

                if (error) {
                    throw error;
                }

                return;
            }


            /*
             ============================================================
             RESTORE PHOTO
             ============================================================
            */

            if (item.category === "photo") {

                const {
                    error
                } = await supabaseClient
                    .from("repository_photos")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", item.id);

                if (error) {
                    throw error;
                }

                return;
            }

        }
        async function permanentlyDeleteArchiveItem(item) {

            /*
             ============================================================
             DELETE PHOTO
             ============================================================
            */

            if (item.category === "photo") {

                /*
                 * First remove the actual image
                 * from Supabase Storage.
                 */

                if (item.storagePath) {

                    const {
                        error: storageError
                    } = await supabaseClient
                        .storage
                        .from("client-photos")
                        .remove([
                            item.storagePath
                        ]);

                    if (storageError) {

                        console.error(
                            "Storage deletion error:",
                            storageError
                        );

                        throw storageError;
                    }

                }


                /*
                 * Then delete database record.
                 */

                const {
                    error
                } = await supabaseClient
                    .from("repository_photos")
                    .delete()
                    .eq("id", item.id);

                if (error) {
                    throw error;
                }

                return;
            }


            /*
             ============================================================
             DELETE FOLDER
             ============================================================
            */

            if (item.category === "folder") {

                /*
                 * Find all photos inside this folder.
                 */

                const {
                    data: photos,
                    error: photoFetchError
                } = await supabaseClient
                    .from("repository_photos")
                    .select("id, storage_path")
                    .eq("repository_id", item.id);

                if (photoFetchError) {
                    throw photoFetchError;
                }


                /*
                 * Delete physical files from Storage.
                 */

                const storagePaths =
                    (photos || [])
                        .map(photo => photo.storage_path)
                        .filter(Boolean);

                if (storagePaths.length > 0) {

                    const {
                        error: storageError
                    } = await supabaseClient
                        .storage
                        .from("client-photos")
                        .remove(storagePaths);

                    if (storageError) {
                        throw storageError;
                    }

                }


                /*
                 * Delete photo database records.
                 */

                const {
                    error: photoDeleteError
                } = await supabaseClient
                    .from("repository_photos")
                    .delete()
                    .eq("repository_id", item.id);

                if (photoDeleteError) {
                    throw photoDeleteError;
                }


                /*
                 * Delete repository folder.
                 */

                const {
                    error: folderDeleteError
                } = await supabaseClient
                    .from("repository_client_links")
                    .delete()
                    .eq("id", item.id);

                if (folderDeleteError) {
                    throw folderDeleteError;
                }

                return;
            }


            /*
             ============================================================
             DELETE CUSTOMER
             ============================================================
            */

            if (item.category === "customer") {

                /*
                 * Find customer's repository.
                 */

                const {
                    data: repository,
                    error: repositoryError
                } = await supabaseClient
                    .from("repository_client_links")
                    .select("id")
                    .eq("booking_id", item.id);

                if (repositoryError) {
                    throw repositoryError;
                }


                /*
                 * Delete all customer repositories
                 * and their photos.
                 */

                for (
                    const folder of (repository || [])
                ) {

                    const {
                        data: photos,
                        error: photoFetchError
                    } = await supabaseClient
                        .from("repository_photos")
                        .select("id, storage_path")
                        .eq(
                            "repository_id",
                            folder.id
                        );

                    if (photoFetchError) {
                        throw photoFetchError;
                    }


                    const storagePaths =
                        (photos || [])
                            .map(
                                photo =>
                                    photo.storage_path
                            )
                            .filter(Boolean);


                    /*
                     * Delete actual images.
                     */

                    if (
                        storagePaths.length > 0
                    ) {

                        const {
                            error: storageError
                        } = await supabaseClient
                            .storage
                            .from("client-photos")
                            .remove(
                                storagePaths
                            );

                        if (storageError) {
                            throw storageError;
                        }

                    }


                    /*
                     * Delete photo records.
                     */

                    const {
                        error: photoDeleteError
                    } = await supabaseClient
                        .from("repository_photos")
                        .delete()
                        .eq(
                            "repository_id",
                            folder.id
                        );

                    if (photoDeleteError) {
                        throw photoDeleteError;
                    }

                }


                /*
                 * Delete repository folders.
                 */

                const {
                    error: folderDeleteError
                } = await supabaseClient
                    .from("repository_client_links")
                    .delete()
                    .eq(
                        "booking_id",
                        item.id
                    );

                if (folderDeleteError) {
                    throw folderDeleteError;
                }


                /*
                 * Finally delete the booking/client.
                 */

                const {
                    error: bookingDeleteError
                } = await supabaseClient
                    .from("bookings")
                    .delete()
                    .eq(
                        "id",
                        item.id
                    );

                if (bookingDeleteError) {
                    throw bookingDeleteError;
                }

                return;
            }

        }
        async function archiveCompletedBookings() {

            const today = new Date().toISOString().split("T")[0];

            /*
             * IMPORTANT:
             * We only automatically archive outdated bookings here.
             *
             * Completed bookings should be archived when their status
             * is changed to Completed, otherwise restoring a completed
             * booking would immediately archive it again.
             */

            const { error } = await supabaseClient
                .from("bookings")
                .update({
                    is_archived: true,
                    archived_at: new Date().toISOString()
                })
                .lt("booking_date", today)
                .eq("is_archived", false);

            if (error) {
                console.error(
                    "Error archiving outdated bookings:",
                    error
                );
            }
        }
        async function loadArchivedItems() {

            archiveItems = [];

            /*
             ============================================================
             1. ARCHIVED CLIENTS / BOOKINGS
             ============================================================
            */

            const {
                data: archivedBookings,
                error: bookingError
            } = await supabaseClient
                .from("bookings")
                .select("*")
                .eq("is_archived", true)
                .order("archived_at", {
                    ascending: false
                });

            if (bookingError) {

                console.error(
                    "Error loading archived bookings:",
                    bookingError
                );

            } else {

                (archivedBookings || []).forEach(item => {

                    const archivedDate = item.archived_at
                        ? new Date(item.archived_at)
                        : null;

                    archiveItems.push({

                        id: item.id,

                        category: "customer",

                        title:
                            item.full_name ||
                            item.name ||
                            item.client_name ||
                            "Unknown Client",

                        email:
                            item.email || "",

                        sessionType:
                            item.session_type ||
                            "Unspecified",

                        subtext: [
                            item.email,
                            item.session_type
                        ]
                            .filter(Boolean)
                            .join(" • "),

                        bookingDate:
                            item.booking_date || "",

                        archivedDate:
                            item.archived_at || "",

                        date:
                            archivedDate
                                ? archivedDate.toLocaleDateString()
                                : "-",

                        time:
                            archivedDate
                                ? archivedDate.toLocaleTimeString([], {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                })
                                : "-"

                    });

                });

            }


            /*
             ============================================================
             2. ARCHIVED FOLDERS
             ============================================================
            */

            const {
                data: archivedFolders,
                error: folderError
            } = await supabaseClient
                .from("repository_client_links")
                .select(`
            *,
            bookings (
                id,
                full_name,
                email,
                session_type
            )
        `)
                .eq("is_archived", true)
                .order("archived_at", {
                    ascending: false
                });

            if (folderError) {

                console.error(
                    "Error loading archived folders:",
                    folderError
                );

            } else {

                (archivedFolders || []).forEach(folder => {

                    const booking = folder.bookings || {};

                    const archivedDate = folder.archived_at
                        ? new Date(folder.archived_at)
                        : null;

                    archiveItems.push({

                        id: folder.id,

                        category: "folder",

                        title:
                            booking.full_name ||
                            "Customer Folder",

                        email:
                            booking.email || "",

                        sessionType:
                            booking.session_type ||
                            "Folder",

                        subtext:
                            "Customer Repository Folder",

                        bookingId:
                            folder.booking_id,

                        repositoryId:
                            folder.id,

                        archivedDate:
                            folder.archived_at || "",

                        date:
                            archivedDate
                                ? archivedDate.toLocaleDateString()
                                : "-",

                        time:
                            archivedDate
                                ? archivedDate.toLocaleTimeString([], {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                })
                                : "-"

                    });

                });

            }


            /*
             ============================================================
             3. ARCHIVED PHOTOS
             ============================================================
            */

            const {
                data: archivedPhotos,
                error: photoError
            } = await supabaseClient
                .from("repository_photos")
                .select(`
            *,
            bookings (
                id,
                full_name,
                email,
                session_type
            )
        `)
                .eq("is_archived", true)
                .order("archived_at", {
                    ascending: false
                });

            if (photoError) {

                console.error(
                    "Error loading archived photos:",
                    photoError
                );

            } else {

                (archivedPhotos || []).forEach(photo => {

                    const booking = photo.bookings || {};

                    const archivedDate = photo.archived_at
                        ? new Date(photo.archived_at)
                        : null;

                    archiveItems.push({

                        id: photo.id,

                        category: "photo",

                        title:
                            photo.original_name ||
                            "Photo",

                        email:
                            booking.email || "",

                        sessionType:
                            booking.session_type ||
                            "Photo",

                        subtext:
                            booking.full_name
                                ? `Photo from ${booking.full_name}`
                                : "Archived Photo",

                        bookingId:
                            photo.booking_id,

                        repositoryId:
                            photo.repository_id,

                        storagePath:
                            photo.storage_path,

                        archivedDate:
                            photo.archived_at || "",

                        date:
                            archivedDate
                                ? archivedDate.toLocaleDateString()
                                : "-",

                        time:
                            archivedDate
                                ? archivedDate.toLocaleTimeString([], {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                })
                                : "-"

                    });

                });

            }

            renderArchiveTable();
        }
        function populatePackageFilter() {

            const packageFilter = document.getElementById("packageFilter");

            if (!packageFilter) return;

            // Get unique booking types
            const packageTypes = [
                ...new Set(
                    archiveItems
                        .map(item => item.sessionType)
                        .filter(type => type && type.trim() !== "")
                )
            ].sort();

            packageFilter.innerHTML = `
        <option value="all">All Packages</option>
    `;

            packageTypes.forEach(type => {

                const option = document.createElement("option");

                option.value = type.toLowerCase();
                option.textContent = type;

                packageFilter.appendChild(option);
            });
        }
        document
            .getElementById("archiveSearchInput")
            .addEventListener("input", function () {
                renderArchiveTable();
            });
        document.getElementById("logoutBtn").addEventListener("click", async (e) => {
            e.preventDefault();
            await supabaseClient.auth.signOut();
            window.location.href = "admin_login.html";
        });
    </script>
</body>

</html>
