<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery - Website Name</title>

    <!-- Direct Google Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Dedicated CSS for this page only -->
    <link rel="stylesheet" href="/design/customer_gallery_view.css?v=1.2">
</head>

<body>

    <!-- TOP NAVBAR -->
    <header class="top-navbar">
        <div class="logo-section">
            <img src="/images/studio logo.jpg" alt="Logo" class="logo-img">
            <span>Website Name</span>
        </div>

        <div class="navbar-right">
            <i class="fa-solid fa-circle-user" style="color: white; font-size: 32px; cursor: pointer;"></i>
        </div>
    </header>

    <div class="dashboard-wrapper">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <nav>
                <a href="customer_booking.html">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span>Book a Session</span>
                </a>
                <a href="customer_gallery_request.html" class="active">
                    <i class="fa-regular fa-image"></i>
                    <span>My Gallery</span>
                </a>
                <a href="customer_profile.html">
                    <i class="fa-regular fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <a href="customer_homepage.html" class="logout-btn">
                <i class="fa-solid fa-arrow-right-from-bracket logout-icon"></i>
                <span>Log out</span>
            </a>
        </aside>

        <div class="gallery-header">

            <div>

                <h1 id="galleryTitle">Loading...</h1>

                <p id="gallerySubtitle">Loading...</p>

            </div>

            <button id="downloadAllBtn" class="btn-download-all">

                <i class="fa-solid fa-download"></i>

                Download All

            </button>

        </div>

        <!-- Pagination Bar -->
        <div class="gallery-pagination">
            <a href="#" class="page-arrow"><i class="fa-solid fa-chevron-left"></i></a>
            <a href="#" class="page-num">1</a>
            <a href="#" class="page-num">2</a>
            <a href="#" class="page-num active">3</a>
            <a href="#" class="page-num">4</a>
            <a href="#" class="page-num">5</a>
            <span class="page-dots">...</span>
            <a href="#" class="page-num">30</a>
            <a href="#" class="page-arrow"><i class="fa-solid fa-chevron-right"></i></a>
        </div>

        </main>

    </div>

    <!-- PAYMENT REQUIRED POPUP MODAL (Hidden by default) -->
    <div class="modal-overlay" id="paymentModal">
        <div class="payment-modal-card">

            <!-- Dark Modal Header -->
            <div class="modal-header">
                <i class="fa-regular fa-credit-card modal-card-icon"></i>
                <h2>Payment Required</h2>
            </div>

            <!-- Modal Body Content -->
            <div class="modal-body">
                <p class="modal-prompt-text">
                    Complete your payment to save and<br>download your images.
                </p>

                <!-- Action Buttons -->
                <div class="modal-actions-row">
                    <button type="button" class="btn-modal-cancel" id="btnMaybeLater">Maybe Later</button>
                    <!-- Routes to a checkout or payment page -->
                    <a href="customer_checkout.html" class="btn-modal-proceed">Proceed to Payment</a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>

        const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );
        (async () => {

            const {
                data: { user }
            } = await supabaseClient.auth.getUser();

            if (!user) {
                window.location.href = "customer_login.html";
                return;
            }

            loadGallery(user);

        })();

        async function loadGallery(user) {

            const { data: folder, error } = await supabaseClient
                .from("folders")
                .select("*")
                .eq("customer_id", user.id)
                .single();

            if (error || !folder) {

                document.getElementById("galleryTitle").textContent =
                    "No Gallery Available";

                document.getElementById("gallerySubtitle").textContent =
                    "Your gallery has not been assigned yet.";

                return;
            }

            document.getElementById("galleryTitle").textContent =
                folder.folder_name;

            document.getElementById("gallerySubtitle").textContent =
                `${new Date(folder.event_date).toLocaleDateString()}`;

            loadPhotos(folder);

        }
        async function loadPhotos(folder) {

            const { data: photos } = await supabaseClient
                .from("photos")
                .select("*")
                .eq("folder_id", folder.id);

            const grid =
                document.getElementById("galleryGrid");

            grid.innerHTML = "";

            photos.forEach(photo => {

                const image =
                    folder.download_access
                        ? photo.image_url
                        : photo.preview_url;

                grid.innerHTML += `

        <div class="photo-card ${folder.download_access ? "" : "unlocked"}">

            <img src="${image}">

            <button
                class="individual-download-btn"
                onclick="downloadPhoto('${photo.image_url}',${folder.download_access})">

                <i class="fa-solid fa-download"></i>

            </button>

        </div>

        `;

            });

        }
        function downloadPhoto(url, paid) {

            if (!paid) {

                paymentModal.classList.add("active");

                return;

            }

            window.open(url, "_blank");

        }
        document
            .getElementById("downloadAllBtn")
            .addEventListener("click", () => {

                paymentModal.classList.add("active");

            });
        const paymentModal = document.getElementById('paymentModal');
        const triggerButtons = document.querySelectorAll('.btn-trigger-payment');
        const closeButton = document.getElementById('btnMaybeLater');

        // Open modal when download buttons are clicked
        triggerButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault(); // Stop instant anchor linking
                paymentModal.classList.add('active');
            });
        });

        // Close modal when "Maybe Later" is clicked
        closeButton.addEventListener('click', () => {
            paymentModal.classList.remove('active');
        });

        // Close modal when clicking on the dark outer background overlay
        paymentModal.addEventListener('click', (e) => {
            if (e.target === paymentModal) {
                paymentModal.classList.remove('active');
            }
        });

    </script>

</body>

</html>
