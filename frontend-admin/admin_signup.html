<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started - Captured</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/design/admin_signup.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="login-wrapper">

    <!-- Left Panel with Gradient Background & Workspace Branding (Identical to Login) -->
    <div class="left-panel">
      <div class="logo-box"></div>
      <h1 class="brand-heading">Captured Workspace</h1>
      <p class="brand-subtext">Manage your studio, all from one place.</p>
    </div>

    <!-- Right Panel with Signup Form Container -->
    <div class="login-card-container">

      <div class="form-header">
        <h2 class="welcome-heading">Get Started</h2>
        <p class="welcome-subtext">Create your account in seconds.</p>
      </div>

      <form class="login-form" id="staffSignUpForm">

        <div class="input-group">
          <input type="text" id="fullName" autocomplete="name" required placeholder=" ">
          <label for="fullName">Full Name</label>
        </div>

        <div class="input-group">
          <input type="email" id="email" autocomplete="email" required placeholder=" ">
          <label for="email">Email Address</label>
        </div>

        <div class="input-group password-group">
          <input type="password" id="password" autocomplete="new-password" required placeholder=" ">
          <label for="password">Password</label>

          <button type="button" class="toggle-password" id="passwordToggle">
            <i class="fa-regular fa-eye-slash"></i>
          </button>
        </div>

        <button type="submit" class="submit-login-btn">
          Sign up
        </button>

        <p class="signup-footer-text">
          Already have an account? <a href="admin_login.html">Log in</a>
        </p>

      </form>

    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://rprcbeabdvxdenmngxxc.supabase.co";

    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const passwordToggle = document.getElementById("passwordToggle");
    const passwordInput = document.getElementById("password");
    const toggleIcon = passwordToggle.querySelector("i");

    passwordToggle.addEventListener("click", () => {
      const hidden = passwordInput.type === "password";
      passwordInput.type = hidden ? "text" : "password";
      toggleIcon.className = hidden ? "fa-regular fa-eye" : "fa-regular fa-eye-slash";
    });

    document.getElementById("staffSignUpForm").addEventListener("submit", async (e) => {

      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {

        // ==========================
        // CREATE AUTH ACCOUNT
        // ==========================
        const { data: signUpData, error: signUpError } =
          await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: fullName
              }
            }
          });

        if (signUpError) {
          alert(signUpError.message);
          return;
        }

        if (!signUpData.user) {
          alert("Unable to create account.");
          return;
        }

        // ==========================
        // CREATE PROFILE
        // ==========================
        const profile = {
          id: signUpData.user.id,
          full_name: fullName,
          email: email,
          avatar_url: "",
          role: "co-admin",
          verified: true
        };
        // Check if profile already exists
        const { data: existingProfile } = await supabaseClient
          .from("staff_profiles")
          .select("id")
          .eq("id", signUpData.user.id)
          .maybeSingle();

        if (!existingProfile) {

          const { error: insertError } = await supabaseClient
            .from("staff_profiles")
            .insert([profile]);

          if (insertError) {
            alert(insertError.message);
            return;
          }

        }
        // ==========================
        // LOGIN AUTOMATICALLY
        // ==========================
        const { data: loginData, error: loginError } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (loginError) {
          alert(loginError.message);
          return;
        }

        // ==========================
        // GET PROFILE
        // ==========================
        const { data: finalProfile, error: profileError } =
          await supabaseClient
            .from("staff_profiles")
            .select("*")
            .eq("id", loginData.user.id)
            .single();

        if (profileError) {
          alert(profileError.message);
          return;
        }

        // ==========================
        // SAVE SESSION
        // ==========================
        localStorage.setItem(
          "loggedInUserId",
          loginData.user.id
        );

        localStorage.setItem(
          "loggedInUserEmail",
          loginData.user.email
        );

        localStorage.setItem(
          "staffProfile",
          JSON.stringify(finalProfile)
        );

        alert("Account created successfully!");

        // ==========================
        // REDIRECT TO DASHBOARD
        // ==========================
        window.location.href = "/frontend-admin/admin_dashboard.html";

      } catch (err) {

        console.error(err);
        alert("Something went wrong.");

      }

    });


  </script>

</body>

</html>
