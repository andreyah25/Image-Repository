        async function restoreArchiveItem(item) {
            const restorePhotos = async (repositoryId) => {
                const { error } = await supabaseClient
                    .from("repository_photos")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("repository_id", repositoryId);

                if (error) throw error;
            };

            const restoreFolder = async (folderId) => {
                const { data: folder, error: fetchError } = await supabaseClient
                    .from("repository_client_links")
                    .select("id, booking_id")
                    .eq("id", folderId)
                    .single();

                if (fetchError) throw fetchError;

                // Restore the folder itself.
                const { error: folderError } = await supabaseClient
                    .from("repository_client_links")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", folderId);

                if (folderError) throw folderError;

                // Restore all photos belonging to the folder.
                await restorePhotos(folderId);

                // If its booking was archived, restore it so the folder
                // can appear again in the active Repository.
                if (folder.booking_id) {
                    const { error: bookingError } = await supabaseClient
                        .from("bookings")
                        .update({
                            is_archived: false,
                            archived_at: null
                        })
                        .eq("id", folder.booking_id);

                    if (bookingError) throw bookingError;
                }
            };

            if (item.category === "folder") {
                await restoreFolder(item.id);
                alert("Folder and its original photos have been restored.");
                return;
            }

            if (item.category === "customer") {
                // Restore the booking.
                const { error: bookingError } = await supabaseClient
                    .from("bookings")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", item.id);

                if (bookingError) throw bookingError;

                // Restore all folders and photos belonging to the booking.
                const { data: folders, error: folderError } = await supabaseClient
                    .from("repository_client_links")
                    .select("id")
                    .eq("booking_id", item.id);

                if (folderError) throw folderError;

                for (const folder of folders || []) {
                    const { error: restoreFolderError } = await supabaseClient
                        .from("repository_client_links")
                        .update({
                            is_archived: false,
                            archived_at: null
                        })
                        .eq("id", folder.id);

                    if (restoreFolderError) throw restoreFolderError;

                    await restorePhotos(folder.id);
                }

                alert("Customer, folders, and original photos have been restored.");
                return;
            }

            if (item.category === "photo") {
                const { error } = await supabaseClient
                    .from("repository_photos")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", item.id);

                if (error) throw error;

                alert("Photo has been restored.");
                return;
            }

            throw new Error("Unknown archive category: " + item.category);
        }

        async function permanentlyDeleteArchiveItem(item) {
            // IMPORTANT: Match this to the bucket used by your upload process.
            const PHOTO_BUCKET = "repository-photos";
            async function fetchPhotos(repositoryId) {
                const { data, error } = await supabaseClient
                    .from("repository_photos")
                    .select("id, storage_path, compressed_storage_path")
                    .eq("repository_id", repositoryId);

                if (error) throw error;
                return data || [];
            }

            async function deletePhotoFiles(photos) {
                const paths = [
                    ...new Set(
                        (photos || []).flatMap(photo => [
                            photo.storage_path,
                            photo.compressed_storage_path
                        ]).filter(Boolean)
                    )
                ];

                if (paths.length === 0) return;

                // Remove originals and compressed copies from Storage first.
                const { error } = await supabaseClient.storage
                    .from(PHOTO_BUCKET)
                    .remove(paths);

                if (error) {
                    throw new Error(
                        `Failed to delete image files from ${PHOTO_BUCKET}: ${error.message}`
                    );
                }
            }

            if (item.category === "photo") {
                const { data: photo, error: fetchError } = await supabaseClient
                    .from("repository_photos")
                    .select("id, storage_path, compressed_storage_path")
                    .eq("id", item.id)
                    .single();

                if (fetchError) throw fetchError;

                await deletePhotoFiles([photo]);

                const { error: deleteError } = await supabaseClient
                    .from("repository_photos")
                    .delete()
                    .eq("id", item.id);

                if (deleteError) throw deleteError;
                return;
            }

            if (item.category === "folder") {
                const photos = await fetchPhotos(item.id);

                // Delete both original and compressed files.
                await deletePhotoFiles(photos);

                const { error: photoDeleteError } = await supabaseClient
                    .from("repository_photos")
                    .delete()
                    .eq("repository_id", item.id);

                if (photoDeleteError) throw photoDeleteError;

                const { error: folderDeleteError } = await supabaseClient
                    .from("repository_client_links")
                    .delete()
                    .eq("id", item.id);

                if (folderDeleteError) throw folderDeleteError;
                return;
            }

            if (item.category === "customer") {
                const { data: folders, error: folderError } = await supabaseClient
                    .from("repository_client_links")
                    .select("id")
                    .eq("booking_id", item.id);

                if (folderError) throw folderError;

                const allPhotos = [];

                for (const folder of folders || []) {
                    allPhotos.push(...await fetchPhotos(folder.id));
                }

                // Do not remove database records if file deletion fails.
                await deletePhotoFiles(allPhotos);

                // This RPC must delete the customer's associated database records.
                const { error: rpcError } = await supabaseClient.rpc(
                    "permanently_delete_customer",
                    { p_booking_id: item.id }
                );

                if (rpcError) {
                    throw new Error(
                        "Image files were removed, but customer database cleanup failed. " +
                        "Check the permanently_delete_customer RPC: " + rpcError.message
                    );
                }

                const { data: remaining, error: verifyError } = await supabaseClient
                    .from("bookings")
                    .select("id")
                    .eq("id", item.id)
                    .maybeSingle();

                if (verifyError) throw verifyError;

                if (remaining) {
                    throw new Error(
                        "The booking still exists. Check the customer deletion RPC."
                    );
                }

                return;
            }

            throw new Error("Unknown archive category: " + item.category);
        }

        async function archiveCompletedBookings() {

            const twoWeeksAgo = new Date();
            twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
            const archiveCutoffDate = twoWeeksAgo.toISOString().split("T")[0];

            console.log("Checking for records ready to archive (older than 2 weeks)...", archiveCutoffDate);



            const {
                data: bookings,
                error: bookingFetchError
            } = await supabaseClient
                .from("bookings")
                .select("id, full_name, booking_date, status, is_archived")
                .eq("status", "Completed")
                .eq("is_archived", false)
                .lte("booking_date", archiveCutoffDate);

            if (bookingFetchError) {

                console.error(
                    "Error finding bookings ready for archive:",
                    bookingFetchError
                );

                throw bookingFetchError;
            }

            if (!bookings || bookings.length === 0) {

                console.log(
                    "No completed bookings older than 2 weeks are ready to be archived."
                );

                return;
            }


            console.log(
                `${bookings.length} booking(s) older than 2 weeks ready to be archived.`
            );



            for (const booking of bookings) {

                const archiveTime =
                    new Date().toISOString();


                console.log(
                    `Archiving customer: ${booking.full_name}`
                );



                const {
                    data: folders,
                    error: folderFetchError
                } = await supabaseClient
                    .from("repository_client_links")
                    .select("id, booking_id, is_archived")
                    .eq("booking_id", booking.id);

                if (folderFetchError) {

                    console.error(
                        `Error finding folders for ${booking.full_name}:`,
                        folderFetchError
                    );

                    throw folderFetchError;
                }


                /*
                 ========================================================
                 2B. ARCHIVE ALL PHOTOS INSIDE CUSTOMER FOLDERS
                 ========================================================
                */

                for (const folder of (folders || [])) {

                    const {
                        error: photoArchiveError
                    } = await supabaseClient
                        .from("repository_photos")
                        .update({
                            is_archived: true,
                            archived_at: archiveTime
                        })
                        .eq("repository_id", folder.id)
                        .eq("is_archived", false);

                    if (photoArchiveError) {

                        console.error(
                            `Error archiving photos in folder ${folder.id}:`,
                            photoArchiveError
                        );

                        throw photoArchiveError;
                    }



                    /*
                     ====================================================
                     2C. ARCHIVE THE FOLDER
                     ====================================================
                    */

                    const {
                        error: folderArchiveError
                    } = await supabaseClient
                        .from("repository_client_links")
                        .update({
                            is_archived: true,
                            archived_at: archiveTime
                        })
                        .eq("id", folder.id)
                        .eq("is_archived", false);

                    if (folderArchiveError) {

                        console.error(
                            `Error archiving folder ${folder.id}:`,
                            folderArchiveError
                        );

                        throw folderArchiveError;
                    }

                }


                /*
                 ========================================================
                 3. ARCHIVE THE CUSTOMER / BOOKING
                 ========================================================
                */

                const {
                    error: bookingArchiveError
                } = await supabaseClient
                    .from("bookings")
                    .update({
                        is_archived: true,
                        archived_at: archiveTime
                    })
                    .eq("id", booking.id)
                    .eq("is_archived", false);

                if (bookingArchiveError) {

                    console.error(
                        `Error archiving customer ${booking.full_name}:`,
                        bookingArchiveError
                    );

                    throw bookingArchiveError;
                }

                console.log(
                    `Successfully archived: ${booking.full_name}`
                );

            }


            console.log(
                "Finished archiving customers, folders, and photos."
            );
        }

        async function loadArchivedItems() {
            const tbody = document.getElementById("archiveTableBody");

            archiveItems = [];

            if (tbody) {
                tbody.innerHTML = `
            <tr>
                <td colspan="4" style="text-align:center;padding:30px;">
                    Loading archived folders and photos...
                </td>
            </tr>
        `;
            }

            try {
                // 1. Load bookings independently; no nested relationship required.
                const { data: bookings, error: bookingError } = await supabaseClient
                    .from("bookings")
                    .select("id, full_name, email, session_type, booking_date, status, is_archived, archived_at");

                if (bookingError) throw new Error("Bookings query: " + bookingError.message);

                const bookingMap = new Map(
                    (bookings || []).map(booking => [String(booking.id), booking])
                );

                // Show archived customers.
                for (const booking of bookings || []) {
                    if (booking.is_archived !== true) continue;

                    const archivedDate = booking.archived_at
                        ? new Date(booking.archived_at)
                        : null;

                    archiveItems.push({
                        id: booking.id,
                        category: "customer",
                        title: booking.full_name || "Unknown Client",
                        email: booking.email || "",
                        sessionType: booking.session_type || "Unspecified",
                        subtext: booking.email || booking.session_type || "Archived customer",
                        bookingDate: booking.booking_date || "",
                        archivedDate: booking.archived_at || "",
                        date: archivedDate && !Number.isNaN(archivedDate.getTime())
                            ? archivedDate.toLocaleDateString()
                            : "-",
                        time: archivedDate && !Number.isNaN(archivedDate.getTime())
                            ? archivedDate.toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit"
                            })
                            : "-"
                    });
                }

                // 2. Fetch folders without a nested bookings relationship.
                const { data: folders, error: folderError } = await supabaseClient
                    .from("repository_client_links")
                    .select("id, booking_id, is_archived, archived_at");

                if (folderError) throw new Error("Folders query: " + folderError.message);

                // 3. Fetch photos for each folder.
                for (const folder of folders || []) {
                    const { data: photos, error: photoError } = await supabaseClient
                        .from("repository_photos")
                        .select(`
                    id,
                    repository_id,
                    booking_id,
                    original_name,
                    storage_path,
                    image_url,
                    is_archived,
                    archived_at,
                    compressed_storage_path,
                    compressed_file_size,
                    compressed_size_bytes,
                    compression_format,
                    compression_status
                `)
                        .eq("repository_id", folder.id);

                    if (photoError) {
                        throw new Error(
                            `Photos query for folder ${folder.id}: ${photoError.message}`
                        );
                    }

                    const folderPhotos = photos || [];

                    // Generate temporary URLs for original photos in the private bucket.

                    for (const photo of folderPhotos) {
                        const preferredPath =
                            photo.compressed_storage_path || photo.storage_path;

                        if (preferredPath) {
                            const { data, error } = await supabaseClient.storage
                                .from("repository-photos")
                                .createSignedUrl(preferredPath, 3600);

                            if (error) {
                                console.error(
                                    "Could not create photo URL:",
                                    photo.original_name,
                                    error.message
                                );
                                photo.archive_image_url = "";
                            } else {
                                photo.archive_image_url = data.signedUrl;
                            }
                        } else {
                            photo.archive_image_url = photo.image_url || "";
                        }
                    }


                    const booking = bookingMap.get(String(folder.booking_id));

                    // A folder belongs in Archives if the folder itself is archived,
                    // its booking is archived, or at least one of its photos is archived.
                    const shouldDisplay =
                        folder.is_archived === true ||
                        booking?.is_archived === true ||
                        folderPhotos.some(photo => photo.is_archived === true);

                    if (!shouldDisplay) continue;

                    const archiveDate =
                        folder.archived_at ||
                        booking?.archived_at ||
                        folderPhotos.find(photo => photo.archived_at)?.archived_at ||
                        null;

                    const parsedDate = archiveDate ? new Date(archiveDate) : null;

                    archiveItems.push({
                        id: folder.id,
                        category: "folder",
                        title: booking?.full_name || "Customer Repository Folder",
                        email: booking?.email || "",
                        sessionType: booking?.session_type || "Folder",
                        subtext: `${folderPhotos.length} photo(s) in this folder`,
                        bookingId: folder.booking_id,
                        repositoryId: folder.id,
                        photos: folderPhotos,
                        archivedDate: archiveDate || "",
                        date: parsedDate && !Number.isNaN(parsedDate.getTime())
                            ? parsedDate.toLocaleDateString()
                            : "-",
                        time: parsedDate && !Number.isNaN(parsedDate.getTime())
                            ? parsedDate.toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit"
                            })
                            : "-"
                    });
                }

                console.log("Archive loading completed:", {
                    bookingsFound: (bookings || []).length,
                    archivedCustomers: archiveItems.filter(x => x.category === "customer").length,
                    foldersFound: (folders || []).length,
                    displayedFolders: archiveItems.filter(x => x.category === "folder").length,
                    displayedFoldersWithPhotos: archiveItems.filter(
                        x => x.category === "folder" && x.photos.length > 0
                    ).length
                });

            } catch (error) {
                console.error("Failed to load Archives:", error);

                if (tbody) {
                    tbody.innerHTML = `
                <tr>
                    <td colspan="4" style="text-align:center;padding:30px;color:#b91c1c;">
                        <strong>Could not load Archives.</strong>
                        <p>${escapeHtml(error.message || String(error))}</p>
                        <p>Open the browser console for details.</p>
                    </td>
                </tr>
            `;
                }

                throw error;
            }
        }


        function initializeArchiveTabs() {

            const tabButtons =
                document.querySelectorAll(
                    ".archive-tab-btn"
                );


            tabButtons.forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        /*
                         * Remove active state
                         * from every tab.
                         */

                        tabButtons.forEach(tab => {

                            tab.classList.remove(
                                "active"
                            );

                        });


                        /*
                         * Activate clicked tab.
                         */

                        button.classList.add(
                            "active"
                        );


                        /*
                         * Get selected category.
                         */

                        currentFilter =
                            button.dataset.filter ||
                            "all";


                        /*
                         * Re-render table.
                         */

                        renderArchiveTable();

                    }
                );

            });

        }
        function populatePackageFilter() {

            const packageFilter =
                document.getElementById(
                    "packageFilter"
                );


            if (!packageFilter) {
                return;
            }


            /*
             * Save current selection.
             */

            const previousValue =
                packageFilter.value;


            /*
             * Get unique package names.
             */

            const packageTypes = [
                ...new Set(

                    archiveItems
                        .map(
                            item =>
                                item.sessionType
                        )
                        .filter(
                            type =>
                                type &&
                                type.trim() !== ""
                        )

                )
            ]
                .sort(
                    (a, b) =>
                        a.localeCompare(b)
                );


            /*
             * Reset dropdown.
             */

            packageFilter.innerHTML = `

        <option value="all">
            All Packages
        </option>

    `;


            /*
             * Add packages.
             */

            packageTypes.forEach(type => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    type
                        .trim()
                        .toLowerCase();


                option.textContent =
                    type;


                packageFilter.appendChild(
                    option
                );

            });



            if (
                [...packageFilter.options]
                    .some(
                        option =>
                            option.value ===
                            previousValue
                    )
            ) {

                packageFilter.value =
                    previousValue;

            }

        }
        document
            .getElementById("packageFilter")
            .addEventListener(
                "change",
                () => {

                    renderArchiveTable();

                }
            );
        document
            .getElementById("archiveSearchInput")
            .addEventListener(
                "input",
                () => {

                    renderArchiveTable();

                }
            );

        document.addEventListener("DOMContentLoaded", () => {
            const sidebar = document.querySelector(".sidebar");
            const sidebarToggle = document.getElementById("sidebarToggle");

            if (sidebarToggle && sidebar) {
                const icon = sidebarToggle.querySelector("i");

                // 1. Restore saved collapsed state from localStorage on page load
                const isCollapsed = localStorage.getItem("sidebarCollapsed") === "true";
                if (isCollapsed) {
                    sidebar.classList.add("collapsed");
                    if (icon) {
                        icon.classList.remove("fa-bars");
                        icon.classList.add("fa-chevron-right");
                    }
                }

                // 2. Toggle state and save preference to localStorage on click
                sidebarToggle.addEventListener("click", () => {
                    sidebar.classList.toggle("collapsed");
                    const collapsed = sidebar.classList.contains("collapsed");

                    localStorage.setItem("sidebarCollapsed", collapsed ? "true" : "false");

                    if (icon) {
                        if (collapsed) {
                            icon.classList.remove("fa-bars");
                            icon.classList.add("fa-chevron-right");
                        } else {
                            icon.classList.remove("fa-chevron-right");
                            icon.classList.add("fa-bars");
                        }
                    }
                });
            }
        });

    </script>
</body>
