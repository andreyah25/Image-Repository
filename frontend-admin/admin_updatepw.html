<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/design/admin_updatepw.css">

</head>

<body>

    <div class="reset-container">

        <h1>Reset Password</h1>

        <p>
            Enter your new password below.
        </p>

        <form id="updatePasswordForm">

            <div>
                <label for="newPassword">
                    New Password
                </label>

                <input type="password" id="newPassword" required minlength="6">
            </div>

            <div>
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input type="password" id="confirmPassword" required minlength="6">
            </div>

            <button type="submit">
                Update Password
            </button>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://rprcbeabdvxdenmngxxc.supabase.co";

        const SUPABASE_ANON_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcmNiZWFiZHZ4ZGVubW5neHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTAxMTgsImV4cCI6MjA5ODg4NjExOH0.SS0BKTXRBiu1Cclr_1ZRvte4UNnevinwqJAKOX9tLvw";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        const form =
            document.getElementById("updatePasswordForm");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();


            const password =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            // Check if passwords match
            if (password !== confirmPassword) {

                alert("Passwords do not match.");

                return;
            }


            // Check minimum length
            if (password.length < 6) {

                alert("Password must be at least 6 characters.");

                return;
            }


            try {

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });


                if (error) {

                    console.error("Password update error:", error);

                    alert(error.message);

                    return;
                }


                alert(
                    "Password updated successfully!"
                );


                // Return to admin login
                window.location.href =
                    "admin_login.html";


            } catch (error) {

                console.error("Unexpected error:", error);

                alert(
                    "Something went wrong. Please try again."
                );

            }

        });

    </script>

</body>

</html>
