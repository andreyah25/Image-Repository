        function escapeHtml(value) {
            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")

        async function restoreArchiveItem(item) {
            const restorePhotos = async (repositoryId) => {
                const { error } = await supabaseClient
                    .from("repository_photos")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("repository_id", repositoryId);

                if (error) throw error;
            };

            const restoreFolder = async (folderId) => {
                const { data: folder, error: fetchError } = await supabaseClient
                    .from("repository_client_links")
                    .select("id, booking_id")
                    .eq("id", folderId)
                    .single();

                if (fetchError) throw fetchError;

                // Restore the folder itself.
                const { error: folderError } = await supabaseClient
                    .from("repository_client_links")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", folderId);

                if (folderError) throw folderError;

                // Restore all photos belonging to the folder.
                await restorePhotos(folderId);

                // If its booking was archived, restore it so the folder
                // can appear again in the active Repository.
                if (folder.booking_id) {
                    const { error: bookingError } = await supabaseClient
                        .from("bookings")
                        .update({
                            is_archived: false,
                            archived_at: null
                        })
                        .eq("id", folder.booking_id);

                    if (bookingError) throw bookingError;
                }
            };

            if (item.category === "folder") {
                await restoreFolder(item.id);
                alert("Folder and its original photos have been restored.");
                return;
            }

            if (item.category === "customer") {
                // Restore the booking.
                const { error: bookingError } = await supabaseClient
                    .from("bookings")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", item.id);

                if (bookingError) throw bookingError;

                // Restore all folders and photos belonging to the booking.
                const { data: folders, error: folderError } = await supabaseClient
                    .from("repository_client_links")
                    .select("id")
                    .eq("booking_id", item.id);

                if (folderError) throw folderError;

                for (const folder of folders || []) {
                    const { error: restoreFolderError } = await supabaseClient
                        .from("repository_client_links")
                        .update({
                            is_archived: false,
                            archived_at: null
                        })
                        .eq("id", folder.id);

                    if (restoreFolderError) throw restoreFolderError;

                    await restorePhotos(folder.id);
                }

                alert("Customer, folders, and original photos have been restored.");
                return;
            }

            if (item.category === "photo") {
                const { error } = await supabaseClient
                    .from("repository_photos")
                    .update({
                        is_archived: false,
                        archived_at: null
                    })
                    .eq("id", item.id);

                if (error) throw error;

                alert("Photo has been restored.");
                return;
            }

            throw new Error("Unknown archive category: " + item.category);
        }

        async function permanentlyDeleteArchiveItem(item) {
            // IMPORTANT: Match this to the bucket used by your upload process.
            const PHOTO_BUCKET = "repository-photos";
            async function fetchPhotos(repositoryId) {
                const { data, error } = await supabaseClient
                    .from("repository_photos")
                    .select("id, storage_path, compressed_storage_path")
                    .eq("repository_id", repositoryId);

                if (error) throw error;
                return data || [];
            }

            async function deletePhotoFiles(photos) {
                const paths = [
                    ...new Set(
                        (photos || []).flatMap(photo => [
                            photo.storage_path,
                            photo.compressed_storage_path
                        ]).filter(Boolean)
                    )
                ];

                if (paths.length === 0) return;

                // Remove originals and compressed copies from Storage first.
                const { error } = await supabaseClient.storage
                    .from(PHOTO_BUCKET)
                    .remove(paths);

                if (error) {
                    throw new Error(
                        `Failed to delete image files from ${PHOTO_BUCKET}: ${error.message}`
                    );
                }
            }

            if (item.category === "photo") {
                const { data: photo, error: fetchError } = await supabaseClient
                    .from("repository_photos")
                    .select("id, storage_path, compressed_storage_path")
                    .eq("id", item.id)
                    .single();

                if (fetchError) throw fetchError;

                await deletePhotoFiles([photo]);

                const { error: deleteError } = await supabaseClient
                    .from("repository_photos")
                    .delete()
                    .eq("id", item.id);

                if (deleteError) throw deleteError;
                return;
            }

            if (item.category === "folder") {
                const photos = await fetchPhotos(item.id);

                // Delete both original and compressed files.
                await deletePhotoFiles(photos);

                const { error: photoDeleteError } = await supabaseClient
                    .from("repository_photos")
                    .delete()
                    .eq("repository_id", item.id);

                if (photoDeleteError) throw photoDeleteError;

                const { error: folderDeleteError } = await supabaseClient
                    .from("repository_client_links")
                    .delete()
                    .eq("id", item.id);

                if (folderDeleteError) throw folderDeleteError;
                return;
            }

            if (item.category === "customer") {
                const { data: folders, error: folderError } = await supabaseClient
                    .from("repository_client_links")
                    .select("id")
                    .eq("booking_id", item.id);

                if (folderError) throw folderError;

                const allPhotos = [];

                for (const folder of folders || []) {
                    allPhotos.push(...await fetchPhotos(folder.id));
                }

                // Do not remove database records if file deletion fails.
                await deletePhotoFiles(allPhotos);

                // This RPC must delete the customer's associated database records.
                const { error: rpcError } = await supabaseClient.rpc(
                    "permanently_delete_customer",
                    { p_booking_id: item.id }
                );

                if (rpcError) {
                    throw new Error(
                        "Image files were removed, but customer database cleanup failed. " +
                        "Check the permanently_delete_customer RPC: " + rpcError.message
                    );
                }

                const { data: remaining, error: verifyError } = await supabaseClient
                    .from("bookings")
                    .select("id")
                    .eq("id", item.id)
                    .maybeSingle();

                if (verifyError) throw verifyError;

                if (remaining) {
                    throw new Error(
                        "The booking still exists. Check the customer deletion RPC."
                    );
                }

                return;
            }

            throw new Error("Unknown archive category: " + item.category);
        }


        async function archiveCompletedBookings() {
            const cutoffDate = new Date();
            cutoffDate.setMonth(cutoffDate.getMonth() - 2);

            const cutoffTimestamp = cutoffDate.toISOString();

            const { data: bookings, error } = await supabaseClient
                .from("bookings")
                .select("id, full_name, booking_date, completed_at, status, is_archived")
                .eq("status", "Completed")
                .eq("is_archived", false)
                .not("completed_at", "is", null)
                .lte("completed_at", cutoffTimestamp);

            if (error) throw error;

            for (const booking of bookings || []) {
                if (
                    booking.status !== "Completed" ||
                    booking.is_archived !== false ||
                    !booking.completed_at ||
                    new Date(booking.completed_at) > cutoffDate
                ) {
                    continue;
                }

                const archiveTime = new Date().toISOString();

                const { data: folders, error: folderError } = await supabaseClient
                    .from("repository_client_links")
                    .select("id")
                    .eq("booking_id", booking.id);

                if (folderError) throw folderError;

                for (const folder of folders || []) {
                    const { error: photoError } = await supabaseClient
                        .from("repository_photos")
                        .update({
                            is_archived: true,
                            archived_at: archiveTime
                        })
                        .eq("repository_id", folder.id)
                        .eq("is_archived", false);

                    if (photoError) throw photoError;

                    const { error: folderArchiveError } = await supabaseClient
                        .from("repository_client_links")
                        .update({
                            is_archived: true,
                            archived_at: archiveTime
                        })
                        .eq("id", folder.id)
                        .eq("is_archived", false);

                    if (folderArchiveError) throw folderArchiveError;
                }

                const { error: bookingError } = await supabaseClient
                    .from("bookings")
                    .update({
                        is_archived: true,
                        archived_at: archiveTime
                    })
                    .eq("id", booking.id)
                    .eq("status", "Completed")
                    .eq("is_archived", false)
                    .lte("completed_at", cutoffTimestamp);

                if (bookingError) throw bookingError;
            }
        }

        async function archiveFoldersOlderThanTwoMonths() {
            const cutoffDate = new Date();
            cutoffDate.setMonth(cutoffDate.getMonth() - 2);

            const cutoff = cutoffDate.toISOString();

            console.log("Checking folders older than 2 months...", cutoff);

            const { data: folders, error: folderFetchError } = await supabaseClient
                .from("repository_client_links")
                .select("id, booking_id, created_at, is_archived")
                .eq("is_archived", false)
                .lte("created_at", cutoff);

            if (folderFetchError) throw folderFetchError;

            if (!folders || folders.length === 0) {
                console.log("No folders are ready to be archived.");
                return;
            }

            for (const folder of folders) {
                const archiveTime = new Date().toISOString();

                const { error: photoArchiveError } = await supabaseClient
                    .from("repository_photos")
                    .update({
                        is_archived: true,
                        archived_at: archiveTime
                    })
                    .eq("repository_id", folder.id)
                    .eq("is_archived", false);

                if (photoArchiveError) throw photoArchiveError;

                const { error: folderArchiveError } = await supabaseClient
                    .from("repository_client_links")
                    .update({
                        is_archived: true,
                        archived_at: archiveTime
                    })
                    .eq("id", folder.id)
                    .eq("is_archived", false);

                if (folderArchiveError) throw folderArchiveError;

                console.log(`Archived folder: ${folder.id}`);
            }

            console.log("Two-month folder archive check finished.");
        }

        async function loadArchivedItems() {
            archiveItems = [];

            const { data: bookings, error: bookingsError } = await supabaseClient
                .from("bookings")
                .select("*")
                .eq("is_archived", true);

            if (bookingsError) throw bookingsError;

            const { data: folders, error: foldersError } = await supabaseClient
                .from("repository_client_links")
                .select("*");

            if (foldersError) throw foldersError;

            const { data: allPhotos, error: photosError } = await supabaseClient
                .from("repository_photos")
                .select("*");

            if (photosError) throw photosError;

            const bookingMap = new Map(
                (bookings || []).map(booking => [String(booking.id), booking])
            );

            const photosByFolder = new Map();

            for (const photo of allPhotos || []) {
                const folderId = String(photo.repository_id);

                if (!photosByFolder.has(folderId)) {
                    photosByFolder.set(folderId, []);
                }

                photosByFolder.get(folderId).push(photo);
            }


            async function addImageUrl(photo) {
                photo.archive_image_url = "";
                photo.archive_image_is_compressed = false;

                const paths = [
                    photo.compressed_storage_path,
                    photo.storage_path
                ].filter(Boolean);

                for (const path of [...new Set(paths)]) {
                    const { data, error } = await supabaseClient.storage
                        .from("client-photos")
                        .createSignedUrl(path, 3600);

                    if (!error && data?.signedUrl) {
                        photo.archive_image_url = data.signedUrl;
                        photo.archive_image_is_compressed =
                            path === photo.compressed_storage_path;
                        return;
                    }

                    console.warn("Could not create archive image URL:", {
                        photoId: photo.id,
                        path,
                        message: error?.message
                    });
                }
            }


            for (const booking of bookings || []) {
                const bookingFolders = (folders || []).filter(
                    folder => String(folder.booking_id) === String(booking.id)
                );

                archiveItems.push({
                    id: booking.id,
                    category: "customer",
                    title: booking.full_name || "Unknown Customer",
                    subtext: booking.email || "",
                    email: booking.email || "",
                    sessionType: booking.session_type || "",
                    bookingDate: booking.booking_date || "",
                    bookingId: booking.id,
                    repositoryId: "",
                    archivedDate: booking.archived_at || "",
                    date: (booking.archived_at || booking.booking_date || "").split("T")[0],
                    time: booking.archived_at
                        ? new Date(booking.archived_at).toLocaleTimeString()
                        : "",
                    photos: bookingFolders.flatMap(folder =>
                        photosByFolder.get(String(folder.id)) || []
                    )
                });
            }

            for (const folder of folders || []) {
                const booking = folder.booking_id
                    ? bookingMap.get(String(folder.booking_id))
                    : null;

                const folderPhotos = photosByFolder.get(String(folder.id)) || [];

                const hasArchivedPhotos = folderPhotos.some(
                    photo => photo.is_archived === true
                );
                if (folder.is_archived !== true && !booking) {
                    continue;
                }

                for (const photo of folderPhotos) {
                    await addImageUrl(photo);
                }

                const archivedAt =
                    folder.archived_at ||
                    booking?.archived_at ||
                    folderPhotos.find(photo => photo.archived_at)?.archived_at ||
                    folder.created_at ||
                    "";

                archiveItems.push({
                    id: folder.id,
                    category: "folder",
                    title:
                        folder.folder_name ||
                        folder.client_name ||
                        folder.full_name ||
                        booking?.full_name ||
                        "Customer Folder",
                    subtext: booking?.email || folder.email || "",
                    email: booking?.email || folder.email || "",
                    sessionType: booking?.session_type || folder.session_type || "",
                    bookingDate: booking?.booking_date || "",
                    bookingId: folder.booking_id || "",
                    repositoryId: folder.id,
                    archivedDate: archivedAt,
                    date: archivedAt ? archivedAt.split("T")[0] : "-",
                    time: archivedAt && archivedAt.includes("T")
                        ? new Date(archivedAt).toLocaleTimeString()
                        : "",
                    photos: folderPhotos.filter(
                        photo =>
                            photo.is_archived === true ||
                            folder.is_archived === true ||
                            Boolean(booking)
                    )
                });
            }
        }

        function initializeArchiveTabs() {
            document.querySelectorAll(".archive-tab-btn").forEach(button => {
                button.addEventListener("click", () => {
                    document.querySelectorAll(".archive-tab-btn").forEach(tab => {
                        tab.classList.remove("active");
                    });

                    button.classList.add("active");
                    currentFilter = button.dataset.filter || "all";
                    renderArchiveTable();
                });
            });
        }

        function populatePackageFilter() {

            const packageFilter =
                document.getElementById(
                    "packageFilter"
                );


            if (!packageFilter) {
                return;
            }


            /*
             * Save current selection.
             */

            const previousValue =
                packageFilter.value;


            /*
             * Get unique package names.
             */

            const packageTypes = [
                ...new Set(

                    archiveItems
                        .map(
                            item =>
                                item.sessionType
                        )
                        .filter(
                            type =>
                                type &&
                                type.trim() !== ""
                        )

                )
            ]
                .sort(
                    (a, b) =>
                        a.localeCompare(b)
                );


            /*
             * Reset dropdown.
             */

            packageFilter.innerHTML = `

        <option value="all">
            All Packages
        </option>

    `;


            /*
             * Add packages.
             */

            packageTypes.forEach(type => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    type
                        .trim()
                        .toLowerCase();


                option.textContent =
                    type;


                packageFilter.appendChild(
                    option
                );

            });



            if (
                [...packageFilter.options]
                    .some(
                        option =>
                            option.value ===
                            previousValue
                    )
            ) {

                packageFilter.value =
                    previousValue;

            }

        }
        document
            .getElementById("packageFilter")
            .addEventListener(
                "change",
                () => {

                    renderArchiveTable();

                }
            );
        document
            .getElementById("archiveSearchInput")
            .addEventListener(
                "input",
                () => {

                    renderArchiveTable();

                }
            );

        document.addEventListener("DOMContentLoaded", () => {
            const sidebar = document.querySelector(".sidebar");
            const sidebarToggle = document.getElementById("sidebarToggle");

            if (sidebarToggle && sidebar) {
                const icon = sidebarToggle.querySelector("i");

                // 1. Restore saved collapsed state from localStorage on page load
                const isCollapsed = localStorage.getItem("sidebarCollapsed") === "true";
                if (isCollapsed) {
                    sidebar.classList.add("collapsed");
                    if (icon) {
                        icon.classList.remove("fa-bars");
                        icon.classList.add("fa-chevron-right");
                    }
                }

                // 2. Toggle state and save preference to localStorage on click
                sidebarToggle.addEventListener("click", () => {
                    sidebar.classList.toggle("collapsed");
                    const collapsed = sidebar.classList.contains("collapsed");

                    localStorage.setItem("sidebarCollapsed", collapsed ? "true" : "false");

                    if (icon) {
                        if (collapsed) {
                            icon.classList.remove("fa-bars");
                            icon.classList.add("fa-chevron-right");
                        } else {
                            icon.classList.remove("fa-chevron-right");
                            icon.classList.add("fa-bars");
                        }
                    }
                });
            }
        });

    </script>
</body>

</html>
