
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captured Photography Studio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F8F6F3;
            font-family: Arial, sans-serif;
            color: #292E2D;
            overflow: hidden;
        }

        .splash {
            text-align: center;
            width: 100%;
            padding: 30px;
        }

        .top-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 9px;
            background: linear-gradient(
                90deg,
                #E5E9E8,
                #F8DDBB,
                #F9F0A5,
                #DDF5E9
            );
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 25px;
            font-weight: 600;
            letter-spacing: 4px;
        }

        .subtitle {
            margin-top: 10px;
            color: #737B77;
            font-size: 11px;
            letter-spacing: 3px;
        }

        .loader {
            width: 150px;
            height: 3px;
            background: #E8DFE7;
            margin: 35px auto 18px;
            overflow: hidden;
            border-radius: 10px;
        }

        .loader::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            background: #B49DB7;
            animation: loading 1.2s infinite ease-in-out;
            border-radius: 10px;
        }

        .loading-text {
            color: #737B77;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @keyframes loading {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(250%);
            }
        }

        @media (max-width: 600px) {
            .logo {
                width: 95px;
                height: 95px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="top-gradient"></div>

    <div class="splash">

        <img
            src="/images/captured.png"
            alt="Captured Studio Logo"
            class="logo"
        >

        <h1>CAPTURED</h1>

        <div class="subtitle">
            PHOTOGRAPHY STUDIO
        </div>

        <div class="loader"></div>

        <div class="loading-text">
            Preparing your experience...
        </div>

    </div>

    <script>
        setTimeout(() => {
            window.location.replace("/home");
        }, 2500);
    </script>

</body>
</html>
